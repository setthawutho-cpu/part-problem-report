<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>PART BORROWING V2</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#eef4fb;
color:#1d3557;
padding-bottom:100px;
}

/* HEADER */

.header{

background:
linear-gradient(
135deg,
#2b93ff,
#0057ff
);

padding:20px;

border-radius:
0 0 30px 30px;

color:white;

box-shadow:
0 8px 24px
rgba(0,87,255,.20);

}

.header-top{

display:flex;
align-items:center;
gap:12px;

}

.back-btn{

width:46px;
height:46px;

border:none;

border-radius:50%;

background:white;

color:#2563eb;

font-size:18px;

cursor:pointer;

}

.header-info{
flex:1;
}

.header-title{

font-size:24px;
font-weight:700;

}

.header-sub{

font-size:13px;
opacity:.9;

}

.date-box{

min-width:110px;

padding:8px 10px;

background:
rgba(255,255,255,.20);

backdrop-filter:blur(12px);

border-radius:16px;

text-align:center;

font-size:12px;
font-weight:600;

}

/* PAGE */

.container{

max-width:1000px;

margin:auto;

padding:12px;

}

/* CARD */

.card{

background:white;

border-radius:24px;

padding:16px;

margin-bottom:12px;

box-shadow:
0 5px 18px rgba(0,0,0,.05);

}

.section-title{

display:flex;
align-items:center;
gap:8px;

font-size:18px;
font-weight:700;

margin-bottom:14px;

}

/* DETAIL */

.top-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}

select{

width:100%;
height:54px;

border:none;

background:#f4f7fc;

border-radius:16px;

padding:0 15px;

font-size:15px;

outline:none;

}

/* PART */

.part-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.field{

display:flex;
flex-direction:column;

gap:6px;

}

.field label{

font-size:13px;
font-weight:700;

color:#64748b;

}

.field-header{

display:flex;
align-items:center;
justify-content:space-between;

}

input{

width:100%;
height:54px;

border:none;

background:#f4f7fc;

border-radius:16px;

padding:0 15px;

font-size:15px;

outline:none;

}

.scan-btn{

display:flex;
align-items:center;
justify-content:center;

padding:0;

width:auto;
height:auto;

background:none;
border:none;

color:#2563eb;

font-size:16px;

cursor:pointer;

}

.scan-btn:active{
transform:scale(.95);
}

/* BOTTOM */

.bottom-grid{

display:grid;

grid-template-columns:
260px 1fr;

gap:12px;

}

.qty-box{

display:flex;

justify-content:center;

align-items:center;

gap:14px;

margin-top:12px;

}

.qty-btn{

width:50px;
height:50px;

border:none;

border-radius:14px;

background:#f4f7fc;

font-size:22px;

cursor:pointer;

}

.qty-number{

font-size:30px;
font-weight:700;

width:80px;

text-align:center;

}

.photo-list{

display:flex;

gap:8px;

overflow-x:auto;

}

.photo-item{

width:70px;
height:70px;

border-radius:14px;

background:#f4f7fc;

flex:none;

}

.add-photo{

display:flex;
align-items:center;
justify-content:center;

border:
2px dashed #8ab7ff;

color:#2563eb;

font-size:24px;

cursor:pointer;

}

textarea{

width:100%;

height:110px;

border:none;

outline:none;

background:#f4f7fc;

border-radius:16px;

padding:12px;

resize:none;

font-size:14px;

}

/* REVIEW BUTTON */

.floating-review{

position:fixed;

left:16px;
right:16px;

bottom:16px;

height:62px;

border:none;

border-radius:999px;

background:
linear-gradient(
135deg,
#2b93ff,
#0057ff
);

color:white;

font-size:18px;
font-weight:700;

box-shadow:
0 12px 30px
rgba(0,87,255,.35);

z-index:999;

cursor:pointer;

}

.floating-review i{
margin-right:8px;
}

/* MOBILE */

@media(max-width:768px){

.header-title{
font-size:18px;
}

.date-box{
font-size:10px;
}

.top-grid{
gap:8px;
}

.part-grid{
gap:8px;
}

.part-grid{
grid-template-columns:1fr 1fr;
gap:8px;
}

.bottom-grid{
grid-template-columns:42% 58%;
gap:8px;
}

.card{
padding:12px;
}

input,
select{
height:46px;
font-size:13px;
}

.field label{
font-size:11px;
}

.section-title{
font-size:15px;
}

}

</style>
</head>

<body>

<header class="header">

<div class="header-top">

<button
class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="header-info">

<div class="header-title">
PART BORROWING
</div>

<div class="header-sub">
Part Loan / Return / Defect
</div>

</div>

<div
class="date-box"
id="dateBox">
</div>

</div>

</header>

<div class="container">

<!-- DETAIL -->

<div class="card">

<div class="top-grid">

<select>
<option>Detail</option>
<option>ยืมชิ้นส่วน</option>
<option>คืนชิ้นส่วน</option>
<option>Defect</option>
</select>

<select>
<option>Location</option>
<option>Box</option>
<option>Rack</option>
<option>Set Packing</option>
</select>

</div>

</div>

<!-- PART -->

<div class="card">

<div class="section-title">

<i class="fa-solid fa-box"></i>

Part Information

</div>

<div class="part-grid">

<div class="field">

    <div class="field-header">
        <label>Part No.</label>

        <button class="scan-btn">
            <i class="fa-solid fa-qrcode"></i>
        </button>
    </div>

    <input placeholder="Part No.">

</div>

<div class="field">
    <label>Part Name</label>
    <input readonly>
</div>

<div class="field">
    <label>Model</label>
    <input readonly>
</div>

<div class="field">
    <label>Supplier</label>
    <input readonly>
</div>

</div>

</div>

<!-- QTY + PHOTO -->

<div class="bottom-grid">

<div class="card">

<div class="section-title">

<i class="fa-solid fa-hashtag"></i>

Qty

</div>

<div class="qty-box">

<button class="qty-btn">−</button>

<div class="qty-number">
1
</div>

<button class="qty-btn">+
</button>

</div>

</div>

<div class="card">

<div class="section-title">

<i class="fa-solid fa-camera"></i>

Photo

</div>

<div class="photo-list">

<div class="photo-item add-photo">

<i class="fa-solid fa-plus"></i>

</div>

</div>

</div>

</div>

<!-- REMARK -->

<div class="card">

<div class="section-title">

<i class="fa-solid fa-note-sticky"></i>

Remark

</div>

<textarea
placeholder="Add remark..."></textarea>

</div>

</div>

<button
class="floating-review">

<i class="fa-solid fa-file-lines"></i>

Review Report

</button>

<script>

function updateDate(){

const now = new Date();

const date =
now.toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

const time =
now.toLocaleTimeString("en-GB",{
hour:"2-digit",
minute:"2-digit"
});

document.getElementById("dateBox").innerHTML =
date + "<br>" + time;

}

updateDate();

setInterval(updateDate,1000);

</script>

</body>
</html>
