<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PART BORROWING V2</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

html,
body{
overflow-x:hidden;
touch-action:manipulation;
}

body{
background:#eef4fb;
color:#1d3557;
padding-bottom:100px;
}

/* HEADER */

.header{

background:
linear-gradient(
135deg,
#2b93ff,
#0057ff
);

padding:20px;

border-radius:
0 0 30px 30px;

color:white;

box-shadow:
0 8px 24px
rgba(0,87,255,.20);

}

.header-top{

display:flex;
align-items:center;
gap:12px;

}

.back-btn{

width:46px;
height:46px;

border:none;

border-radius:50%;

background:white;

color:#2563eb;

font-size:18px;

cursor:pointer;

}

.header-info{
flex:1;
}

.header-title{

font-size:28px;
font-weight:700;

}

.header-sub{

font-size:13px;
opacity:.9;

}

.date-box{

min-width:110px;

padding:8px 10px;

background:
rgba(255,255,255,.20);

backdrop-filter:blur(12px);

border-radius:16px;

text-align:center;

font-size:12px;
font-weight:600;

}

/* PAGE */

.container{

max-width:1000px;

margin:auto;

padding:12px;

}

/* CARD */

.card{

background:white;

border-radius:24px;

padding:16px;

margin-bottom:12px;

box-shadow:
0 5px 18px rgba(0,0,0,.05);

}

.section-title{
display:flex;
align-items:center;
gap:10px;
font-size:18px;
font-weight:700;
margin-bottom:12px;
}

/* DETAIL */

.top-grid{
display:grid;
grid-template-columns:
1fr 1fr;
gap:12px;
}

.info-card{
padding:12px;
}

.info-card h3{
margin-bottom:8px;
font-size:16px;
font-weight:700;
text-align:center;
color:#173c83;
}
    
#setPackingField{
display:none;
}

.select{
width:100%;
height:54px;
border:none;
outline:none;
padding:0 16px;
border-radius:16px;
font-size:18px;
background:#fff;
color:#000;
-webkit-appearance:none;
appearance:none;
}

select{

width:100%;
height:54px;

border:none;

background:#f4f7fc;

border-radius:16px;

padding:0 15px;

font-size:15px;

outline:none;

}

/* PART */

.part-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.field{

display:flex;
flex-direction:column;

gap:6px;

}

.field label{

font-size:15px;
font-weight:700;

color:#64748b;

}

.field-header{

display:flex;
align-items:center;
justify-content:space-between;

}

input{

width:100%;
height:54px;

border:none;

background:#f4f7fc;

border-radius:16px;

padding:0 15px;

font-size:15px;

outline:none;

}

.scan-btn{

display:flex;
align-items:center;
justify-content:center;

padding:0;

width:auto;
height:auto;

background:none;
border:none;

color:#2563eb;

font-size:16px;

cursor:pointer;

}

.scan-btn:active{
transform:scale(.95);
}

/* BOTTOM */

.bottom-grid{
display:grid;
grid-template-columns:
280px 1fr;
gap:16px;
margin-top:16px;
}

.qty-card,
.photo-card{
padding:14px;
overflow:hidden;
}

.qty-box{
margin-top:18px;
display:flex;
align-items:center;
justify-content:center;
background:white;
border-radius:18px;
overflow:hidden;
gap:0;
}

.qty-btn{
width:70px;
height:80px;
border:none;
font-size:36px;
background:white;
cursor:pointer;
border-radius:0;
}

.qty-number{
width:120px;
height:80px;
border:none;
outline:none;
background:white;
text-align:center;
font-size:54px;
font-weight:700;
appearance:textfield;
}

.qty-number::-webkit-inner-spin-button,
.qty-number::-webkit-outer-spin-button{
-webkit-appearance:none;
margin:0;
}

.photo-list{
display:flex;
gap:8px;

width:100%;
max-width:100%;

overflow-x:auto;
overflow-y:hidden;

white-space:nowrap;
}

.photo-list::-webkit-scrollbar{
height:4px;
}

.photo-list::-webkit-scrollbar-thumb{
background:#b8c7dd;
border-radius:999px;
}

.photo-item{
width:70px;
height:70px;
flex:0 0 70px;
border-radius:12px;
overflow:hidden;
background:#fff;
}

.photo-item img{
width:100%;
height:100%;
object-fit:cover;
}

.photo-item{
position:relative;
cursor:pointer;
}

.add-photo{
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
color:#1f8fff;
cursor:pointer;
border:none;
}

textarea{

width:100%;

height:110px;

border:none;

outline:none;

background:#f4f7fc;

border-radius:16px;

padding:12px;

resize:none;

font-size:14px;

}

/* REVIEW BUTTON */

.floating-review{

position:fixed;

left:16px;
right:16px;

bottom:16px;

height:62px;

border:none;

border-radius:999px;

background:
linear-gradient(
135deg,
#2b93ff,
#0057ff
);

color:white;

font-size:18px;
font-weight:700;

box-shadow:
0 12px 30px
rgba(0,87,255,.35);

z-index:999;

cursor:pointer;

}

.floating-review i{
margin-right:8px;
}

.report-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
display:none;
align-items:flex-start;
justify-content:center;
padding-top:40px;
z-index:99999;
backdrop-filter:blur(3px);
}

.report-overlay.show{
display:flex;
}

.report-sheet{
position:relative;
width:95%;
max-width:700px;
max-height:90vh;
background:#fff;
border-radius:24px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.report-content{
flex:1;
overflow:auto;
padding:20px;
white-space:pre-wrap;
line-height:1.5;
color:#000;
}

.report-actions{
display:flex;
gap:8px;
padding:12px;
border-top:1px solid #ddd;
}

.report-actions button{
flex:1;
height:46px;
border:none;
border-radius:12px;
color:#fff;
font-weight:700;
}

.btn-save{background:#4caf50;}
.btn-copy{background:#9c27b0;}
.btn-line{background:#06C755;}

.add-btn{
position:absolute;
top:10px;
right:10px;
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#2196f3;
color:#fff;
font-size:20px;
}

/* MOBILE */

@media(max-width:768px){

.header-title{
font-size:18px;
}

.date-box{
font-size:10px;
}

.top-grid{
gap:8px;
}

.info-card{
padding:7px;
}

.info-card h3{
font-size:11px;
margin-bottom:6px;
text-align:center;
}

.select{
height:32px;
font-size:10px;

background:#fff;
color:#000;

-webkit-appearance:none;
appearance:none;
}

#setPackingNo{
font-size:10px;
}

.part-grid{
grid-template-columns:1fr 1fr;
gap:8px;
}

.bottom-grid{
display:grid;
grid-template-columns:
1fr 1.9fr;
gap:10px;
}

.card{
padding:12px;
}

input,
select,
textarea{
height:42px;
font-size:13px;
padding:0 12px;
}

#partNo,
#partName,
#model,
#supplier{
font-size:12px;
}

.field label{
font-size:11px;
line-height:1.5;
}

.section-title{
font-size:15px;
margin-bottom:12px;
}

.qty-card,
.photo-card{
padding:12px;
height:120px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.qty-box{
margin-top:12px;
}

.qty-btn{
width:32px;
height:40px;
font-size:18px;
}

.qty-number{
width:50px;
height:40px;
border:none;
outline:none;
background:white;
text-align:center;
font-size:26px;
font-weight:700;
}

.photo-item{
width:52px;
height:52px;
flex:0 0 52px;
border-radius:10px;
overflow:hidden;
}

.photo-list{
display:flex;
gap:8px;
align-items:center;
width:100%;
max-width:100%;
height:52px;
overflow-x:auto;
overflow-y:hidden;
flex-wrap:nowrap;
white-space:nowrap;
margin-top:auto;
margin-bottom:auto;
}

.photo-list::-webkit-scrollbar{
display:none;
}

}
    
</style>
</head>

<body>

<header class="header">

<div class="header-top">

<button
class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="header-info">

<div class="header-title">
PART BORROWING FROM PL
</div>

<div class="header-sub">
Part Loan / Return / Defect
</div>

</div>

<div
class="date-box"
id="dateBox">
</div>

</div>

</header>

<div class="container">

<!-- DETAIL -->

<div class="top-grid" id="topGrid">

<div class="card info-card">
<h3>Detail</h3>

<select id="detailSelect" class="select">
<option></option>
<option>ยืมชิ้นส่วน</option>
<option>คืนชิ้นส่วน</option>
<option>Defect</option>
</select>
</div>

<div class="card info-card">
<h3>Location</h3>

<select id="locationSelect" class="select">
<option></option>
<option>Box</option>
<option>Rack</option>
<option>Set Packing</option>
</select>
</div>

<div
class="card info-card"
id="setPackingField"
style="display:none;">

<h3>Set Packing No.</h3>

<input
id="setPackingNo"
class="select"
placeholder="00001">

</div>

</div>

<!-- PART -->

<div class="card">

<div class="section-title">

<i class="fa-solid fa-box"></i>

Part Information

</div>

<div class="part-grid">

<div class="field">

<div class="field-header">

<label>Part No.</label>

<button
type="button"
id="scanQrBtn"
class="scan-btn"
onclick="openScanPage()">

<i class="fa-solid fa-qrcode"></i>

</button>

</div>

<input
id="partNo"
list="partList"
placeholder="Part No.">

<datalist id="partList"></datalist>

</div>

<div class="field">

<label>Part Name</label>

<input
id="partName"
readonly
onclick="editField(this)"
onblur="restoreAuto(this)">

</div>

<div class="field">

<label>Model</label>

<input
id="model"
readonly
onclick="editField(this)"
onblur="restoreAuto(this)">

</div>

<div class="field">

<label>Supplier</label>

<input
id="supplier"
readonly
onclick="editField(this)"
onblur="restoreAuto(this)">

</div>

</div>

</div>

<!-- QTY + PHOTO -->

<div class="bottom-grid">

<div class="card qty-card">

<div class="section-title">
<i class="fa-solid fa-hashtag"></i>
Qty

</div>

<div class="qty-box">

<button id="minus" class="qty-btn">−</button>

<input
type="number"
id="qty"
class="qty-number"
value="1"
min="1">

<button id="plus" class="qty-btn">+</button>

</div>

</div>

<div class="card photo-card">

<div class="section-title">

<i class="fa-solid fa-camera"></i>

Photo

</div>

<input
type="file"
id="photoInput"
multiple
hidden>

<div class="photo-list" id="photoList">
    <div class="photo-item add-photo"
         onclick="document.getElementById('photoInput').click()">
        +
    </div>
</div>

</div>

</div>

</div>

<!-- REMARK -->

<div class="card">

<div class="section-title">

<i class="fa-solid fa-note-sticky"></i>

Remark

</div>

<textarea
placeholder="Add remark..."></textarea>

</div>

</div>

<button
class="floating-review"
onclick="reviewReport()">

<i class="fa-solid fa-file-lines"></i>

Review Report

</button>

<script>

function updateDate(){

const now = new Date();

const date =
now.toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

const time =
now.toLocaleTimeString("en-GB",{
hour:"2-digit",
minute:"2-digit"
});

document.getElementById("dateBox").innerHTML =
date + "<br>" + time;

}

updateDate();

setInterval(updateDate,1000);

</script>

<script>

const locationSelect =
document.getElementById("locationSelect");

const setPackingField =
document.getElementById("setPackingField");

const topGrid =
document.getElementById("topGrid");

locationSelect.addEventListener("change",function(){

if(this.value === "Set Packing"){

setPackingField.style.display = "block";

topGrid.style.gridTemplateColumns =
"1fr 1fr 1.2fr";

}else{

setPackingField.style.display = "none";

topGrid.style.gridTemplateColumns =
"1fr 1fr";

}

});

</script>

<script>

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

try{

const response =
await fetch("ข้อมูล Excel.xlsx");

const data =
await response.arrayBuffer();

const workbook =
XLSX.read(data,{type:"array"});

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const rows =
XLSX.utils.sheet_to_json(sheet);

rows.forEach(row=>{

const partNo =
String(row.PartNo || "").trim();

if(!partNo) return;

if(!allPartNo.includes(partNo)){
allPartNo.push(partNo);
}

partMaster[partNo] = {

partName:
row.PartName || "",

supplier:
row.Supplier || "",

model:
row.Model || ""

};

});

}catch(err){

console.error(err);

}

}

loadExcel();

function editField(el){

if(el.hasAttribute("readonly")){

el.dataset.autoValue = el.value;

el.removeAttribute("readonly");

el.value = "";

setTimeout(()=>{

el.focus();

},50);

}

}

function restoreAuto(el){

if(el.value.trim()===""){

el.value = el.dataset.autoValue || "";

}

}

function fillPartData(partNo){

if(!partMaster[partNo]) return;

const partName =
document.getElementById("partName");

const model =
document.getElementById("model");

const supplier =
document.getElementById("supplier");

partName.setAttribute("readonly",true);
model.setAttribute("readonly",true);
supplier.setAttribute("readonly",true);

partName.value =
partMaster[partNo].partName || "";

model.value =
partMaster[partNo].model || "";

supplier.value =
partMaster[partNo].supplier || "";

}

document
.getElementById("partNo")
.addEventListener("input",function(){

const keyword =
this.value.trim();

const list =
document.getElementById("partList");

if(keyword===""){

document.getElementById("partName").value="";
document.getElementById("model").value="";
document.getElementById("supplier").value="";

document.getElementById("partName")
.setAttribute("readonly",true);

document.getElementById("model")
.setAttribute("readonly",true);

document.getElementById("supplier")
.setAttribute("readonly",true);

list.innerHTML="";
return;

}

if(partMaster[keyword]){

fillPartData(keyword);

list.innerHTML="";
return;

}

if(keyword.length < 4){

list.innerHTML="";
return;

}

const cleanKeyword =
keyword
.replace(/[^A-Za-z0-9]/g,"")
.toUpperCase();

const result =
allPartNo
.filter(p=>{

const cleanPart =
p
.replace(/[^A-Za-z0-9]/g,"")
.toUpperCase();

return (

p.toUpperCase().startsWith(keyword.toUpperCase())

||

p.toUpperCase().includes(keyword.toUpperCase())

||

cleanPart.includes(cleanKeyword)

);

})
.slice(0,50);

list.innerHTML =
result.map(p =>
`<option value="${p}"></option>`)
.join("");

});

document
.getElementById("partNo")
.addEventListener("change",function(){

const key =
this.value.trim();

if(partMaster[key]){

fillPartData(key);
return;

}

const cleanKey =
key
.replace(/[^A-Za-z0-9]/g,"")
.toUpperCase();

const found =
allPartNo.find(p=>

p
.replace(/[^A-Za-z0-9]/g,"")
.toUpperCase()

=== cleanKey

);

if(found){

this.value = found;

fillPartData(found);

}

});

function openScanPage(){
location.href="scan.html";
}

function receiveScannedPart(){

const partNo =
localStorage.getItem("scannedPartNo");

if(!partNo) return;

document.getElementById("partNo").value =
partNo;

document.getElementById("partNo")
.dispatchEvent(new Event("input"));

document.getElementById("partNo")
.dispatchEvent(new Event("change"));

localStorage.removeItem("scannedPartNo");

}

window.addEventListener(
"load",
receiveScannedPart
);

window.addEventListener(
"pageshow",
receiveScannedPart
);

</script>

<script>

const qty=document.getElementById('qty');

document.getElementById('plus')
.onclick=()=>{
qty.value=
Number(qty.value)+1;
};

document.getElementById('minus')
.onclick=()=>{
if(Number(qty.value)>1){
qty.value=
Number(qty.value)-1;
}
};

</script>

<script>

let reportEditMode=false;

function reviewReport(){

let text="";

text += "PART BORROWING FROM PL\n\n";

text += "Date : " +
document.getElementById("dateBox").innerText.replace("\n"," ")
+ "\n";

text += "Detail : " +
(document.getElementById("detailSelect").value||"-")
+ "\n";

text += "Location : " +
(document.getElementById("locationSelect").value||"-")
+ "\n";

text += "Part No : " +
(document.getElementById("partNo").value||"-")
+ "\n";

text += "Part Name : " +
(document.getElementById("partName").value||"-")
+ "\n";

text += "Model : " +
(document.getElementById("model").value||"-")
+ "\n";

text += "Supplier : " +
(document.getElementById("supplier").value||"-")
+ "\n";

text += "Qty : " +
(document.getElementById("qty").value||"1");

document.getElementById("report").innerText =
text;

document
.getElementById("reportOverlay")
.classList.add("show");

}

function toggleEditReport(){

const report=
document.getElementById("report");

const btn=
document.getElementById("editBtn");

if(!reportEditMode){

report.contentEditable="true";
btn.innerHTML="💾";
btn.style.background="#4caf50";
reportEditMode=true;

}else{

report.contentEditable="false";
btn.innerHTML="📝";
btn.style.background="#2196f3";
reportEditMode=false;

}

}

function saveReport(){

const text=
document.getElementById("report").innerText;

const blob=
new Blob([text],{type:"text/plain"});

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"Borrowing_Report.txt";

a.click();

}

function copyReport(){

navigator.clipboard.writeText(
document.getElementById("report").innerText
);

}

function sendLine(){

window.open(
"https://line.me/R/share?text="+
encodeURIComponent(
document.getElementById("report").innerText
),
"_blank"
);

}

document
.getElementById("reportOverlay")
.addEventListener("click",function(e){

if(e.target===this){

this.classList.remove("show");

}

});

</script>

<script>

document.getElementById("photoInput")
.addEventListener("change",function(){

const photoList =
document.getElementById("photoList");

for(const file of this.files){

const reader = new FileReader();

reader.onload = function(e){

const div =
document.createElement("div");

div.className = "photo-item";

div.innerHTML =
`<img src="${e.target.result}">`;

div.onclick=function(){
this.remove();
};

photoList.insertBefore(
div,
photoList.querySelector(".add-photo")
);

};

reader.readAsDataURL(file);

}

});

</script>

<div id="reportOverlay" class="report-overlay">

<div class="report-sheet">

<button
id="editBtn"
class="add-btn"
onclick="toggleEditReport()">
📝
</button>

<div
id="report"
class="report-content"
contenteditable="false">
</div>

<div class="report-actions">

<button
class="btn-save"
onclick="saveReport()">
💾 Save
</button>

<button
class="btn-copy"
onclick="copyReport()">
📋 Copy
</button>

<button
class="btn-line"
onclick="sendLine()">
📤 LINE
</button>

</div>

</div>

</div>

</body>
</html>
