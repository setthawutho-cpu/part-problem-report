<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>SETTINGS</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

input,
select,
textarea{
    font-size:16px !important;
    -webkit-text-size-adjust:100%;
}

*{
    -webkit-tap-highlight-color:transparent;
}

body{
    touch-action:manipulation;
}

.header{
    background:#ff9800;
    color:white;
    text-align:center;
    padding:16px;
    font-size:22px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:450px;
    margin:auto;
    background:#c7d9ea;
    padding:8px;
    padding-top:15px;
    padding-bottom:80px;
    border-radius:8px;
    box-sizing:border-box;
}

.setting-btn{
    width:100%;
    display:block;
    margin:8px 0;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

/* Master */
.partmaster{background:#2196f3;}
.stdmaster{background:#4caf50;}
.dashboard{background:#673ab7;}

/* Setting */
.language{background:#3f51b5;}
.theme{background:#795548;}

/* Data */
.backup{background:#009688;}
.restore{background:#00acc1;}

/* Support */
.instruction{background:#ff9800;}
.contact{background:#e91e63;}
.version{background:#607d8b;}

.bottom-nav button,
.bottom-nav button span{
    font-weight:400 !important;
}

</style>
</head>
<body>

<div class="header">
⚙️ SETTINGS
</div>

<div class="container">

<button class="setting-btn partmaster"
onclick="location.href='part-master.html'">
📦 PART MASTER
</button>

<button class="setting-btn stdmaster"
onclick="location.href='standard-master.html'">
📝 STANDARD MASTER
</button>

<button class="setting-btn dashboard"
onclick="location.href='dashboard.html'">
📊 DASHBOARD
</button>

<button class="setting-btn language"
onclick="changeLanguage()">
🌐 LANGUAGE : <span id="langText">EN</span>
</button>

<button class="setting-btn theme"
onclick="alert('Theme Setting')">
🎨 THEME
</button>

<button class="setting-btn backup"
onclick="alert('Backup Data')">
📁 BACKUP DATA
</button>

<button class="setting-btn restore"
onclick="alert('Restore Data')">
📥 RESTORE DATA
</button>

<button class="setting-btn instruction"
onclick="location.href='instruction.html'">
📖 WORK INSTRUCTION
</button>

<button class="setting-btn contact"
onclick="location.href='contact.html'">
📞 CONTACT ADMIN
</button>

<button class="setting-btn version">
ℹ️ VERSION 1.0
</button>

</div>

<script>

const languages = ["EN","TH","JP"];
let langIndex = Number(localStorage.getItem("language")) || 0;

function changeLanguage(){

    langIndex++;

    if(langIndex >= languages.length){
        langIndex = 0;
    }

    localStorage.setItem("language", langIndex);

    applyLanguage();
}

function applyLanguage(){

    const btn = document.querySelectorAll(".setting-btn");
    const lang = languages[langIndex];

    if(lang === "TH"){

        document.querySelector(".header").innerHTML = "⚙️ ตั้งค่า";

        btn[0].innerHTML = "📦 ข้อมูลชิ้นส่วน";
        btn[1].innerHTML = "📝 มาตรฐาน";
        btn[2].innerHTML = "📊 แดชบอร์ด";
        btn[3].innerHTML = "🌐 ภาษา : <span id='langText'>TH</span>";
        btn[4].innerHTML = "🎨 ธีม";
        btn[5].innerHTML = "📁 สำรองข้อมูล";
        btn[6].innerHTML = "📥 กู้คืนข้อมูล";
        btn[7].innerHTML = "📖 คู่มือการใช้งาน";
        btn[8].innerHTML = "📞 ติดต่อผู้ดูแล";
        btn[9].innerHTML = "ℹ️ เวอร์ชัน 1.0";

    }
    else if(lang === "JP"){

        document.querySelector(".header").innerHTML = "⚙️ 設定";

        btn[0].innerHTML = "📦 部品マスター";
        btn[1].innerHTML = "📝 標準マスター";
        btn[2].innerHTML = "📊 ダッシュボード";
        btn[3].innerHTML = "🌐 言語 : <span id='langText'>JP</span>";
        btn[4].innerHTML = "🎨 テーマ";
        btn[5].innerHTML = "📁 バックアップ";
        btn[6].innerHTML = "📥 復元";
        btn[7].innerHTML = "📖 作業手順書";
        btn[8].innerHTML = "📞 管理者連絡";
        btn[9].innerHTML = "ℹ️ バージョン 1.0";

    }
    else{

        document.querySelector(".header").innerHTML = "⚙️ SETTINGS";

        btn[0].innerHTML = "📦 PART MASTER";
        btn[1].innerHTML = "📝 STANDARD MASTER";
        btn[2].innerHTML = "📊 DASHBOARD";
        btn[3].innerHTML = "🌐 LANGUAGE : <span id='langText'>EN</span>";
        btn[4].innerHTML = "🎨 THEME";
        btn[5].innerHTML = "📁 BACKUP DATA";
        btn[6].innerHTML = "📥 RESTORE DATA";
        btn[7].innerHTML = "📖 WORK INSTRUCTION";
        btn[8].innerHTML = "📞 CONTACT ADMIN";
        btn[9].innerHTML = "ℹ️ VERSION 1.0";

    }
}

applyLanguage();

</script>

<script src="bottom-nav.js"></script>

</body>
</html>
