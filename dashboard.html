<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DASHBOARD</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#fff;
    border-bottom:1px solid #ccc;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    padding:0 15px;
    box-sizing:border-box;
    z-index:9999;
}

.icon-btn{
    width:45px;
    height:45px;
    border:none;
    background:#f1f1f1;
    border-radius:12px;
    font-size:24px;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:10px;
    padding-top:80px;
    padding-bottom:90px;
    box-sizing:border-box;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:8px;
    text-align:center;
    color:#666;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
    z-index:99999;
}

.bottom-nav button{
    flex:1;
    margin:0;
    padding:0;
    border:none;
    background:#fff;
    color:#333;
    font-size:18px;
    font-weight:normal;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.bottom-nav button span{
    font-size:10px;
    margin-top:2px;
    line-height:1;
}

.bottom-nav button:active{
    background:#f1f1f1;
}

</style>
</head>

<body>

<div class="top-bar">

    <button class="icon-btn" onclick="searchData()">
        🔍
    </button>

    <button class="icon-btn" onclick="openCalendar()">
        📅
    </button>

    <input
        type="date"
        id="dateFilter"
        onchange="showDate(this.value)"
        style="
            width:160px;
            height:40px;
            border-radius:20px;
            border:1px solid #ccc;
            font-size:14px;
        "
    >

</div>

<div class="container">

    <div class="title">
        📊 DASHBOARD
    </div>

    <div class="card">
        ยังไม่มีข้อมูล Dashboard
    </div>

</div>

<div class="bottom-nav">

    <button onclick="location.href='menu.html'">
        🏠
        <span>Home</span>
    </button>

    <button onclick="location.href='dashboard.html'">
        📊
        <span>Dashboard</span>
    </button>

    <button onclick="location.href='document.html'">
        📝
        <span>Document</span>
    </button>

    <button onclick="location.href='standard.html'">
        📏
        <span>STD</span>
    </button>

    <button onclick="location.href='settings.html'">
        ⚙️
        <span>Setting</span>
    </button>

</div>

<script>

function searchData(){
    alert("ฟังก์ชันค้นหายังไม่ได้กำหนด");
}

function openCalendar(){

    const picker =
    document.getElementById("dateFilter");

    if(picker.showPicker){
        picker.showPicker();
    }else{
        picker.focus();
        picker.click();
    }

}

function showDate(value){

    if(!value) return;

    const d = new Date(value);

    const result =
        d.getDate() + "/" +
        (d.getMonth() + 1) + "/" +
        d.getFullYear();

    alert("เลือกวันที่ : " + result);

}

</script>

</body>
</html>
