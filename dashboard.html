<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>DASHBOARD</title>

<link rel="stylesheet" href="bottom-nav.css">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspection">
<meta name="theme-color" content="#009688">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>

html,
body{
    width:100%;
    overflow-x:hidden;
}

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
    touch-action:manipulation;
}

input,
select,
textarea{
    font-size:16px !important;
    -webkit-text-size-adjust:100%;
}

*{
    -webkit-tap-highlight-color:transparent;
}

.graph-box{
    margin-bottom:20px;
}

.graph-title{
    font-size:18px;
    font-weight:bold;
    text-align:left;
    margin-bottom:8px;
    color:#333;
}

.graph-area{
    height:220px;
    border:2px dashed #bbb;
    background:#fafafa;
    border-radius:8px;
}

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#fff;
    border-bottom:1px solid #ccc;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    padding:0 15px;
    box-sizing:border-box;
    z-index:9999;
}

.icon-btn{
    width:45px;
    height:45px;
    border:none;
    background:#f1f1f1;
    border-radius:12px;
    font-size:24px;
    cursor:pointer;
}

.calendar-wrap{
    position:relative;
    width:45px;
    height:45px;
}

.calendar-wrap input{
    position:absolute;
    top:0;
    left:0;
    width:45px;
    height:45px;
    opacity:0;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1600px;
    margin:auto;
    padding:10px;
    padding-top:80px;
    padding-bottom:90px;
    box-sizing:border-box;
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:700;
    color:#1f2937;
    margin:30px 0;
}

.card{
    padding:20px;
    color:#666;
}

/* โทรศัพท์ */
@media (max-width:768px){

    .graph-area{
        height:180px;
    }

    .graph-title{
        font-size:16px;
    }

}

/* Tablet + iPad + Desktop */
@media (min-width:769px){

    .card{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:10px;
        padding:0;
    }

    .graph-title{
        font-size:13px;
        min-height:24px;
        margin-bottom:4px;
    }

    .graph-area{
        height:calc((100vh - 320px) / 2);
    }

    .container{
        padding:70px 10px 70px;
    }

    .title{
        font-size:22px;
        margin:10px 0 20px;
    }

}

.bottom-nav button,
.bottom-nav button span{
    font-weight:400 !important;
}

</style>
</head>

<body>

<div class="top-bar">

    <button class="icon-btn" onclick="searchData()">
        🔍
    </button>

    <div class="calendar-wrap">

        <button class="icon-btn" type="button">
            📅
        </button>

        <input
            type="date"
            id="dateFilter"
            onchange="showDate(this.value)"
        >

    </div>

</div>

<div class="container">

    <h1 class="title">📊 INSPECTION DASHBOARD</h1>

    <div class="card">

        <div class="graph-box">
            <div class="graph-title">Combine</div>
            <div class="graph-area" id="combineChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">Combine Welding</div>
            <div class="graph-area" id="combineWeldingChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">Sugarcane harvester</div>
            <div class="graph-area" id="shChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">Sugarcane harvester Welding</div>
            <div class="graph-area" id="shWeldingChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">New Model</div>
            <div class="graph-area" id="newModelChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">Control List ECN / SRPC / IRPC</div>
            <div class="graph-area" id="controlListChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">Monthly Plan</div>
            <div class="graph-area" id="monthlyPlanChart"></div>
        </div>

        <div class="graph-box">
            <div class="graph-title">Washing Room</div>
            <div class="graph-area" id="washingChart"></div>
        </div>

</div>

<script>

function searchData(){
    alert("ฟังก์ชันค้นหายังไม่ได้กำหนด");
}

function showDate(value){

    if(!value) return;

    const d = new Date(value);

    const result =
        d.getDate() + "/" +
        (d.getMonth() + 1) + "/" +
        d.getFullYear();

    alert("เลือกวันที่ : " + result);

}

</script>

<script src="bottom-nav.js"></script>

</body>
</html>
