<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>DASHBOARD</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
    touch-action:manipulation;
}

input,
select,
textarea{
    font-size:16px !important;
    -webkit-text-size-adjust:100%;
}

*{
    -webkit-tap-highlight-color:transparent;
}

.graph-box{
    margin-bottom:20px;
}

.graph-title{
    font-size:18px;
    font-weight:bold;
    text-align:left;
    margin-bottom:8px;
    color:#333;
}

.graph-area{
    height:220px;
    border:2px dashed #bbb;
    background:#fafafa;
    border-radius:8px;
}

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#fff;
    border-bottom:1px solid #ccc;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    padding:0 15px;
    box-sizing:border-box;
    z-index:9999;
}

.icon-btn{
    width:45px;
    height:45px;
    border:none;
    background:#f1f1f1;
    border-radius:12px;
    font-size:24px;
    cursor:pointer;
}

.calendar-wrap{
    position:relative;
    width:45px;
    height:45px;
}

.calendar-wrap input{
    position:absolute;
    top:0;
    left:0;
    width:45px;
    height:45px;
    opacity:0;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:10px;
    padding-top:80px;
    padding-bottom:90px;
    box-sizing:border-box;
}

.title{
    text-align:center;
    font-size:32px;
    font-weight:700;
    color:#1f2937;
    margin:0 0 20px 0;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:8px;
    text-align:center;
    color:#666;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
    z-index:99999;
}

.bottom-nav button{
    flex:1;
    margin:0;
    padding:0;
    border:none;
    background:#fff;
    color:#333;
    font-size:18px;
    font-weight:normal;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.bottom-nav button span{
    font-size:10px;
    margin-top:2px;
    line-height:1;
}

.bottom-nav button:active{
    background:#f1f1f1;
}

/* โทรศัพท์ */
@media (max-width:768px){

    .graph-area{
        height:180px;
    }

    .graph-title{
        font-size:16px;
    }

}

/* คอมพิวเตอร์ */
@media (min-width:769px){

    .container{
        max-width:none;
        width:100%;
        padding:80px 20px 90px;
    }

    .card{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:20px;
        text-align:left;
    }

    .graph-box{
        margin-bottom:0;
    }

    .graph-area{
        height:250px;
    }

}

</style>
</head>

<body>

<div class="top-bar">

    <button class="icon-btn" onclick="searchData()">
        🔍
    </button>

    <div class="calendar-wrap">

        <button class="icon-btn" type="button">
            📅
        </button>

        <input
            type="date"
            id="dateFilter"
            onchange="showDate(this.value)"
        >

    </div>

</div>

<div class="container">

    <h1 class="title">📊 DASHBOARD</h1>

    <div class="card">

    </div>

</div>

<div class="card">

    <div class="graph-box">
        <div class="graph-title">Combine</div>
        <div class="graph-area" id="combineChart"></div>
    </div>

    <div class="graph-box">
        <div class="graph-title">Combine Welding</div>
        <div class="graph-area" id="combineWeldingChart"></div>
    </div>

    <div class="graph-box">
        <div class="graph-title">SH</div>
        <div class="graph-area" id="shChart"></div>

    </div>

    <div class="graph-box">
        <div class="graph-title">SH Welding</div>
        <div class="graph-area" id="shWeldingChart"></div>
    </div>

    <div class="graph-box">
    <div class="graph-title">New Model</div>
    <div class="graph-area" id="newModelChart"></div>
</div>

<div class="graph-box">
    <div class="graph-title">Control Part List</div>
    <div class="graph-area" id="controlListChart"></div>
</div>

<div class="graph-box">
    <div class="graph-title">ECN / SRPC / IRPC</div>
    <div class="graph-area" id="ecnChart"></div>
</div>

<div class="graph-box">
    <div class="graph-title">Washing</div>
    <div class="graph-area" id="washingChart"></div>
</div>

</div>

<div class="bottom-nav">

    <button onclick="location.href='menu.html'">
        🏠
        <span>Home</span>
    </button>

    <button onclick="location.href='dashboard.html'">
        📊
        <span>Dashboard</span>
    </button>

    <button onclick="location.href='document.html'">
        📝
        <span>Document</span>
    </button>

    <button onclick="location.href='standard.html'">
        📏
        <span>STD</span>
    </button>

    <button onclick="location.href='settings.html'">
        ⚙️
        <span>Setting</span>
    </button>

</div>

<script>

function searchData(){
    alert("ฟังก์ชันค้นหายังไม่ได้กำหนด");
}

function showDate(value){

    if(!value) return;

    const d = new Date(value);

    const result =
        d.getDate() + "/" +
        (d.getMonth() + 1) + "/" +
        d.getFullYear();

    alert("เลือกวันที่ : " + result);

}

</script>

</body>
</html>
