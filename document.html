<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Part Borrowing From PL</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--blue:#1f8fff;
--blue2:#386bff;
--white:#ffffff;
--text:#0e2d68;
--radius:24px;
}

html{
font-size:16px;
}

body{
font-family:"Segoe UI",sans-serif;
background:
linear-gradient(
180deg,
#eaf3ff,
#dfe9f6
);
min-height:100vh;
overflow-x:hidden;
color:var(--text);
}

.container{
max-width:1000px;
margin:auto;
padding:12px;
}

.card{
background:
rgba(255,255,255,.70);

backdrop-filter:blur(18px);

border:1px solid
rgba(255,255,255,.8);

box-shadow:
0 8px 30px
rgba(0,0,0,.08);

border-radius:26px;
}

.header{
background:
linear-gradient(
135deg,
#79beff,
#5270ff,
#6572ff
);

border-radius:0 0 34px 34px;

padding:20px;

display:flex;
align-items:center;
justify-content:space-between;
gap:12px;

color:white;
}

.back-btn{
width:60px;
height:60px;

border:none;
border-radius:50%;

background:white;

font-size:26px;
color:#5270ff;
}

.header-title{
flex:1;
}

.header-title h1{
font-size:clamp(20px,4vw,48px);
}

.header-title p{
font-size:clamp(13px,1.5vw,20px);
}

.date-box{
padding:12px 18px;
background:rgba(255,255,255,.85);
border-radius:22px;
color:#173c83;
font-weight:600;
}

.top-grid{
display:grid;
grid-template-columns:
1.4fr .9fr 1fr;
gap:16px;
margin-top:18px;
}

.info-card{
padding:18px;
}

.info-card h3{
margin-bottom:12px;
font-size:18px;
}

.select{
width:100%;
height:54px;
border:none;
outline:none;
padding:0 16px;
border-radius:16px;
font-size:18px;
}

.search-card{
margin-top:16px;
padding:20px;

display:grid;
grid-template-columns:
80px
1fr
170px;

gap:15px;
align-items:center;
}

.search-icon{
font-size:48px;
color:#1672ff;
text-align:center;
}

.search-input{
height:60px;
border:none;
background:white;
border-radius:16px;
padding:0 20px;
font-size:22px;
}

.search-btn{
height:60px;
border:none;
border-radius:16px;

background:
linear-gradient(
135deg,
#19a3ff,
#116cff
);

color:white;
font-size:24px;
font-weight:700;
}

.part-card{
margin-top:16px;
padding:22px;
}

.section-title{
display:flex;
align-items:center;
gap:12px;

font-size:22px;
font-weight:700;
margin-bottom:18px;
}

.info-row{
display:grid;
grid-template-columns:
160px
1fr
200px;

gap:16px;
align-items:center;
margin-bottom:16px;
}

.label{
font-size:16px;
font-weight:600;
}

.input{
height:56px;
background:white;
border-radius:16px;
border:none;
padding:0 18px;
font-size:16px;
}

.mode{
display:flex;
gap:8px;
}

.mode button{
flex:1;
height:56px;
border:none;
border-radius:14px;
font-size:18px;
}

.auto{
background:#e5edf7;
}

.manual{
background:
linear-gradient(
135deg,
#45b0ff,
#3178ff
);
color:white;
}

.bottom-grid{
display:grid;
grid-template-columns:
380px
1fr;

gap:16px;
margin-top:16px;
}

.qty-card,
.photo-card{
padding:20px;
}

.qty-box{
margin-top:18px;

display:flex;
align-items:center;
justify-content:center;

background:white;
border-radius:18px;
overflow:hidden;
}

.qty-box button{
width:70px;
height:80px;
border:none;
font-size:36px;
background:white;
}

.qty-number{
width:120px;
text-align:center;
font-size:54px;
font-weight:700;
}

.photo-list{
display:flex;
gap:8px;
overflow-x:auto;
}

.photo-item{
width:70px;
height:70px;
flex:0 0 70px;
border-radius:12px;
overflow:hidden;
background:#fff;
}

.add-photo{
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
color:#1f8fff;
cursor:pointer;
}

.photo-item img{
width:100%;
height:100%;
object-fit:cover;
}

.photo-item img{
width:100%;
height:100%;
object-fit:cover;
}

.report-card{
margin-top:16px;
padding:22px;
}

textarea{
width:100%;
height:220px;
border:none;
background:white;
border-radius:18px;
padding:16px;
font-size:16px;
resize:none;
}

.actions{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:16px;
margin-top:16px;
}

.action-btn{
height:96px;
border:none;
border-radius:24px;
color:white;
font-size:24px;
font-weight:700;
}

.review{
background:
linear-gradient(
135deg,
#38afff,
#0e63ff
);
}

.line{
background:
linear-gradient(
135deg,
#2ddd66,
#0bad43
);
}

.save{
background:
linear-gradient(
135deg,
#ffb025,
#ff7a00
);
}

.bottom-nav{
margin-top:18px;

background:
rgba(255,255,255,.8);

backdrop-filter:blur(12px);

border-radius:30px;

display:flex;
justify-content:space-around;

padding:18px;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
font-size:18px;
color:#5a719e;
}

.nav-item i{
font-size:28px;
}

@media(max-width:1024px){

.top-grid{
grid-template-columns:
1.4fr .9fr 1fr;
}

.bottom-grid{
grid-template-columns:
40% 60%;
}

.info-row{
grid-template-columns:
120px 1fr 170px;
}

}

@media(max-width:768px){

.container{
padding:10px;
}

/* Header */

.header{
padding:12px;
gap:8px;
}

.back-btn{
width:40px;
height:40px;
font-size:16px;
}

.header-title h1{
font-size:14px;
line-height:1.1;
}

.header-title p{
font-size:10px;
}

.date-box{
padding:6px 8px;
font-size:10px;
}

/* Transaction */

.top-grid{
grid-template-columns:
1fr .9fr .9fr;
gap:8px;
}

.info-card{
padding:7px;
}

.info-card h3{
font-size:11px;
margin-bottom:6px;
}

.select{
height:32px;
font-size:10px;
}

/* Search */

.search-card{
padding:12px;
display:grid;
grid-template-columns:
40px 1fr 90px;
gap:8px;
}

.search-icon{
font-size:24px;
}

.search-input{
height:38px;
font-size:12px;
}

.search-btn{
height:38px;
font-size:12px;
}

/* Part Information */

.part-card{
padding:14px;
}

.section-title{
font-size:15px;
margin-bottom:12px;
}

.info-row{
display:grid;
grid-template-columns:
70px 1fr 85px;
gap:8px;
margin-bottom:8px;
}

.label{
font-size:11px;
}

.input{
height:34px;
font-size:11px;
}

.mode{
display:flex;
gap:4px;
}

.mode button{
flex:1;
height:32px;
font-size:8px;
padding:0;
}

/* Qty + Photo */

.bottom-grid{
display:grid;
grid-template-columns:
1fr 1.9fr;
gap:10px;
}

.qty-card,
.photo-card{
padding:12px;
min-height:0;
}

.qty-card,
.photo-card{
padding:12px;
min-height:0;
}

.qty-card{
height:110px;
}

.photo-card{
height:120px;
overflow:hidden;
}

.qty-box{
margin-top:4px;
}

.qty-box button{
width:24px;
height:32px;
font-size:15px;
}

.qty-number{
width:34px;
font-size:18px;
}

.photo-item{
width:52px;
height:52px;
flex:0 0 52px;
border-radius:10px;
overflow:hidden;
}

.photo-list{
display:flex;
gap:8px;
align-items:center;
overflow-x:auto;
overflow-y:hidden;
width:100%;
height:52px;
flex-wrap:nowrap;
}

.photo-list::-webkit-scrollbar{
display:none;
}

/* Report */

.report-card{
padding:14px;
}

textarea{
height:180px;
font-size:13px;
}

/* Buttons */

.actions{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:10px;
}

.action-btn{
height:54px;
font-size:11px;
}

}

.report-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
display:none;
align-items:flex-start;
justify-content:center;
padding-top:40px;
z-index:99999;
backdrop-filter:blur(3px);
}

.report-overlay.show{
display:flex;
}

.report-sheet{
position:relative;
width:95%;
max-width:700px;
max-height:90vh;
background:#fff;
border-radius:24px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.report-content{
flex:1;
overflow:auto;
padding:20px;
white-space:pre-wrap;
line-height:1.5;
color:#000;
}

.report-actions{
display:flex;
gap:8px;
padding:12px;
border-top:1px solid #ddd;
}

.report-actions button{
flex:1;
height:46px;
border:none;
border-radius:12px;
color:#fff;
font-weight:700;
}

.btn-save{
background:#4caf50;
}

.btn-copy{
background:#9c27b0;
}

.btn-line{
background:#06C755;
}

.add-btn{
position:absolute;
top:10px;
right:10px;
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#2196f3;
color:#fff;
font-size:20px;
}

.action-sheet-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
backdrop-filter:blur(3px);

display:none;
align-items:flex-end;
justify-content:center;

z-index:999999;
}

.action-sheet-overlay.show{
display:flex;
}

.action-sheet{
width:95%;
max-width:500px;
padding:10px;
}

.action-sheet button{
width:100%;
height:56px;
border:none;
margin-bottom:8px;
background:#fff;
font-size:18px;
border-radius:14px;
}

.action-sheet .danger{
color:#ff3b30;
font-weight:700;
}

.action-sheet .cancel{
font-weight:700;
}

</style>
</head>
<body>

<header class="header">

<button class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="header-title">
<h1>PART BORROWING FROM PL</h1>
<p>Part Loan / Return / Defect</p>
</div>

<div class="date-box">
15 Nov 2024<br>
10:24
</div>

</header>

<div class="container">

<div class="top-grid">

<div class="card info-card">
<h3>Transaction Type</h3>
<select class="select">
<option></option>
<option>ยืมชิ้นส่วน</option>
<option>คืนชิ้นส่วน</option>
<option>Defect</option>
</select>
</div>

<div class="card info-card">
<h3>Location</h3>
<select class="select">
<option></option>
<option>Box</option>
<option>Rack</option>
<option>Set Packing</option>
</select>
</div>

<div class="card info-card">
<h3>Date</h3>
<input class="select" value="15/11/2024">
</div>

</div>

<div class="card search-card">

<div class="search-icon">
<i class="fa-solid fa-magnifying-glass"></i>
</div>

<input
class="search-input"
value="123456-AB">

<button class="search-btn">
ค้นหา
</button>

</div>

<div class="card part-card">

<div class="section-title">
<i class="fa-solid fa-file-lines"></i>
Part Information
</div>

<div class="info-row">
<div class="label">Part Name</div>
<input class="input" value="COVER ASSY">
<div class="mode">
<button class="auto">Auto</button>
<button class="manual">Manual</button>
</div>
</div>

<div class="info-row">
<div class="label">Model</div>
<input class="input" value="ABC-123">
<div class="mode">
<button class="auto">Auto</button>
<button class="manual">Manual</button>
</div>
</div>

<div class="info-row">
<div class="label">Supplier</div>
<input class="input" value="DENSO">
<div class="mode">
<button class="auto">Auto</button>
<button class="manual">Manual</button>
</div>
</div>

</div>

<div class="bottom-grid">

<div class="card qty-card">

<div class="section-title">
#
Qty
</div>

<div class="qty-box">
<button id="minus">-</button>
<div class="qty-number" id="qty">1</div>
<button id="plus">+</button>
</div>

</div>

<div class="card photo-card">

<div class="section-title">
<i class="fa-solid fa-camera"></i>
Photo
</div>

<input
type="file"
id="photoInput"
accept="image/*"
multiple
hidden>

<div class="photo-list" id="photoList">

<div class="photo-item add-photo"
onclick="document.getElementById('photoInput').click()">
+
</div>

</div>

</div>

</div>

<div class="actions">

<button
class="action-btn review"
onclick="reviewReport()">
Review
</button>

</div>

</div>

<script>

const qty=document.getElementById('qty');

document.getElementById('plus')
.onclick=()=>{
qty.textContent=
Number(qty.textContent)+1;
};

document.getElementById('minus')
.onclick=()=>{
if(Number(qty.textContent)>1){
qty.textContent=
Number(qty.textContent)-1;
}
};

let reportEditMode=false;

function reviewReport(){

const qtyText =
document.getElementById("qty").textContent;

document.getElementById("report").innerText=
`PART BORROWING REPORT

Date : 15-11-2024

Part No : 123456-AB
Part Name : COVER ASSY
Model : ABC-123
Supplier : DENSO

Qty : ${qtyText} PCS

Photo : Attached`;

document
.getElementById("reportOverlay")
.classList.add("show");

}

function toggleEditReport(){

const report=
document.getElementById("report");

const btn=
document.getElementById("editBtn");

if(!reportEditMode){

report.contentEditable="true";

btn.innerHTML="💾";

btn.style.background="#4caf50";

reportEditMode=true;

}else{

report.contentEditable="false";

btn.innerHTML="📝";

btn.style.background="#2196f3";

reportEditMode=false;

}

}

function saveReport(){

const text=
document.getElementById("report").innerText;

const blob=
new Blob([text],{type:"text/plain"});

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"Borrowing_Report.txt";

a.click();

}

function copyReport(){

navigator.clipboard.writeText(
document.getElementById("report").innerText
);

alert("Copy แล้ว");

}

function sendLine(){

const text=
encodeURIComponent(
document.getElementById("report").innerText
);

window.open(
"https://line.me/R/share?text="+text,
"_blank"
);

}

</script>

<div id="reportOverlay" class="report-overlay">

    <div class="report-sheet">

        <button
        id="editBtn"
        class="add-btn"
        onclick="toggleEditReport()">
        📝
        </button>

        <div
        id="report"
        class="report-content"
        contenteditable="false">
        </div>

        <div class="report-actions">

            <button
            class="btn-save"
            onclick="saveReport()">
            💾 Save
            </button>

            <button
            class="btn-copy"
            onclick="copyReport()">
            📋 Copy
            </button>

            <button
            class="btn-line"
            onclick="sendLine()">
            📤 LINE
            </button>

        </div>

    </div>

</div>

<script>
document.getElementById("reportOverlay").addEventListener("click", function(e){

    if(e.target === this){
        this.classList.remove("show");
    }

});

document.getElementById("photoInput").addEventListener("change", function(){

const photoList =
document.getElementById("photoList");

for(const file of this.files){

const reader = new FileReader();

reader.onload = function(e){

const div =
document.createElement("div");

div.className = "photo-item";

div.innerHTML =
`<img src="${e.target.result}">`;

photoList.appendChild(div);

};

reader.readAsDataURL(file);

}

});

let selectedPhoto = null;

let pressTimer;

document.addEventListener("touchstart",function(e){

const img =
e.target.closest(".photo-item img");

if(!img) return;

pressTimer = setTimeout(()=>{

selectedPhoto =
img.closest(".photo-item");

document
.getElementById("actionSheet")
.classList.add("show");

},600);

});

document.addEventListener("touchend",function(){

clearTimeout(pressTimer);

});

function closeActionSheet(){

document
.getElementById("actionSheet")
.classList.remove("show");

}

function openPhoto(){

const img =
selectedPhoto.querySelector("img");

window.open(img.src,"_blank");

closeActionSheet();

}

function deletePhoto(){

if(selectedPhoto){

selectedPhoto.remove();

}

closeActionSheet();

}

function replacePhoto(){

document
.getElementById("replaceInput")
.click();

}

document
.getElementById("replaceInput")
.addEventListener("change",function(){

const file = this.files[0];

if(!file || !selectedPhoto) return;

const reader = new FileReader();

reader.onload = function(e){

selectedPhoto.innerHTML =
`${e.target.result}`;

};

reader.readAsDataURL(file);

closeActionSheet();

});

</script>

<div id="actionSheet" class="action-sheet-overlay">

<div class="action-sheet">

<button onclick="openPhoto()">
เปิด
</button>

<button onclick="replacePhoto()">
เปลี่ยนรูป
</button>

<button class="danger" onclick="deletePhoto()">
ลบรูป
</button>

<button class="cancel" onclick="closeActionSheet()">
ยกเลิก
</button>

</div>

</div>

<input
type="file"
id="replaceInput"
accept="image/*"
hidden>

</body>
</html>
