<script>

const dateInput = document.getElementById("date");
const typeInput = document.getElementById("type");

const partno = document.getElementById("partno");
const partname = document.getElementById("partname");
const model = document.getElementById("model");
const supplier = document.getElementById("supplier");

const partList = document.getElementById("partList");
const partNgShow = document.getElementById("partNgShow");
const okQty = document.getElementById("okQty");

dateInput.value = new Date().toISOString().split("T")[0];

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

    const response = await fetch("ข้อมูล Excel.xlsx");
    const data = await response.arrayBuffer();

    const workbook = XLSX.read(data,{type:"array"});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    rows.forEach(row=>{

        const partNo = String(row.PartNo || "").trim();

        if(partNo){

            if(!allPartNo.includes(partNo)){
                allPartNo.push(partNo);
            }

            partMaster[partNo] = {
                partName: row.PartName || "",
                supplier: row.Supplier || "",
                model: row.Model || ""
            };
        }
    });

    console.log("Excel Loaded : " + Object.keys(partMaster).length);
}

loadExcel();

let partnameManual = false;
let modelManual = false;
let supplierManual = false;

document.getElementById("partnameBtn").onclick = function(){

    if(!partnameManual){

        partnameManual = true;
        partname.readOnly = false;
        partname.value = "";

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        partnameManual = false;
        partname.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);
    }
};

document.getElementById("modelBtn").onclick = function(){

    if(!modelManual){

        modelManual = true;
        model.readOnly = false;
        model.value = "";

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        modelManual = false;
        model.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);
    }
};

document.getElementById("supplierBtn").onclick = function(){

    if(!supplierManual){

        supplierManual = true;
        supplier.readOnly = false;
        supplier.value = "";

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        supplierManual = false;
        supplier.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);
    }
};

partno.addEventListener("input", function(){

    const keyword = this.value.trim();

    if(keyword === ""){

        if(!partnameManual) partname.value = "";
        if(!modelManual) model.value = "";
        if(!supplierManual) supplier.value = "";

        partList.innerHTML = "";
        return;
    }

    if(partMaster[keyword]){
        fillPartData(keyword);
        return;
    }

    if(keyword.length < 2){
        partList.innerHTML = "";
        return;
    }

    const result = allPartNo
    .filter(p =>
        p.toLowerCase().includes(keyword.toLowerCase())
    )
    .slice(0,20);

    partList.innerHTML = result
    .map(p => `<option value="${p}"></option>`)
    .join("");
});

partno.addEventListener("change", function(){

    const value = this.value.trim();

    if(partMaster[value]){
        fillPartData(value);
    }
});

function fillPartData(partNo){

    if(!partMaster[partNo]) return;

    if(!partnameManual){
        partname.value = partMaster[partNo].partName;
    }

    if(!modelManual){
        model.value = partMaster[partNo].model;
    }

    if(!supplierManual){
        supplier.value = partMaster[partNo].supplier;
    }
}

function calculateNG(){

    const stock =
    Number(document.getElementById("stockNg").value || 0);

    const ok =
    Number(document.getElementById("okQty").value || 0);

    let ng = stock - ok;

    if(ng < 0) ng = 0;

    document.getElementById("ngQty").value = ng || "";
    document.getElementById("totalNg").value = ng || "";
}

let reportVisible = false;

function reviewReport(){

    if(reportVisible){

        document.getElementById("report").style.display = "none";
        reportVisible = false;
        return;
    }

    reportVisible = true;

    const stock =
    Number(document.getElementById("stockNg").value || 0);

    const ng =
    Number(document.getElementById("ngQty").value || 0);

    const totalNg =
    Number(document.getElementById("totalNg").value || 0);

    let text = `🚨 PART PROBLEM REPORT 🚨

🗓️ Date : ${dateInput.value.split("-").reverse().join("-")}
🏷️ Type : ${typeInput.value}

📦 Part No. : ${partno.value}
📋 Part Name : ${partname.value}
🚜 Model : ${model.value || "-"}
🏭 Supplier : ${supplier.value}

📊 INSPECTION RESULT

• Check Stock : ${stock} Pcs.
• OK Qty : ${okQty.value || 0} Pcs.
• NG Qty : ${ng} Pcs.
• Part NG : ${partNgShow.value || "-"}
• Total NG : ${totalNg || 0} Pcs.

━━━━━━━━━━━━━━
📷 Photo : Attached`;

    document.getElementById("report").style.display = "block";
    document.getElementById("report").innerText = text.trim();
}

document
.querySelectorAll("input,select,textarea")
.forEach(el => {

    el.addEventListener("input", calculateNG);
    el.addEventListener("change", calculateNG);

});

calculateNG();

document.getElementById("report").style.display = "none";

window.addEventListener("pageshow", () => {

    const std = localStorage.getItem("selectedStd");

    if(!std) return;

    const fieldId = localStorage.getItem("activeFieldId");

    if(fieldId){

        const field = document.getElementById(fieldId);

        if(field){
            field.value += " " + std;
        }
    }

    localStorage.removeItem("selectedStd");
});

document.querySelectorAll("textarea,input")
.forEach(el => {

    function saveField(){

        localStorage.setItem(
            "activeFieldId",
            el.id
        );
    }

    el.addEventListener("focus", saveField);
    el.addEventListener("click", saveField);
    el.addEventListener("input", saveField);
    el.addEventListener("touchstart", saveField);
});

async function copyReport(){

    const text =
    document.getElementById("report").innerText;

    await navigator.clipboard.writeText(text);

    const msg = document.createElement("div");

    msg.innerHTML = "📋 Copy Report สำเร็จ";

    msg.style.cssText = `
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#333;
    color:#fff;
    padding:15px 25px;
    border-radius:10px;
    z-index:9999;
    `;

    document.body.appendChild(msg);

    setTimeout(()=>{
        msg.remove();
    },2000);
}

function sendLine(){

    const text =
    document.getElementById("report").innerText.trim();

    if(!text){

        alert("⚠️ กรุณากด Review Report ก่อน");
        return;
    }

    location.href =
    "https://line.me/R/share?text=" +
    encodeURIComponent(text);
}

function backToMenu(){

    location.href = "index.html";
}

function openStandard(){

    const active = document.activeElement;

    if(active && active.id){

        localStorage.setItem(
            "activeFieldId",
            active.id
        );
    }

    location.href = "standard.html";
}

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("./sw.js");
}

</script>
