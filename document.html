<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Document</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--blue:#1f8fff;
--blue2:#386bff;
--text:#16366c;
}

html,
body{
width:100%;
height:100%;
overflow:auto;
touch-action:manipulation;
}

body{
font-family:"Segoe UI",sans-serif;
background:
linear-gradient(
180deg,
#eaf3ff,
#dfe9f6
);
color:var(--text);
}

/* HEADER */

.header{
height:80px;

background:
linear-gradient(
135deg,
#79beff,
#5270ff,
#6572ff
);

display:flex;
align-items:center;
justify-content:space-between;

padding:0 18px;
color:#fff;

border-radius:0 0 30px 30px;
}

.back-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#fff;
color:#5270ff;
font-size:22px;
}

.header-title{
font-size:28px;
font-weight:700;
}

.date-box{
position:relative;

background:
rgba(255,255,255,.9);

padding:10px 18px;
border-radius:16px;

font-weight:600;
color:#173c83;

cursor:pointer;

text-align:center;
min-width:130px;
}

#headerDate{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
}

/* PAGE */

.container{
min-height:calc(100vh - 80px);

padding:12px;

display:flex;
flex-direction:column;
gap:10px;
}

.card{
background:
rgba(255,255,255,.75);

backdrop-filter:
blur(18px);

border-radius:24px;

box-shadow:
0 8px 30px
rgba(0,0,0,.08);

padding:14px;
}

.label{
font-size:15px;
font-weight:700;
margin-bottom:6px;
}

.input{
width:100%;
height:54px;
border:none;
outline:none;
background:#fff;
border-radius:16px;
padding:0 16px;
font-size:16px;
}

.top-grid{
display:grid;
grid-template-columns:
1fr 1fr;
gap:10px;
}

textarea{
width:100%;
height:100%;
border:none;
outline:none;
background:#fff;
border-radius:18px;

padding:14px;
font-size:15px;

resize:none;
}

/* FLEX AREA */

.title-card{
flex:0 0 90px;
}

.info-card{
flex:0 0 160px;
padding:14px;
}

.detail-card{
flex:0 0 180px;
display:flex;
flex-direction:column;
}

.detail-card textarea{
flex:1;
}

/* BUTTON */

.action-group{
display:flex;
flex-direction:column;
gap:8px;
}

.add-btn,
.review-btn{
width:100%;
height:65px;
border:none;
border-radius:22px;
color:#fff;
font-weight:700;
cursor:pointer;
}

.add-btn{
background:
linear-gradient(
135deg,
#ffb300,
#ff7800
);
font-size:32px;
}

.review-btn{
background:
linear-gradient(
135deg,
#2ddd66,
#0bad43
);
font-size:22px;
}

/* REVIEW POPUP */

.report-overlay{
position:fixed;
inset:0;

display:none;
align-items:center;
justify-content:center;

background:
rgba(0,0,0,.4);

z-index:9999;
}

.report-overlay.show{
display:flex;
}

.report-sheet{
width:95%;
max-width:700px;
max-height:90vh;

background:#fff;

border-radius:24px;

overflow:hidden;

display:flex;
flex-direction:column;
}

.report-content{
padding:20px;

white-space:pre-wrap;
overflow:auto;

line-height:1.5;
color:#000;
}

.report-actions{
display:flex;
gap:8px;

padding:12px;

border-top:
1px solid #ddd;
}

.report-actions button{
flex:1;
height:50px;

border:none;
border-radius:14px;

color:#fff;
font-weight:700;
font-size:16px;
}

.btn-save{
background:#4caf50;
}

.btn-copy{
background:#9c27b0;
}

.btn-line{
background:#06C755;
}

/* MOBILE */

@media(max-width:768px){

.header{
height:68px;
padding:0 10px;
}

.back-btn{
width:40px;
height:40px;
font-size:16px;
}

.header-title{
font-size:16px;
}

.date-box{
font-size:10px;
padding:6px 8px;
min-width:90px;
}

.container{
padding:8px;
gap:8px;
}

.title-card{
flex:0 0 80px;
}

.info-card{
flex:0 0 180px;
}

.input{
height:42px;
font-size:12px;
}

.label{
font-size:11px;
}

.top-grid{
gap:6px;
}

.add-btn,
.review-btn{
height:50px;
}

.add-btn{
font-size:24px;
}

.review-btn{
font-size:14px;
}

textarea{
font-size:12px;
}

}

</style>
</head>
<body>

<header class="header">

<button
class="back-btn"
onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="header-title">
DOCUMENT
</div>

<div class="date-box" id="dateBoxWrap">

<div id="dateBox"></div>

<input
type="date"
id="headerDate">

</div>

</header>

<div class="container">

<div class="card title-card">

<div class="label">
Document Title
</div>

<input
id="docTitle"
class="input"
placeholder="แจ้งผลตรวจสอบ">

</div>

<div class="card info-card">

<div class="top-grid">

<div>
<div class="label">Part No.</div>
<input
id="partNo"
class="input"
list="partList"
placeholder="Part No.">

<datalist id="partList"></datalist>
</div>

<div>
<div class="label">Part Name</div>
<input
id="partName"
class="input"
readonly
onclick="editField(this)">
</div>

<div>
<div class="label">Model</div>
<input
id="model"
class="input"
readonly
onclick="editField(this)">
</div>

<div>
<div class="label">Supplier</div>
<input
id="supplier"
class="input"
readonly
onclick="editField(this)">
</div>

</div>

</div>

<div class="card detail-card">

<div class="label">
Detail
</div>

<textarea
id="detail"
placeholder="พิมพ์รายละเอียด..."></textarea>

</div>

<div class="action-group">

<button
class="add-btn"
onclick="addDocument()">
+
</button>

<button
class="review-btn"
onclick="reviewDocument()">
Review Document
</button>

</div>

</div>

<!-- REVIEW -->

<div
id="reportOverlay"
class="report-overlay">

<div class="report-sheet">

<div
id="report"
class="report-content">
</div>

<div class="report-actions">

<button
class="btn-save"
onclick="saveReport()">
💾 Save
</button>

<button
class="btn-copy"
onclick="copyReport()">
📋 Copy
</button>

<button
class="btn-line"
onclick="sendLine()">
📤 LINE
</button>

</div>

</div>

</div>

<script>

let selectedDate = new Date();

function updateDate(){

const date =
selectedDate.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
});

document.getElementById(
"dateBox"
).innerHTML=date;

}

document
.getElementById("headerDate")
.addEventListener(
"change",
function(){

if(this.value){

selectedDate=
new Date(this.value);

updateDate();

}

});

document
.getElementById("dateBoxWrap")
.onclick=()=>{

document
.getElementById("headerDate")
.showPicker();

};

updateDate();

function addDocument(){

document.getElementById("docTitle").value="";
document.getElementById("partNo").value="";
document.getElementById("partName").value="";
document.getElementById("model").value="";
document.getElementById("supplier").value="";
document.getElementById("detail").value="";

}

function reviewDocument(){

let text="";

text += document.getElementById("docTitle").value + "\n\n";

text +=
"Date : " +
selectedDate.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
)
+ "\n";

text +=
"Part No : " +
document.getElementById("partNo").value +
"\n";

text +=
"Part Name : " +
document.getElementById("partName").value +
"\n";

text +=
"Model : " +
document.getElementById("model").value +
"\n";

text +=
"Supplier : " +
document.getElementById("supplier").value +
"\n\n";

text +=
"Detail :\n";

text +=
document.getElementById("detail").value;

document
.getElementById("report")
.innerText=text;

document
.getElementById("reportOverlay")
.classList.add("show");

}

function copyReport(){

navigator.clipboard.writeText(
document.getElementById("report").innerText
);

alert("Copy แล้ว");

}

function saveReport(){

const text =
document.getElementById("report").innerText;

const blob =
new Blob([text],
{type:"text/plain"});

const a =
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"Document.txt";

a.click();

}

function sendLine(){

const text=
document.getElementById("report").innerText;

window.open(
"https://line.me/R/share?text="
+
encodeURIComponent(text),
"_blank"
);

}

document
.getElementById("reportOverlay")
.addEventListener(
"click",
function(e){

if(e.target===this){

this.classList.remove("show");

}

});

</script>

<script>

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

    const response =
    await fetch("ข้อมูล Excel.xlsx");

    const data =
    await response.arrayBuffer();

    const workbook =
    XLSX.read(data,{type:"array"});

    const sheet =
    workbook.Sheets[
        workbook.SheetNames[0]
    ];

    const rows =
    XLSX.utils.sheet_to_json(sheet);

    rows.forEach(row=>{

        const partNo =
        String(row.PartNo || "").trim();

        if(!partNo) return;

        if(!allPartNo.includes(partNo)){
            allPartNo.push(partNo);
        }

        partMaster[partNo] = {

            partName:
            row.PartName || "",

            supplier:
            row.Supplier || "",

            model:
            row.Model || ""

        };

    });

}

async function loadExcel(){

try{

    const response =
    await fetch("ข้อมูล Excel.xlsx");

    console.log("Status =",response.status);

    const data =
    await response.arrayBuffer();

    const workbook =
    XLSX.read(data,{type:"array"});

    const sheet =
    workbook.Sheets[
        workbook.SheetNames[0]
    ];

    const rows =
    XLSX.utils.sheet_to_json(sheet);

    console.log(rows);

    rows.forEach(row=>{

        console.log(row);

        const partNo =
        String(row.PartNo || "").trim();

        if(!partNo) return;

        if(!allPartNo.includes(partNo)){
            allPartNo.push(partNo);
        }

        partMaster[partNo] = {

            partName:
            row.PartName || "",

            supplier:
            row.Supplier || "",

            model:
            row.Model || ""

        };

    });

    console.log(partMaster);

}catch(err){

    console.error(err);

}

}

loadExcel();

function editField(el){

if(el.hasAttribute("readonly")){

el.removeAttribute("readonly");

el.value="";

setTimeout(()=>{

el.focus();

},50);

}

}

function fillPartData(partNo){

if(!partMaster[partNo]) return;

const partName =
document.getElementById("partName");

const model =
document.getElementById("model");

const supplier =
document.getElementById("supplier");

partName.setAttribute("readonly",true);
model.setAttribute("readonly",true);
supplier.setAttribute("readonly",true);

partName.value =
partMaster[partNo].partName || "";

model.value =
partMaster[partNo].model || "";

supplier.value =
partMaster[partNo].supplier || "";

}

document
.getElementById("partNo")
.addEventListener("input",function(){

    const keyword =
    this.value.trim();

    const list =
    document.getElementById("partList");

    if(keyword===""){

        document.getElementById("partName").value="";
        document.getElementById("model").value="";
        document.getElementById("supplier").value="";

        list.innerHTML="";
        return;
    }

    if(partMaster[keyword]){

        fillPartData(keyword);

        list.innerHTML="";
        return;
    }

    if(keyword.length < 4){

        list.innerHTML="";
        return;
    }

    const result =
    allPartNo
    .filter(p=>

        p.startsWith(keyword) ||

        p.includes("-"+keyword)

    )
    .slice(0,10);

    list.innerHTML =
    result.map(p=>
    `<option value="${p}"></option>`
    ).join("");

});

document
.getElementById("partNo")
.addEventListener("change",function(){

    if(partMaster[this.value]){

        fillPartData(this.value);

    }

});

</script>

</body>
</html>
