<body>

<header class="header">

<button
class="back-btn"
onclick="window.location.href='menu-pl.html'">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="header-title">
<h1>PART BORROWING FROM PL</h1>
<p>Part Loan / Return / Defect</p>
</div>

<div class="date-box" id="dateBoxWrap">

<div id="dateBox"></div>

<input
type="date"
id="headerDate">

</div>

</header>

<div class="container">

<div class="top-grid">

<div class="card info-card">
<h3>Detail</h3>
<select class="select">
<option></option>
<option>ยืมชิ้นส่วน</option>
<option>คืนชิ้นส่วน</option>
<option>Defect</option>
</select>
</div>

<div class="card info-card">
<h3>Location</h3>
<select class="select">
<option></option>
<option>Box</option>
<option>Rack</option>
<option>Set Packing</option>
</select>
</div>

<div class="card info-card">
<h3>Set Packing No.</h3>

<input
class="select"
placeholder="00001">

</div>

</div>

<div class="card search-card">

<div class="search-icon">
<i class="fa-solid fa-magnifying-glass"></i>
</div>

<input
id="partno"
class="search-input"
list="partList"
placeholder="Part No.">

<datalist id="partList"></datalist>

<button
class="search-btn"
onclick="reviewReport()">
Review
</button>

</div>

<div class="card part-card">

<div class="section-title">
<i class="fa-solid fa-file-lines"></i>
Part Information
</div>

<div class="info-row">
<div class="label">Part Name</div>
<input
id="partname"
class="input"
readonly>
<div class="mode">

<button
class="auto"
onclick="setMode('partname',false)">
Auto
</button>

<button
class="manual"
onclick="setMode('partname',true)">
Manual
</button>

</div>
</div>

<div class="info-row">
<div class="label">Model</div>
<input
id="model"
class="input"
readonly>
<div class="mode">

<button
class="auto"
onclick="setMode('model',false)">
Auto
</button>

<button
class="manual"
onclick="setMode('model',true)">
Manual
</button>

</div>
</div>

<div class="info-row">
<div class="label">Supplier</div>
<input
id="supplier"
class="input"
readonly>
<div class="mode">

<button
class="auto"
onclick="setMode('supplier',false)">
Auto
</button>

<button
class="manual"
onclick="setMode('supplier',true)">
Manual
</button>

</div>
</div>

</div>

<div class="bottom-grid">

<div class="card qty-card">

<div class="section-title">
<i class="fa-solid fa-hashtag"></i>
Qty
</div>

<div class="qty-box">
<button id="minus">-</button>
<input
type="number"
id="qty"
class="qty-number"
value="1"
min="1">
<button id="plus">+</button>
</div>

</div>

<div class="card photo-card">

<div class="section-title">
<i class="fa-solid fa-camera"></i>
Photo
</div>

<input
type="file"
id="photoInput"
accept="image/*"
multiple
hidden>

<div class="photo-list" id="photoList">

<div class="photo-item add-photo"
onclick="document.getElementById('photoInput').click()">
+
</div>

</div>

</div>

</div>

<div class="actions">

<button
class="action-btn save"
onclick="openRemark()">
Remark
</button>

</div>

</div>

<script>

const qty=document.getElementById('qty');

document.getElementById('plus')
.onclick=()=>{
qty.value=
Number(qty.value)+1;
};

document.getElementById('minus')
.onclick=()=>{
if(Number(qty.value)>1){
qty.value=
Number(qty.value)-1;
}
};

let reportEditMode=false;

function reviewReport(){

let text = "";

const detail =
document.querySelectorAll(".top-grid select")[0];

const borrowLocation =
document.querySelectorAll(".top-grid select")[1];

const partno =
document.getElementById("partno");

const partname =
document.getElementById("partname");

const model =
document.getElementById("model");

const supplier =
document.getElementById("supplier");

const qty =
document.getElementById("qty");

if(detail.value === "ยืมชิ้นส่วน"){

const setPackingNo =
document.querySelector('input[placeholder="00001"]').value;

let locationText = "";

if(borrowLocation.value === "Set Packing"){

locationText =
`จาก Set Packing No. ${setPackingNo}`;

}else if(borrowLocation.value){

locationText =
`จาก ${borrowLocation.value}`;

}

text = `🚨 แจ้ง PL 🚨
Ins. นำชิ้นส่วน${locationText} ไปตรวจสอบ
`;

}else if(detail.value === "คืนชิ้นส่วน"){

text = `🚨 แจ้ง PL 🚨
Ins. นำชิ้นส่วนมาคืน${borrowLocation.value ? `ที่ ${borrowLocation.value}` : ""}
`;

}else if(detail.value === "Defect"){

text = `🚨 แจ้ง PL 🚨
Ins. นำชิ้นส่วน${borrowLocation.value ? `ใน ${borrowLocation.value}` : ""} ไป Defect
`;

}

const dateOnly =
selectedDate.toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

text += `Date : ${dateOnly}\n`;

if(partno.value)
text += `Part No : ${partno.value}\n`;

if(partname.value)
text += `Part Name : ${partname.value}\n`;

if(model.value)
text += `Model : ${model.value}\n`;

if(supplier.value)
text += `Supplier : ${supplier.value}\n`;

const qtyValue =
Number(qty.value);

text += `Qty : ${qtyValue} ${qtyValue === 1 ? "Pc." : "Pcs."}\n`;

const remarkElement =
document.getElementById("remark");

if(remarkElement && remarkElement.value.trim() !== ""){

text += `Remark : ${remarkElement.value.trim()}\n`;

}

text += "━━━━━━━━━━━━━━\n";
text += "📷 Photo : Attached";

document.getElementById("report").innerText =
text;

document
.getElementById("reportOverlay")
.classList.add("show");

}

function toggleEditReport(){

const report=
document.getElementById("report");

const btn=
document.getElementById("editBtn");

if(!reportEditMode){

report.contentEditable="true";

btn.innerHTML="💾";

btn.style.background="#4caf50";

reportEditMode=true;

}else{

report.contentEditable="false";

btn.innerHTML="📝";

btn.style.background="#2196f3";

reportEditMode=false;

}

}

function saveReport(){

const text=
document.getElementById("report").innerText;

const blob=
new Blob([text],{type:"text/plain"});

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"Borrowing_Report.txt";

a.click();

}

function copyReport(){

navigator.clipboard.writeText(
document.getElementById("report").innerText
);

alert("Copy แล้ว");

}

function sendLine(){

const text=
encodeURIComponent(
document.getElementById("report").innerText
);

window.open(
"https://line.me/R/share?text="+text,
"_blank"
);

}

</script>

<div id="reportOverlay" class="report-overlay">

    <div class="report-sheet">

        <button
        id="editBtn"
        class="add-btn"
        onclick="toggleEditReport()">
        📝
        </button>

        <div
        id="report"
        class="report-content"
        contenteditable="false">
        </div>

        <div class="report-actions">

            <button
            class="btn-save"
            onclick="saveReport()">
            💾 Save
            </button>

            <button
            class="btn-copy"
            onclick="copyReport()">
            📋 Copy
            </button>

            <button
            class="btn-line"
            onclick="sendLine()">
            📤 LINE
            </button>

        </div>

    </div>

</div>

<script>
document.getElementById("reportOverlay").addEventListener("click", function(e){

    if(e.target === this){
        this.classList.remove("show");
    }

});

document.getElementById("photoInput").addEventListener("change", function(){

const photoList =
document.getElementById("photoList");

for(const file of this.files){

const reader = new FileReader();

reader.onload = function(e){

const div =
document.createElement("div");

div.className = "photo-item";

div.innerHTML =
`<img src="${e.target.result}">`;

photoList.appendChild(div);

};

reader.readAsDataURL(file);

}

});

let selectedPhoto = null;

document.addEventListener("click",function(e){

const img = e.target.closest(".photo-item img");

if(!img) return;

selectedPhoto = img.closest(".photo-item");

const overlay =
document.getElementById("actionSheet");

const menu =
document.querySelector(".action-sheet");

menu.style.left = "50%";
menu.style.top = "45%";
menu.style.transform =
"translate(-50%,-50%)";

overlay.classList.add("show");

});

function showPreview(img){

selectedPhoto = img.closest(".photo-item");

const overlay =
document.getElementById("actionSheet");

overlay.classList.add("show");

}

const slider =
document.getElementById("photoList");

let isDown = false;
let startX;
let scrollLeft;

slider.addEventListener("mousedown",function(e){

isDown = true;
startX = e.pageX - slider.offsetLeft;
scrollLeft = slider.scrollLeft;

});

slider.addEventListener("mouseleave",function(){
isDown = false;
});

slider.addEventListener("mouseup",function(){
isDown = false;
});

slider.addEventListener("mousemove",function(e){

if(!isDown) return;

e.preventDefault();

const x = e.pageX - slider.offsetLeft;
const walk = (x - startX) * 2;

slider.scrollLeft = scrollLeft - walk;

});

function closeActionSheet(){

document
.getElementById("actionSheet")
.classList.remove("show");

}

function openPhoto(){

const img =
selectedPhoto.querySelector("img");

document.getElementById("viewerImage").src =
img.src;

document.getElementById("imageViewer")
.classList.add("show");

closeActionSheet();

}

function deletePhoto(){

if(selectedPhoto){

selectedPhoto.remove();

}

closeActionSheet();

}

function replacePhoto(){

document
.getElementById("replaceInput")
.click();

}

document
.getElementById("replaceInput")
.addEventListener("change",function(){

const file = this.files[0];

if(!file || !selectedPhoto) return;

const reader = new FileReader();

reader.onload = function(e){

selectedPhoto.innerHTML =
`<img src="${e.target.result}">`;

};

reader.readAsDataURL(file);

closeActionSheet();

});

document.getElementById("actionSheet")
.addEventListener("click",function(e){

if(e.target === this){
closeActionSheet();
}

});

</script>

<script>

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

    const response =
    await fetch("ข้อมูล Excel.xlsx");

    const data =
    await response.arrayBuffer();

    const workbook =
    XLSX.read(data,{type:"array"});

    const sheet =
    workbook.Sheets[
        workbook.SheetNames[0]
    ];

    const rows =
    XLSX.utils.sheet_to_json(sheet);

    rows.forEach(row=>{

        const partNo =
        String(row.PartNo || "").trim();

        if(!partNo) return;

        if(!allPartNo.includes(partNo)){
            allPartNo.push(partNo);
        }

        partMaster[partNo] = {

            partName:
            row.PartName || "",

            supplier:
            row.Supplier || "",

            model:
            row.Model || ""

        };

    });

}

loadExcel();

window.onload = function(){

    document
    .querySelectorAll(".auto")
    .forEach(btn =>
        btn.classList.add("active")
    );

};

function fillPartData(partNo){

    if(!partMaster[partNo]) return;

    document.getElementById("partname").value =
    partMaster[partNo].partName || "";

    document.getElementById("model").value =
    partMaster[partNo].model || "";

    document.getElementById("supplier").value =
    partMaster[partNo].supplier || "";

}

function setMode(id,isManual){

    const input =
    document.getElementById(id);

    const partNo =
    document.getElementById("partno").value;

    const modeBox =
    input.parentElement.querySelector(".mode");

    const autoBtn =
    modeBox.querySelector(".auto");

    const manualBtn =
    modeBox.querySelector(".manual");

    autoBtn.classList.remove("active");
    manualBtn.classList.remove("active");

    if(isManual){

        manualBtn.classList.add("active");

        input.readOnly = false;
        input.value = "";
        input.focus();

    }else{

        autoBtn.classList.add("active");

        input.readOnly = true;

        if(partMaster[partNo]){

            if(id==="partname"){
                input.value =
                partMaster[partNo].partName || "";
            }

            if(id==="model"){
                input.value =
                partMaster[partNo].model || "";
            }

            if(id==="supplier"){
                input.value =
                partMaster[partNo].supplier || "";
            }

        }

    }

}

document
.getElementById("partno")
.addEventListener("input",function(){

    const keyword =
    this.value.trim();

    const list =
    document.getElementById("partList");

    if(keyword === ""){

        partname.value = "";
        model.value = "";
        supplier.value = "";

        list.innerHTML = "";
        return;
    }

    if(partMaster[keyword]){

        fillPartData(keyword);

        list.innerHTML = "";

        return;
    }

    if(keyword.length < 4){

        list.innerHTML = "";
        return;
    }

    const result =
    allPartNo
    .filter(p=>

        p.startsWith(keyword) ||

        p.includes("-" + keyword)

    )
    .slice(0,10);

    list.innerHTML =
    result.map(p =>
    `<option value="${p}"></option>`)
    .join("");

});

document
.getElementById("partno")
.addEventListener("change",function(){

    if(partMaster[this.value]){

        fillPartData(this.value);

    }

});

</script>

    });

}

document.getElementById("headerDate");

});

updateDateTime();

setInterval(updateDateTime,1000);
