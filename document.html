<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

<title>Inspection Part</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>
html,body{
    touch-action:manipulation;
    overscroll-behavior:none;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    padding-bottom:80px;
}

/* HEADER */
.header{
    background:#009688;
    color:#fff;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:999;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    object-fit:contain;
}

#appTitle{
    font-size:20px;
    font-weight:bold;
}

.lang-btn{
    border:none;
    background:#fff;
    color:#009688;
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* MENU */
.menu-grid{
    padding:15px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.menu-card{
    height:100px;
    background:#fff;
    border:1px solid #999;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    cursor:pointer;
    transition:.2s;
}

.menu-card:hover{
    transform:translateY(-3px);
}

.icon{
    font-size:28px;
}

.menu-card span{
    text-align:center;
    font-size:14px;
    padding:0 8px;
}

@media(max-width:768px){

    .menu-grid{
        grid-template-columns:repeat(4,1fr);
        gap:6px;
    }

    .menu-card{
        height:85px;
    }

    .icon{
        font-size:24px;
    }

    .menu-card span{
        font-size:9px;
        line-height:1.1;
        padding:0 2px;
    }

    .logo{
        width:30px;
        height:30px;
    }

    #appTitle{
        font-size:16px;
    }

    .lang-btn{
        font-size:12px;
        padding:6px 10px;
    }
}

/* กัน Bottom Nav โดน CSS ทับ */
.bottom-nav button,
.bottom-nav button span{
    font-weight:400 !important;
}
</style>
</head>

<body>

<div class="header">

    <div class="logo-area">
        <img src="icon-192.png" class="logo">
        <div id="appTitle">Inspection Part</div>
    </div>

    <button class="lang-btn"
        onclick="changeLanguage()">
        TH / EN
    </button>

</div>

<div class="menu-grid">

    <div class="menu-card"
         onclick="location.href='part-problem-report.html'">
        <div class="icon">📋</div>
        <span id="reportText">PART PROBLEM REPORT</span>
    </div>

    <div class="menu-card"
         onclick="location.href='part-problem-newmodel.html'">
        <div class="icon">📦</div>
        <span id="newModelText">PART PROBLEM NEW MODEL</span>
    </div>

    <div class="menu-card"
         onclick="location.href='part-borrowing-pl.html'">
        <div class="icon">📨</div>
        <span id="borrowText">PART BORROWING FROM PL</span>
    </div>

    <div class="menu-card"
         onclick="location.href='assembly-trial.html'">
        <div class="icon">🧪</div>
        <span id="trialText">ASSEMBLY TRIAL</span>
    </div>

    <div class="menu-card"
         onclick="location.href='washing-room.html'">
        <div class="icon">🧼</div>
        <span id="washText">WASHING ROOM</span>
    </div>

    <div class="menu-card"
         onclick="location.href='dashboard.html'">
        <div class="icon">📊</div>
        <span id="dashboardText">DASHBOARD</span>
    </div>

    <div class="menu-card"
         onclick="location.href='document.html'">
        <div class="icon">📄</div>
        <span id="documentText">DOCUMENT</span>
    </div>

    <div class="menu-card"
         onclick="location.href='standard.html'">
        <div class="icon">📏</div>
        <span id="standardText">STANDARD</span>
    </div>

</div>

<script>
let thai=false;

function changeLanguage(){

    thai=!thai;

    if(thai){

        document.getElementById("reportText").innerText="แจ้งปัญหาชิ้นส่วน";
        document.getElementById("newModelText").innerText="ชิ้นส่วนรุ่นใหม่";
        document.getElementById("borrowText").innerText="ยืมชิ้นส่วนจาก PL";
        document.getElementById("trialText").innerText="ทดลองประกอบ";
        document.getElementById("washText").innerText="ห้องล้างชิ้นงาน";
        document.getElementById("dashboardText").innerText="แดชบอร์ด";
        document.getElementById("documentText").innerText="เอกสาร";
        document.getElementById("standardText").innerText="มาตรฐาน";

    }else{

        document.getElementById("reportText").innerText="PART PROBLEM REPORT";
        document.getElementById("newModelText").innerText="PART PROBLEM NEW MODEL";
        document.getElementById("borrowText").innerText="PART BORROWING FROM PL";
        document.getElementById("trialText").innerText="ASSEMBLY TRIAL";
        document.getElementById("washText").innerText="WASHING ROOM";
        document.getElementById("dashboardText").innerText="DASHBOARD";
        document.getElementById("documentText").innerText="DOCUMENT";
        document.getElementById("standardText").innerText="STANDARD";
    }
}
</script>

<script src="bottom-nav.js"></script>

</body>
</html>
