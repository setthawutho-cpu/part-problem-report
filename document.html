<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

<title>INSPECTION PART</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>

html, body{
    touch-action: manipulation;
    overscroll-behavior: none;
}

*{
    -webkit-tap-highlight-color: transparent;
}

.lang-btn{
    position:fixed;
    top:10px;
    right:10px;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:50%;

    background:#607d8b;
    color:#fff;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);

    z-index:99999;
}

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:10px;
    padding-bottom:90px;
    box-sizing:border-box;
}

.menu-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:60px;
    margin-bottom:40px;
}

.menu-btn{
    width:100%;
    max-width:100%;
    display:block;
    margin:15px auto;
    padding:18px;
    border:none;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
    box-sizing:border-box;
}

.report-btn{background:#2196f3;}
.newmodel-btn{background:#4caf50;}
.borrow-btn{background:#009688;}
.trial-btn{background:#9c27b0;}
.washing-btn{background:#00bcd4;}

</style>
</head>
<body>

<div class="container">

<div class="menu-title" id="titleText">
    INSPECTION PART
</div>

    <button class="menu-btn report-btn"
    onclick="location.href='part-problem-report.html'">
        📋 PART PROBLEM REPORT
    </button>

    <button class="menu-btn newmodel-btn"
    onclick="location.href='part-problem-newmodel.html'">
        📦 PART PROBLEM NEW MODEL
    </button>

    <button class="menu-btn borrow-btn"
    onclick="location.href='part-borrowing-pl.html'">
        🔄 PART BORROWING FROM PL
    </button>

    <button class="menu-btn trial-btn"
    onclick="location.href='assembly-trial.html'">
        🧪 ASSEMBLY TRIAL
    </button>

    <button class="menu-btn washing-btn"
    onclick="location.href='washing-room.html'">
        🧼 WASHING ROOM
    </button>

</div>

<button id="langBtn" class="lang-btn">
    EN
</button>

<script>

let langIndex = 0;

const textData = [

{
lang:"EN",
title:"INSPECTION PART",
report:"📋 PART PROBLEM REPORT",
newmodel:"📦 PART PROBLEM NEW MODEL",
borrow:"🔄 PART BORROWING FROM PL",
trial:"🧪 ASSEMBLY TRIAL",
washing:"🧼 WASHING ROOM",
},

{
lang:"TH",
title:"ตรวจสอบชิ้นส่วน",
report:"📋 รายงานปัญหาชิ้นส่วน",
newmodel:"📦 ปัญหาชิ้นส่วนรุ่นใหม่",
borrow:"🔄 ยืมชิ้นส่วนจาก PL",
trial:"🧪 ทดลองประกอบ",
washing:"🧼 ห้องล้างชิ้นส่วน",
},

{
lang:"JP",
title:"部品検査",
report:"📋 部品不良レポート",
newmodel:"📦 新機種部品不良",
borrow:"🔄 PLから部品借用",
trial:"🧪 組立トライ",
washing:"🧼 洗浄室",
}

];

document.querySelector(".report-btn").id="reportBtn";
document.querySelector(".newmodel-btn").id="newModelBtn";
document.querySelector(".borrow-btn").id="borrowBtn";
document.querySelector(".trial-btn").id="trialBtn";
document.querySelector(".washing-btn").id="washingBtn";

const savedLang = localStorage.getItem("language");

if(savedLang !== null){

    langIndex = Number(savedLang);

    const t = textData[langIndex];

    langBtn.innerText = t.lang;
    titleText.innerText = t.title;
    reportBtn.innerText = t.report;
    newModelBtn.innerText = t.newmodel;
    borrowBtn.innerText = t.borrow;
    trialBtn.innerText = t.trial;
    washingBtn.innerText = t.washing;

}

langBtn.onclick = function(){

    langIndex++;

    if(langIndex >= textData.length){
        langIndex = 0;
    }

    localStorage.setItem("language", langIndex);

    const t = textData[langIndex];

    langBtn.innerText = t.lang;
    titleText.innerText = t.title;
    reportBtn.innerText = t.report;
    newModelBtn.innerText = t.newmodel;
    borrowBtn.innerText = t.borrow;
    trialBtn.innerText = t.trial;
    washingBtn.innerText = t.washing;

};

</script>

<script>
document.addEventListener('gesturestart', function(e){
    e.preventDefault();
});

let lastTouchEnd = 0;

document.addEventListener('touchend', function(e){
    const now = Date.now();

    if(now - lastTouchEnd <= 300){
        e.preventDefault();
    }

    lastTouchEnd = now;
}, {passive:false});
</script>

<script src="bottom-nav.js"></script>

</body>
</html>
