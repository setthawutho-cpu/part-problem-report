async function loadExcel(){



\&#x20;   const response = await fetch("ข้อมูล Excel.xlsx");



\&#x20;   const data = await response.arrayBuffer();



\&#x20;   const workbook = XLSX.read(data,{

\&#x20;       type:"array"

\&#x20;   });



\&#x20;   const sheet =

\&#x20;   workbook.Sheets\\\[workbook.SheetNames\\\[0]];



\&#x20;   const rows =

\&#x20;   XLSX.utils.sheet\\\_to\\\_json(sheet);



\&#x20;   rows.forEach(row=>{



const partNo = String(

\&#x20;   row.PartNo || ""

).trim();



\&#x20;       if(partNo){



\&#x20;   if(!allPartNo.includes(partNo)){

\&#x20;   allPartNo.push(partNo);

}



\&#x20;   partMaster\\\[partNo] = {



\&#x20;               partName:

\&#x20;               row.PartName || "",



\&#x20;               supplier:

\&#x20;               row.Supplier || "",



\&#x20;               model:

\&#x20;               row.Model || ""



\&#x20;           };



\&#x20;       }



\&#x20;   });



\&#x20;   console.log(

\&#x20;     "Excel Loaded : " +

\&#x20;     Object.keys(partMaster).length

\&#x20;   );



}

document.getElementById("partno")

.addEventListener("input", function(){



\&#x20;   const keyword = this.value.trim();



\&#x20;   if(keyword === ""){



\&#x20;       if(!partnameManual) partname.value = "";

\&#x20;       if(!modelManual) model.value = "";

\&#x20;       if(!supplierManual) supplier.value = "";

\&#x20;   if(partMaster\\\[keyword]){

\&#x20;   if(keyword.length < 4){

\&#x20;       partList.innerHTML = "";

\&#x20;       return;

\&#x20;   }



\&#x20;   const result = allPartNo

\&#x20;       .filter(p =>

\&#x20;           p.startsWith(keyword) ||

\&#x20;           p.includes("-" + keyword)

\&#x20;       )

\&#x20;       .slice(0,10);



\&#x20;   partList.innerHTML = result

\&#x20;       .map(p => `<option value="${p}"></option>`)

\&#x20;       .join("");

function fillPartData(partNo){



\&#x20;   if(!partMaster\\\[partNo]) return;



\&#x20;   if(!partnameManual){

\&#x20;       partname.value =

\&#x20;       partMaster\\\[partNo].partName;

\&#x20;       partMaster\\\[partNo].model;

\&#x20;   }



\&#x20;   if(!supplierManual){

\&#x20;       partMaster\\\[partNo].supplier;

\&#x20;   }

\&#x20;   const stock =

\&#x20;   Number(document.getElementById("okQty").value || 0);



\&#x20;   let ng = stock - ok;



\&#x20;   if(ng < 0) ng = 0;



\&#x20;   document.getElementById("ngQty").value =

\&#x20;   ng === 0 ? "" : ng;



\&#x20;   document.getElementById("totalNg").value =

\&#x20;   ng === 0 ? "" : ng;



}
