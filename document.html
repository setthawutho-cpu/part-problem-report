<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Part Borrowing From PL</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:
linear-gradient(135deg,#edf4ff,#e8eef7);
min-height:100vh;
color:#16315b;
padding-bottom:120px;
}

html,
body{
touch-action:manipulation;
overscroll-behavior:none;
-webkit-text-size-adjust:none;
}

/* ================= HEADER ================= */

.header{
background:linear-gradient(135deg,#6d97ff,#3467ff);
padding:20px;
border-radius:0 0 30px 30px;
color:#fff;
position:relative;
overflow:hidden;
}

.header::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:rgba(255,255,255,.08);
border-radius:50%;
right:-100px;
top:-100px;
}

.header-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.back-btn{
width:58px;
height:58px;
border:none;
border-radius:18px;
background:#ffffffee;
font-size:28px;
cursor:pointer;
color:#234fba;
}

.title-wrap{
display:flex;
align-items:center;
gap:16px;
flex:1;
}

.logo{
font-size:42px;
}

.title-wrap h1{
font-size:18px;
}

.title-wrap p{
font-size:14px;
opacity:.9;
}

.datetime{
background:rgba(255,255,255,.2);
backdrop-filter:blur(15px);
padding:12px 18px;
border-radius:20px;
text-align:center;
font-weight:600;
}

/* ================= LAYOUT ================= */

.container{
padding:12px;
max-width:1200px;
margin:auto;
}

.card{
background:rgba(255,255,255,.65);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.7);
border-radius:24px;
box-shadow:
0 8px 20px rgba(0,0,0,.05);
padding:20px;
margin-bottom:16px;
}

.grid3{
display:grid;
grid-template-columns:1.2fr 0.9fr 0.9fr;
gap:16px;
}

.info-card{
background:rgba(255,255,255,.55);
backdrop-filter:blur(15px);
border-radius:24px;
padding:18px;
min-height:150px;

display:flex;
flex-direction:column;
justify-content:space-between;

box-shadow:
0 8px 20px rgba(0,0,0,.05),
inset 0 1px 0 rgba(255,255,255,.9);
}

.location-card{
background:rgba(220,255,235,.60);
}

.card-header{
display:flex;
align-items:center;
gap:14px;
margin-bottom:14px;
}

.card-icon{
font-size:34px;
width:42px;
text-align:center;
}

.card-title{
font-size:14px;
font-weight:700;
color:#183c78;
}

.info-card .input{
height:54px;
font-size:14px;
border-radius:16px;
}

.input{
width:100%;
height:52px;
border:none;
outline:none;
border-radius:16px;
padding:0 16px;
font-size:14px;
background:#fff;
box-shadow:inset 0 0 0 1px #dce7f6;
}

select.input{
cursor:pointer;
}

/* ================= SEARCH ================= */

.search-row{
display:flex;
gap:15px;
align-items:center;
}

.search-row .input{
flex:1;
}

.search-btn{
height:56px;
padding:0 30px;
border:none;
cursor:pointer;
border-radius:16px;
background:linear-gradient(135deg,#01a9ff,#1668ff);
color:#fff;
font-size:18px;
font-weight:700;
}

/* ================= PART INFO ================= */

.section-title{
font-size:18px;
font-weight:700;
margin-bottom:20px;
}

.info-grid{
display:grid;
grid-template-columns:150px 1fr 190px;
gap:15px;
align-items:center;
margin-bottom:14px;
}

.label{
font-size:14px;
font-weight:600;
}

.toggle{
display:flex;
background:#eef2f7;
border-radius:14px;
overflow:hidden;
}

.toggle button{
flex:1;
height:50px;
border:none;
cursor:pointer;
background:transparent;
font-size:14px;
}

.toggle button.active{
background:linear-gradient(135deg,#4ca5ff,#1d71ff);
color:#fff;
}

/* ================= QTY + PHOTO ================= */

.flex{
display:grid;
grid-template-columns:1fr 1.4fr;
gap:16px;
}

.qty-box{
display:flex;
height:92px;
overflow:hidden;
border-radius:18px;
background:#fff;
box-shadow:inset 0 0 0 1px #dbe5f2;
}

.qty-btn{
width:90px;
border:none;
font-size:45px;
cursor:pointer;
background:#fff;
}

.qty-value{
flex:1;
display:flex;
justify-content:center;
align-items:center;
font-size:56px;
font-weight:700;
}

.photo-area{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.upload-box{
width:95px;
height:95px;
border-radius:18px;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
font-size:42px;
border:2px dashed #90bfff;
}

.photo{
width:95px;
height:95px;
object-fit:cover;
border-radius:16px;
}

/* ================= REPORT ================= */

textarea{
width:100%;
height:250px;
resize:none;
border:none;
outline:none;
border-radius:16px;
padding:15px;
font-size:14px;
}

/* ================= ACTION BUTTONS ================= */

.actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:15px;
}

.action-btn{
border:none;
height:82px;
border-radius:24px;
font-size:16px;
font-weight:700;
color:#fff;
cursor:pointer;
}

.review{
background:linear-gradient(135deg,#1f8fff,#0e5de8);
}

.line{
background:linear-gradient(135deg,#10d95a,#01a83e);
}

.save{
background:linear-gradient(135deg,#ffb01c,#ff7a00);
}

@media(max-width:900px){

.title-wrap h1{
font-size:16px;
}

.title-wrap p{
font-size:12px;
}

.datetime{
font-size:12px;
padding:8px 10px;
}

}
</style>

</head>
<body>

<header class="header">

<div class="header-top">

<button class="back-btn">←</button>

<div class="title-wrap">
<div class="logo">📦</div>

<div>
<h1>PART BORROWING FROM PL</h1>
<p>Part Loan / Return / Defect</p>
</div>
</div>

<div class="datetime" id="datetime"></div>

</div>

</header>

<div class="container">

<!-- TOP CARDS -->

<div class="card">

<div class="grid3">

<!-- Transaction -->

<div class="info-card">

<div class="card-header">
<div class="card-icon">📄</div>
<div class="card-title">Transaction Type</div>
</div>

<select class="input">
<option>Borrow Part (ยืมชิ้นส่วน)</option>
<option>Return Part</option>
<option>Defect Part</option>
</select>

</div>

<!-- Date -->

<div class="info-card">

<div class="card-header">
<div class="card-icon">📅</div>
<div class="card-title">Date</div>
</div>

<input type="date" class="input">

</div>

<!-- Location -->

<div class="info-card location-card">

<div class="card-header">
<div class="card-icon">📍</div>
<div class="card-title">Location</div>
</div>

<select class="input">
<option>Rack</option>
<option>Warehouse</option>
<option>Production</option>
</select>

</div>

</div>

</div>

<!-- SEARCH -->

<div class="card">

<div class="search-row">

<label style="font-size:28px;font-weight:700;">
🔍 Part No.
</label>

<input
class="input"
placeholder="123456-AB">

<button class="search-btn">
ค้นหา
</button>

</div>

</div>

<!-- PART INFO -->

<div class="card">

<div class="section-title">
📄 Part Information
</div>

<div class="info-grid">

<div class="label">Part Name</div>

<input class="input" value="COVER ASSY">

<div class="toggle">
<button>Auto</button>
<button class="active">Manual</button>
</div>

</div>

<div class="info-grid">

<div class="label">Model</div>

<input class="input" value="ABC-123">

<div class="toggle">
<button>Auto</button>
<button class="active">Manual</button>
</div>

</div>

<div class="info-grid">

<div class="label">Supplier</div>

<input class="input" value="DENSO">

<div class="toggle">
<button>Auto</button>
<button class="active">Manual</button>
</div>

</div>

</div>

<!-- QTY + PHOTO -->

<div class="flex">

<div class="card">

<div class="section-title">
# Qty
</div>

<div class="qty-box">

<button class="qty-btn" onclick="qty(-1)">
−
</button>

<div id="qtyValue" class="qty-value">
10
</div>

<button class="qty-btn" onclick="qty(1)">
+
</button>

</div>

</div>

<div class="card">

<div class="section-title">
📷 Photo
</div>

<div class="photo-area">

<label class="upload-box">
+
<input
type="file"
multiple
accept="image/*"
hidden
onchange="preview(event)">
</label>

<div id="preview"></div>

</div>

</div>

</div>

<!-- REVIEW REPORT -->

<div class="card">

<div class="section-title">
📄 Review Report
</div>

<textarea id="report">
แจ้ง PL

Date : 15/11/2024
Part No. : 123456-AB
Part Name : COVER ASSY
Model : ABC-123
Supplier : DENSO
Qty : 10 PCS
</textarea>

</div>

<!-- BUTTONS -->

<div class="actions">

<button class="action-btn review">
🔎 Review
</button>

<button class="action-btn line">
LINE Send
</button>

<button class="action-btn save">
💾 Save Data
</button>

</div>

</div>

<script>

function qty(change){

let el=document.getElementById('qtyValue');

let value=parseInt(el.innerText);

value += change;

if(value<1) value=1;

el.innerText=value;

}

function preview(e){

let preview=document.getElementById('preview');

preview.innerHTML='';

Array.from(e.target.files).forEach(file=>{

let img=document.createElement('img');

img.className='photo';

img.src=URL.createObjectURL(file);

preview.appendChild(img);

});

}

function updateClock(){

let d=new Date();

document.getElementById('datetime').innerHTML=
d.toLocaleDateString()+
'<br>'+
d.toLocaleTimeString();

}

updateClock();

setInterval(updateClock,1000);

document
.querySelectorAll('.toggle')
.forEach(t=>{

let buttons=t.querySelectorAll('button');

buttons.forEach(btn=>{

btn.onclick=function(){

buttons.forEach(b=>
b.classList.remove('active'));

this.classList.add('active');

};

});

});

</script>

<script>
let lastTouchEnd = 0;

document.addEventListener('touchend', function(event){

const now = Date.now();

if(now - lastTouchEnd <= 300){
event.preventDefault();
}

lastTouchEnd = now;

}, false);
</script>

<script src="bottom-nav.js"></script>

</body>
</html>
