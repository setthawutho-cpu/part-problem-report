<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSPECTION PART</title>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

.menu-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:60px;
    margin-bottom:40px;
}

.menu-btn{
    width:90%;
    max-width:400px;
    display:block;
    margin:15px auto;
    padding:18px;
    border:none;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.report-btn{background:#2196f3;}
.newmodel-btn{background:#4caf50;}
.borrow-btn{background:#009688;}
.trial-btn{background:#9c27b0;}
.setting-btn{background:#ff9800;}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
}

.bottom-nav button{
    flex:1;
    border:none;
    background:#fff;
    font-size:20px;
}

.bottom-nav span{
    display:block;
    font-size:11px;
}

#splash{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#dfeaf3,#b8d0e6);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.splash-content{
    text-align:center;
    animation:fadeUp 1s ease;
}

#splash img{
    width:180px;
    height:180px;
    border-radius:40px;

    background:#fff;
    padding:12px;

    box-shadow:
        0 25px 50px rgba(0,0,0,0.25),
        0 10px 25px rgba(0,0,0,0.15);

    animation:
        logoZoom 1.2s ease,
        floatLogo 3s ease-in-out infinite;
}

.splash-text{
    margin-top:20px;
    font-size:24px;
    font-weight:700;
    letter-spacing:2px;
    color:#1f2937;

    text-shadow:
        0 2px 8px rgba(255,255,255,.7);
}

@keyframes logoZoom{
    0%{
        transform:scale(.5) rotate(-8deg);
        opacity:0;
    }
    70%{
        transform:scale(1.08) rotate(2deg);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes floatLogo{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>
<body>

<div id="splash">
    <div class="splash-content">
        <img src="icon-512.png" alt="Logo">

        <div class="splash-text">
            INSPECTION PART
        </div>

        <div style="
        color:#666;
        margin-top:8px;
        font-size:14px;">
            Quality Inspection System
        </div>
    </div>
</div>

<div class="menu-title">
    INSPECTION PART
</div>

<button class="menu-btn report-btn"
onclick="location.href='part-problem-report.html'">
📋 PART PROBLEM REPORT
</button>

<button class="menu-btn newmodel-btn"
onclick="location.href='part-problem-newmodel.html'">
📦 PART PROBLEM NEW MODEL
</button>

<button class="menu-btn borrow-btn"
onclick="location.href='part-borrowing-pl.html'">
🔄 PART BORROWING FROM PL
</button>

<button class="menu-btn trial-btn"
onclick="location.href='assembly-trial.html'">
🧪 ASSEMBLY TRIAL
</button>

<button class="menu-btn setting-btn"
onclick="location.href='settings.html'">
⚙️ SETTINGS
</button>

<div class="bottom-nav">

    <button onclick="location.href='dashboard.html'">
        📊
        <span>Home</span>
    </button>

    <button onclick="location.href='document.html'">
        📋
        <span>Report</span>
    </button>

    <button onclick="location.href='menu.html'">
        🏠
        <span>Menu</span>
    </button>

    <button onclick="location.href='standard.html'">
        📏
        <span>STD</span>
    </button>

    <button onclick="location.href='settings.html'">
        ⚙️
        <span>Setting</span>
    </button


</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

    setTimeout(()=>{

        document.getElementById("splash").style.opacity="0";

        setTimeout(()=>{
            document.getElementById("splash").style.display="none";
        },500);

    },2000);

});
</script>

</body>
</html>
