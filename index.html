<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PART PROBLEM REPORT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    margin:0;
    padding:10px;
    background:#dfeaf3;
    font-family:Segoe UI,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    background:#c7d9ea;
    padding:10px;
    border-radius:8px;
}

input,select,textarea{
    width:100%;
    padding:6px;
    margin:3px 0;
    box-sizing:border-box;
}

#date{
    width:150px;
}

.top-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.top-row label{
    margin:0;
}

#type{
    width:120px;
}

.row-info{
    display:flex;
    gap:10px;
    margin-bottom:8px;
}

.row-info > div{
    flex:1;
}

.line-stop-box{
    display:flex;
    align-items:center;
    gap:5px;
}

.line-stop-box input{
    flex:1;
}

textarea{
    min-height:80px;
}

.title{
    font-size:20px;
    font-weight:bold;
    text-align:center;
    margin-bottom:10px;
}

.section{
    background:#f6c000;
    padding:5px;
    margin-top:10px;
    font-weight:bold;
}

.inspection-box{
    background:#b7c7d8;
    border:1px solid #999;
    margin-top:10px;
}

.result{
    background:#95c11f;
    padding:8px;
    font-weight:bold;
    font-size:18px;
}

.inspection-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
}

.inspection-grid > div{
    padding:0;
}

.inspection-grid label{
    display:block;
    padding:3px;
    font-weight:normal;
}

.inspection-grid input,
.inspection-grid select{
    width:100%;
    height:42px;
    font-size:18px;
    margin:0;
}

.total-ng-box{
    padding:5px;
}

.total-ng-box input{
    width:35%;
    height:40px;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.review{
    background:#2196f3;
    color:white;
}

.submit{
    background:#e91e63;
    color:white;
}

.copy{
    background:#9c27b0;
    color:white;
}

.report{
    margin-top:10px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
    white-space:pre-wrap;

    overflow-wrap:break-word;
    word-wrap:break-word;
    word-break:break-word;

    max-width:100%;
    overflow-x:hidden;
}

#reworkResult{
    width:60%;
    height:42px;
    font-size:18px;
    box-sizing:border-box;
}

input,
select,
textarea,
button{
    border-radius:0 !important;
}

label,
.inspection-grid label{
    font-size:16px !important;
    font-weight:400;
}

#date,
#type,
#document,
#reworkResult,
#partNg{
    background:#ffffff !important;
    background-color:#ffffff !important;
    color:#000000 !important;
    opacity:1 !important;

    -webkit-appearance:none;
    appearance:none;

    border:1px solid #999;
}

#skcaNg,
#partNgQty,
#stockNg,
#okQty,
#ngQty,
#totalNg,
#partNg{
    font-size:18px !important;
}
``

@media (max-width:500px){

    label,
    .inspection-grid label{
        font-size:15px !important;
    }

}

@media (max-width:500px){

    .inspection-grid{
        grid-template-columns:45% 30% 25%;
    }

    .inspection-grid label{
        font-size:12px;
    }

    .inspection-grid input,
    .inspection-grid select{
        font-size:14px;
    }

}

</style>

</head>
<body>

<div class="container">

<div class="title">
🚨 PART PROBLEM REPORT 🚨
</div>

<div class="top-row">

    <label>Date</label>
    <input type="date" id="date">

    <label>Type</label>
    <select id="type">
        <option>New</option>
        <option>Repeat</option>
    </select>

</div>

<label>Part No.</label>
<input type="text" id="partno">

<label>Part Name</label>
<input type="text" id="partname" readonly>

<label>Model</label>
<input type="text" id="model" readonly>

<label>Supplier</label>
<input type="text" id="supplier" readonly>

<div class="row-info">

    <div>
        <label>Unit No.</label>
        <input type="text" id="unitno">
    </div>

    <div>
        <label>Document</label>
        <select id="document">
            <option>-</option>
            <option>UAR</option>
            <option>PAR</option>
        </select>
    </div>

    <div>
        <label>Line Stop</label>
        <div class="line-stop-box">
            <input type="number" id="linestop">
            <span>sec</span>
        </div>
    </div>

</div>

<label>Problem</label>
<textarea id="problem"></textarea>

<label>Detail</label>
<textarea id="detail"></textarea>

<div class="section">
🟡 CONTAINMENT ACTION
</div>

<label>Rework</label>
<textarea id="rework"></textarea>

<label>Result</label>
<select id="reworkResult">
<option>-</option>
<option>Rework OK</option>
<option>Wait Rework</option>
<option>เปลี่ยนชิ้นงานใน Stock</option>
<option>Reject</option>
<option>Defect</option>
</select>

<div class="inspection-box">

    <div class="result">
        📊 INSPECTION RESULT
    </div>

    <div class="inspection-grid">

        <div>
            <label>SKC-A MFG พบ NG</label>
            <input type="number" id="skcaNg" value="0">
        </div>

        <div>
            <label>Part NG</label>
            <select id="partNg">
                <option> </option>
                <option>Rework</option>
                <option>Reject</option>
                <option>Defect</option>
            </select>
        </div>

        <div>
            <label>Qty</label>
            <input type="number" id="partNgQty" value="0">
        </div>

        <div>
            <label>Check Stock</label>
            <input type="number" id="stockNg" value="0">
        </div>

        <div>
            <label>OK Qty</label>
            <input type="number" id="okQty" value="0">
        </div>

        <div>
            <label>NG Qty</label>
            <input type="number" id="ngQty" value="0">
        </div>

    </div>

    <div class="total-ng-box">
        <label><b>Total NG</b></label>
        <input type="number" id="totalNg" value="0" readonly>
    </div>

</div>

<button class="review" onclick="reviewReport()">
🔍 Review Report
</button>

<button class="copy" onclick="copyReport()">
📋 Copy Report
</button>

<div id="report" class="report"></div>

</div>

<script>

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

let partMaster = {};

async function loadExcel(){

    const response = await fetch("ข้อมูล Excel.xlsx");

    const data = await response.arrayBuffer();

    const workbook = XLSX.read(data,{
        type:"array"
    });

    const sheet =
    workbook.Sheets[workbook.SheetNames[0]];

    const rows =
    XLSX.utils.sheet_to_json(sheet);

    rows.forEach(row=>{

        const partNo = String(
    row.PartNo || ""
).trim().substring(0,10);

        if(partNo){

            partMaster[partNo] = {

                partName:
                row.PartName || "",

                supplier:
                row.Supplier || "",

                model:
                row.Model || ""

            };

        }

    });

    console.log(
      "Excel Loaded : " +
      Object.keys(partMaster).length
    );

}

loadExcel();

document
.getElementById("partno")
.addEventListener("input",function(){

    const partNo =
    this.value.trim().substring(0,10);

    if(partMaster[partNo]){

        document.getElementById("partname").value =
        partMaster[partNo].partName;

        document.getElementById("supplier").value =
        partMaster[partNo].supplier;

        document.getElementById("model").value =
        partMaster[partNo].model;

    }else{

        document.getElementById("partname").value="";
        document.getElementById("supplier").value="";
        document.getElementById("model").value="";

    }

});

function calculateNG(){

    let lineNg =
    Number(document.getElementById("skcaNg").value || 0);

    let stock =
    Number(document.getElementById("stockNg").value || 0);

    let ok =
    Number(document.getElementById("okQty").value || 0);

    let partQty =
    Number(document.getElementById("partNgQty").value || 0);

    let partType =
    document.getElementById("partNg").value;

    let ngQty = stock - ok;

    if(ngQty < 0) ngQty = 0;

    document.getElementById("ngQty").value = ngQty;

    let total = ngQty;

if(partType === "Reject" || partType === "Defect"){
    total += partQty;
}

    document.getElementById("totalNg").value = total;
}

function reviewReport(){

    let skca =
    Number(document.getElementById("skcaNg").value || 0);

    let stock =
    Number(document.getElementById("stockNg").value || 0);

    let ng =
    Number(document.getElementById("ngQty").value || 0);

    let totalNg =
    document.getElementById("totalNg").value;

const skcaUnit = skca == 1 ? "Pc." : "Pcs.";
const stockUnit = stock == 1 ? "Pc." : "Pcs.";
const okUnit = okQty.value == 1 ? "Pc." : "Pcs.";
const ngUnit = ng == 1 ? "Pc." : "Pcs.";
const partUnit = partNgQty.value == 1 ? "Pc." : "Pcs.";
const totalUnit = totalNg == 1 ? "Pc." : "Pcs.";

    let text = `🚨 PARTS PROBLEM REPORT 🚨
🗓️ Date : ${date.value.split("-").reverse().join("-")}
🏷️ Type : ${type.value}

📦 Part No. : ${partno.value}
📋 Part Name : ${partname.value}
🚜 Model : ${model.value}
🏭 Supplier : ${supplier.value}
🔢 Unit No. : ${unitno.value}
📄 Document : ${document.getElementById("document").value}
⏱️ Line Stop : ${linestop.value ? linestop.value + " Sec" : "-"}

🔴 Problem
${problem.value}

🔍 Detail

${detail.value}
━━━━━━━━━━━━━━
🟡 CONTAINMENT ACTION
✅ Rework : ${rework.value}
📋 Result : ${reworkResult.value}
━━━━━━━━━━━━━━
📊 INSPECTION RESULT
• SKC-A MFG พบ NG : ${skca} ${skcaUnit}
• Part NG (${partNg.value}) : ${partNgQty.value} ${partUnit}
• ผลการ Rework : ${reworkResult.value}

• Check Stock SKC : ${stock} ${stockUnit}
• OK : ${okQty.value} ${okUnit}
• NG : ${ng} ${ngUnit}
 
➡️ Total NG : ${totalNg} ${totalUnit}
━━━━━━━━━━━━━━
🔵 ACTION REQUEST
Supplier : ${supplier.value}

□ ตรวจสอบ Stock คงเหลือทั้งหมด
□ แจ้งจำนวน OK / NG
□ แนบรูป Mark Check
□ ตรวจสอบ Lot เดียวกันที่เกี่ยวข้อง
□ ขยายผลไปยัง Spare Part (ถ้ามี)
━━━━━━━━━━━━━━
👤 Reporter : Diesel
📷 Photo : Attached
`;

    document.getElementById("report").innerText = text;
}
document
.querySelectorAll("input,select,textarea")
.forEach(el => {

    el.addEventListener("input", () => {
        calculateNG();
        reviewReport();
    });

    el.addEventListener("change", () => {
        calculateNG();
        reviewReport();
    });

});

calculateNG();
reviewReport();


</script>

</body>
</html>
