<script>

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

    const response = await fetch("ข้อมูล Excel.xlsx");

    const data = await response.arrayBuffer();

    const workbook = XLSX.read(data,{
        type:"array"
    });

    const sheet =
    workbook.Sheets[workbook.SheetNames[0]];

    const rows =
    XLSX.utils.sheet_to_json(sheet);

    rows.forEach(row=>{

const partNo = String(
    row.PartNo || ""
).trim();

        if(partNo){

    if(!allPartNo.includes(partNo)){
    allPartNo.push(partNo);
}

    partMaster[partNo] = {

                partName:
                row.PartName || "",

                supplier:
                row.Supplier || "",

                model:
                row.Model || ""

            };

        }

    });

    console.log(
      "Excel Loaded : " +
      Object.keys(partMaster).length
    );

}

loadExcel();

let partnameManual = false;
let modelManual = false;
let supplierManual = false;

document.getElementById("partnameBtn").onclick = function(){

if(!partnameManual){

    partnameManual = true;

    partname.readOnly = false;
    partname.value = "";

    this.innerText = "Auto";
    this.style.background = "#06C755";
this.style.color = "#fff";

}else{

    partnameManual = false;

    partname.readOnly = true;

    this.innerText = "Manual";
this.style.background = "#d9d9d9";
this.style.color = "#000";

    fillPartData(partno.value);
}

        };

document.getElementById("modelBtn").onclick = function(){

    if(!modelManual){

        modelManual = true;

        model.readOnly = false;
                model.value = "";

        this.innerText = "Auto";
                this.style.background = "#06C755";
this.style.color = "#fff";

    }else{

        modelManual = false;

        model.readOnly = true;

        this.innerText = "Manual";
this.style.background = "#d9d9d9";
this.style.color = "#000";

        fillPartData(partno.value);
    }

};

document.getElementById("supplierBtn").onclick = function(){

    if(!supplierManual){

        supplierManual = true;

        supplier.readOnly = false;

        supplier.value = "";

        this.innerText = "Auto";
this.style.background = "#06C755";
this.style.color = "#fff";    }else{

        supplierManual = false;

        supplier.readOnly = true;

        this.innerText = "Manual";
this.style.background = "#d9d9d9";
this.style.color = "#000";
fillPartData(partno.value);

    }

};

document.getElementById("partno")
.addEventListener("input", function(){

    const keyword = this.value.trim();

    if(keyword === ""){

        if(!partnameManual) partname.value = "";
        if(!modelManual) model.value = "";
        if(!supplierManual) supplier.value = "";

        partList.innerHTML = "";
        return;
    }

    if(partMaster[keyword]){
        fillPartData(keyword);
        return;
    }

    if(keyword.length < 4){
        partList.innerHTML = "";
        return;
    }

    const result = allPartNo
        .filter(p =>
            p.startsWith(keyword) ||
            p.includes("-" + keyword)
        )
        .slice(0,10);

    partList.innerHTML = result
        .map(p => `<option value="${p}"></option>`)
        .join("");

});
function fillPartData(partNo){

    if(!partMaster[partNo]) return;

    if(!partnameManual){
        partname.value =
        partMaster[partNo].partName;
    }

    if(!modelManual){
        model.value =
        partMaster[partNo].model;
    }

    if(!supplierManual){
        supplier.value =
        partMaster[partNo].supplier;
    }

}

function calculateNG(){

    let lineNg =
    Number(document.getElementById("skcaNg").value || 0);
document.getElementById("partNgQty").value =
lineNg === 0 ? "" : lineNg;

    let stock =
    Number(document.getElementById("stockNg").value || 0);

    let ok =
    Number(document.getElementById("okQty").value || 0);

    let partQty =
    Number(document.getElementById("partNgQty").value || 0);

    let partType =
    document.getElementById("partNg").value;

    let ngQty = stock - ok;

    if(ngQty < 0) ngQty = 0;

    document.getElementById("ngQty").value =
ngQty === 0 ? "" : ngQty;

    let total = ngQty;

if(partType === "Reject" || partType === "Defect"){
    total += partQty;
}

function fillSubPart(index){

    const keyword =
    document.getElementById(`partNo${index}`)
    .value.trim();

    const partName =
    document.getElementById(`partName${index}`);

    const list =
    document.getElementById(`subPartList${index}`);

    partName.value = "";

    if(keyword === ""){
        list.innerHTML = "";
        return;
    }

    // มีใน Excel ตรงตัว
    if(partMaster[keyword]){
        partName.value =
        partMaster[keyword].partName || "";
        return;
    }

    // หา Part แม่ เช่น
    // 5T216-5151-30 -> 5T216-5151
    const parts = keyword.split("-");

    if(parts.length >= 3){

        const basePart =
        `${parts[0]}-${parts[1]}`;

        if(partMaster[basePart]){

            partName.value =
            partMaster[basePart].partName || "";

            return;
        }
    }

    if(keyword.length < 4){
        list.innerHTML = "";
        return;
    }

const result = allPartNo
    .filter(p =>
        p.startsWith(keyword) ||
        p.includes("-" + keyword)
    )
    .slice(0,10);;

    list.innerHTML = result
        .map(p => `<option value="${p}"></option>`)
        .join("");
}
