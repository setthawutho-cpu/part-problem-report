<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSPECTION PART</title>

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspection">
<meta name="theme-color" content="#06C755">

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

#splash{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#dfeaf3,#b8d0e6);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:opacity .5s ease;
}

.splash-content{
    text-align:center;
    animation:fadeUp 1s ease;
}

#splash img{
    width:180px;
    height:180px;
    border-radius:40px;
    background:#fff;
    padding:12px;
    box-shadow:
        0 25px 50px rgba(0,0,0,0.25),
        0 10px 25px rgba(0,0,0,0.15);
    animation:
        logoZoom 1.2s ease,
        floatLogo 3s ease-in-out infinite;
}

.splash-text{
    margin-top:20px;
    font-size:24px;
    font-weight:700;
    letter-spacing:2px;
    color:#1f2937;
    text-shadow:0 2px 8px rgba(255,255,255,.7);
}

@keyframes logoZoom{
    0%{
        transform:scale(.5) rotate(-8deg);
        opacity:0;
    }
    70%{
        transform:scale(1.08) rotate(2deg);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes floatLogo{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div id="splash">
    <div class="splash-content">
        <img src="icon-512.png" alt="Logo">

        <div class="splash-text">
            INSPECTION PART
        </div>

        <div style="color:#666;font-size:14px;margin-top:8px;">
            Quality Inspection System
        </div>
    </div>
</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

    setTimeout(()=>{

        document.getElementById("splash").style.opacity="0";

        setTimeout(()=>{

            location.href="dashboard.html";

        },500);

    },2000);

});

</script>

</body>
</html>
