<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSPECTION PART</title>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

.menu-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:60px;
    margin-bottom:40px;
}

.menu-btn{
    width:90%;
    max-width:400px;
    display:block;
    margin:15px auto;
    padding:18px;
    border:none;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.report-btn{background:#2196f3;}
.newmodel-btn{background:#4caf50;}
.borrow-btn{background:#009688;}
.trial-btn{background:#9c27b0;}
.setting-btn{background:#ff9800;}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
}

.bottom-nav button{
    flex:1;
    border:none;
    background:#fff;
    font-size:22px;
}

.bottom-nav span{
    display:block;
    font-size:12px;
}

#splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#dfeaf3;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.splash-content{
    text-align:center;
}

#splash img{
    width:180px;
    height:180px;
    border-radius:40px;
    animation:zoomIn .5s ease;
}

.splash-text{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:#333;
}

@keyframes zoomIn{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

</style>
</head>
<body>

<div id="splash">
    <div class="splash-content">
        <img src="icon-512.png" alt="Logo">
        <div class="splash-text">
            INSPECTION PART
        </div>
    </div>
</div>

<div class="menu-title">
    INSPECTION PART
</div>

<button class="menu-btn report-btn"
onclick="location.href='part-problem-report.html'">
📋 PART PROBLEM REPORT
</button>

<button class="menu-btn newmodel-btn"
onclick="location.href='part-problem-newmodel.html'">
📦 PART PROBLEM NEW MODEL
</button>

<button class="menu-btn borrow-btn"
onclick="location.href='part-borrowing-pl.html'">
🔄 PART BORROWING FROM PL
</button>

<button class="menu-btn trial-btn"
onclick="location.href='assembly-trial.html'">
🧪 ASSEMBLY TRIAL
</button>

<button class="menu-btn setting-btn"
onclick="location.href='settings.html'">
⚙️ SETTINGS
</button>

<div class="bottom-nav">

<button onclick="location.href='index.html'">
🏠
<span>Home</span>
</button>

<button onclick="location.href='document.html'">
📝
<span>Document</span>
</button>

<button onclick="location.href='standard.html'">
📏
<span>STD</span>
</button>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

    setTimeout(()=>{

        document.getElementById("splash").style.display="none";

    },1000);

});
</script>

</body>
</html>
