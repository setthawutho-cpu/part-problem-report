<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#1565C0">

<title>PL Dashboard</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>

:root{
    --primary:#1565C0;
    --primary-light:#42A5F5;
    --orange:#FB8C00;
    --orange-dark:#EF6C00;
    --bg:#F4F6F9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:#333;
    padding-bottom:90px;
}

/* HEADER */

.header{
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-light)
    );
    color:white;
    text-align:center;
    padding:25px 20px;
    border-radius:0 0 25px 25px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header h1{
    font-size:30px;
    margin-bottom:6px;
}

.header p{
    font-size:14px;
    opacity:.95;
}

.today{
    margin-top:8px;
    font-size:14px;
}

/* CARD */

.card{
    margin:15px;
    background:white;
    border-radius:18px;
    padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

/* DATE */

.date-label{
    font-weight:700;
    margin-bottom:10px;
}

.date-input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:15px;
}

.stat-card{
    border-radius:18px;
    color:white;
    text-align:center;
    padding:20px;
}

.loan{
    background:linear-gradient(
        135deg,
        #2196F3,
        #1565C0
    );
}

.defect{
    background:linear-gradient(
        135deg,
        #FFA000,
        #F57C00
    );
}

.count{
    font-size:34px;
    font-weight:bold;
}

.label{
    margin-top:5px;
    font-size:14px;
}

/* BUTTONS */

.menu-container{
    margin:15px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu-btn{
    border:none;
    border-radius:18px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;
    color:white;
    cursor:pointer;
    text-align:left;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.menu-btn:active{
    transform:scale(.98);
}

.loan-btn{
    background:linear-gradient(
        135deg,
        #2196F3,
        #1565C0
    );
}

.defect-btn{
    background:linear-gradient(
        135deg,
        #FFA000,
        #EF6C00
    );
}

.icon{
    font-size:42px;
}

.title{
    font-size:22px;
    font-weight:bold;
}

.subtitle{
    font-size:13px;
    opacity:.95;
}

/* ACTIVITY */

.activity{
    margin:15px;
    background:white;
    border-radius:18px;
    padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.activity h3{
    margin-bottom:12px;
}

.no-data{
    color:#999;
    padding:10px 0;
}

@media(max-width:600px){

    .title{
        font-size:18px;
    }

    .icon{
        font-size:34px;
    }

    .count{
        font-size:28px;
    }

}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">

    <h1 id="pageTitle"></h1>

    <p id="pageSubtitle"></p>

    <div class="today" id="todayDate"></div>

</div>

<!-- DATE -->

<div class="card">

    <div class="date-label" id="dateLabel"></div>

    <input
        type="date"
        id="viewDate"
        class="date-input">

</div>

<!-- SUMMARY -->

<div class="summary">

    <div class="stat-card loan">

        <div class="count" id="loanCount">0</div>

        <div class="label" id="loanLabel"></div>

    </div>

    <div class="stat-card defect">

        <div class="count" id="defectCount">0</div>

        <div class="label" id="defectLabel"></div>

    </div>

</div>

<!-- MENU -->

<div class="menu-container">

    <button
        class="menu-btn loan-btn"
        onclick="location.href='part-loan.html'">

        <div class="icon">🔄</div>

        <div>

            <div class="title" id="loanBtn"></div>

            <div class="subtitle">
                Part Loan & Return
            </div>

        </div>

    </button>

    <button
        class="menu-btn defect-btn"
        onclick="location.href='defect.html'">

        <div class="icon">⚠️</div>

        <div>

            <div class="title" id="defectBtn"></div>

            <div class="subtitle">
                Defect Report Management
            </div>

        </div>

    </button>

</div>

<!-- ACTIVITY -->

<div class="activity">

    <h3 id="activityTitle"></h3>

    <div id="activityList"></div>

</div>

<!-- BOTTOM NAV -->

<div id="bottomNav"></div>
<script src="bottom-nav.js"></script>

<script>

/* ---------- LANGUAGE ---------- */

const lang =
localStorage.getItem("language") || "th";

const text = {

    th:{
        title:"📦 ระบบจัดการ PL",
        sub:"ระบบยืม-คืนอะไหล่ และ Defect",
        date:"📅 เลือกวันที่",
        loan:"รายการยืม-คืน",
        defect:"รายการ Defect",
        loanBtn:"ยืม - คืนอะไหล่",
        defectBtn:"บันทึก Defect",
        activity:"📋 รายการประจำวัน",
        nodata:"ยังไม่มีข้อมูล"
    },

    en:{
        title:"📦 PL Dashboard",
        sub:"Part Loan & Defect Management",
        date:"📅 Select Date",
        loan:"Loan Records",
        defect:"Defect Records",
        loanBtn:"Part Loan & Return",
        defectBtn:"Defect Management",
        activity:"📋 Daily Activity",
        nodata:"No Data Available"
    }

};

const t = text[lang];

document.getElementById("pageTitle").textContent=t.title;
document.getElementById("pageSubtitle").textContent=t.sub;
document.getElementById("dateLabel").textContent=t.date;
document.getElementById("loanLabel").textContent=t.loan;
document.getElementById("defectLabel").textContent=t.defect;
document.getElementById("loanBtn").textContent=t.loanBtn;
document.getElementById("defectBtn").textContent=t.defectBtn;
document.getElementById("activityTitle").textContent=t.activity;

/* ---------- DATE ---------- */

const today = new Date();

if(lang === "th"){

    document.getElementById("todayDate")
    .textContent = today.toLocaleDateString(
        "th-TH",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}else{

    document.getElementById("todayDate")
    .textContent = today.toLocaleDateString(
        "en-GB",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}

document.getElementById("viewDate").value =
today.toISOString().split("T")[0];

/* ---------- DATA ---------- */

/* ดึงข้อมูลจริงจาก localStorage ภายหลังได้ */

const loanRecords =
JSON.parse(localStorage.getItem("loanRecords") || "[]");

const defectRecords =
JSON.parse(localStorage.getItem("defectRecords") || "[]");

document.getElementById("loanCount").textContent =
loanRecords.length;

document.getElementById("defectCount").textContent =
defectRecords.length;

/* ---------- ACTIVITY ---------- */

const activityList =
document.getElementById("activityList");

if(
    loanRecords.length===0 &&
    defectRecords.length===0
){

    activityList.innerHTML =
    `<div class="no-data">${t.nodata}</div>`;

}else{

    activityList.innerHTML="";

    loanRecords.slice(-5).reverse().forEach(item=>{

        activityList.innerHTML +=
        `<div>🔄 ${item.part || "-"}</div>`;

    });

    defectRecords.slice(-5).reverse().forEach(item=>{

        activityList.innerHTML +=
        `<div>⚠️ ${item.part || "-"}</div>`;

    });

}

/* ---------- LOCK ZOOM ---------- */

let lastTouchEnd = 0;

document.addEventListener(
'touchend',
function(e){

    const now = Date.now();

    if(now-lastTouchEnd<=300){
        e.preventDefault();
    }

    lastTouchEnd = now;

},
{passive:false}
);

</script>

</body>
</html>
