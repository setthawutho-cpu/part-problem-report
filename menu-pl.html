<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#1565C0">

<title>PL Dashboard</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>

:root{
    --blue:#1565C0;
    --blue2:#42A5F5;
    --orange:#FB8C00;
    --orange2:#EF6C00;
    --bg:#F4F6F9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:#333;
    padding-bottom:90px;
}

/* Header */

.header{
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:#fff;
    text-align:center;
    padding:25px 20px;
    border-radius:0 0 25px 25px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header h1{
    font-size:24px;
    margin-bottom:8px;
}

.header p{
    font-size:12px;
}

#todayDate{
    font-size:13px;
    margin-top:10px;
}

/* Card */

.card{
    background:#fff;
    margin:15px;
    padding:12px;
    border-radius:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

.card input{
    display:block;
    width:calc(100% - 10px);
    margin:0 auto;
    height:52px;
    padding:0 15px;
    border:1px solid #d9d9d9;
    border-radius:14px;
    font-size:18px;
    font-weight:600;
    text-align:center;
    background:#fff;
    color:#1565C0;
}

/* Summary */

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:15px;
}

.summary-box{
    color:#fff;
    text-align:center;
    border-radius:18px;
    padding:20px;
}

.loan{
    background:linear-gradient(135deg,#2196F3,#1565C0);
}

.defect{
    background:linear-gradient(135deg,#FFA000,#F57C00);
}

.summary-count{
    font-size:36px;
    font-weight:bold;
}

.summary-title{
    margin-top:5px;
    font-size:14px;
}

/* Menu */

.menu-container{
    margin:15px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu-btn{
    border:none;
    border-radius:18px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:15px;
    color:white;
    text-align:left;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.menu-btn:active{
    transform:scale(.98);
}

.loan-btn{
    background:linear-gradient(135deg,#2196F3,#1565C0);
}

.defect-btn{
    background:linear-gradient(135deg,#FFA000,#EF6C00);
}

.icon{
    font-size:42px;
    min-width:50px;
}

.title{
    font-size:22px;
    font-weight:bold;
}

.sub{
    font-size:13px;
}

/* Activity */

.activity{
    background:#fff;
    margin:15px;
    border-radius:18px;
    padding:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.activity h3{
    margin-bottom:10px;
}

.item{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.no-data{
    color:#999;
}

@media(max-width:600px){

    .title{
        font-size:18px;
    }

    .icon{
        font-size:34px;
    }

    .summary-count{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div class="header">

    <h1 id="title">
        📦 ระบบจัดการ PL
    </h1>

    <p id="subTitle">
        Part Loan & Defect Management
    </p>

    <div id="todayDate"></div>

</div>

<div class="card">

    <label id="lblDate">
        📅 เลือกวันที่
    </label>

    <input type="date" id="viewDate">

</div>

<div class="summary">

    <div class="summary-box loan">

        <div class="summary-count"
        id="loanCount">0</div>

        <div class="summary-title"
        id="loanLabel">
            รายการยืม-คืน
        </div>

    </div>

    <div class="summary-box defect">

        <div class="summary-count"
        id="defectCount">0</div>

        <div class="summary-title"
        id="defectLabel">
            รายการ Defect
        </div>

    </div>

</div>

<div class="menu-container">

    <button class="menu-btn loan-btn"
    onclick="location.href='part-loan.html'">

        <div class="icon">🔄</div>

        <div>

            <div class="title"
            id="loanBtnText">
            ยืม - คืนชิ้นส่วน
            </div>

            <div class="sub">
            Part Loan & Return
            </div>

        </div>

    </button>

    <button class="menu-btn defect-btn"
    onclick="location.href='defect.html'">

        <div class="icon">⚠️</div>

        <div>

            <div class="title"
            id="defectBtnText">
            Defect
            </div>

            <div class="sub">
            Defect Report Management
            </div>

        </div>

    </button>

</div>

<div class="activity">

    <h3 id="activityTitle">
        📋 รายการประจำวัน
    </h3>

    <div id="activityList">
        <div class="no-data">
            ยังไม่มีข้อมูล
        </div>
    </div>

</div>

<div id="bottomNav"></div>

<script src="bottom-nav.js"></script>

<script>

/* Language */

if(!localStorage.getItem("language")){
    localStorage.setItem("language","th");
}

const lang =
localStorage.getItem("language");

const TXT = {

th:{
title:"📦 ระบบจัดการ PL",
sub:"Part Loan & Defect Management",
date:"📅 เลือกวันที่",
loan:"รายการยืม-คืน",
defect:"รายการ Defect",
loanBtn:"ยืม - คืนชิ้นส่วน",
defectBtn:"Defect",
activity:"📋 รายการประจำวัน",
nodata:"ยังไม่มีข้อมูล"
},

en:{
title:"📦 PL Dashboard",
sub:"Part Loan & Defect Management",
date:"📅 Select Date",
loan:"Loan Records",
defect:"Defect Records",
loanBtn:"Part Loan & Return",
defectBtn:"Defect Management",
activity:"📋 Daily Activity",
nodata:"No Data Available"
}

};

const t = TXT[lang] || TXT.th;

/* Text */

title.innerText = t.title;
subTitle.innerText = t.sub;
lblDate.innerText = t.date;
loanLabel.innerText = t.loan;
defectLabel.innerText = t.defect;
loanBtnText.innerText = t.loanBtn;
defectBtnText.innerText = t.defectBtn;
activityTitle.innerText = t.activity;

/* Date */

const today = new Date();

if(lang==="th"){

todayDate.innerText =
today.toLocaleDateString(
"th-TH",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

}else{

todayDate.innerText =
today.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

}

const yyyy = today.getFullYear();
const mm = String(today.getMonth()+1).padStart(2,"0");
const dd = String(today.getDate()).padStart(2,"0");

viewDate.value = `${yyyy}-${mm}-${dd}`;

/* Data */

const loanRecords =
JSON.parse(
localStorage.getItem("loanRecords") || "[]"
);

const defectRecords =
JSON.parse(
localStorage.getItem("defectRecords") || "[]"
);

loanCount.innerText =
loanRecords.length;

defectCount.innerText =
defectRecords.length;

/* Activity */

activityList.innerHTML="";

if(
loanRecords.length===0 &&
defectRecords.length===0
){

activityList.innerHTML=
`<div class="no-data">${t.nodata}</div>`;

}

/* Lock Double Tap Zoom */

let lastTouchEnd = 0;

document.addEventListener(
"touchend",
function(e){

const now = Date.now();

if(now-lastTouchEnd<=300){
e.preventDefault();
}

lastTouchEnd = now;

},
{passive:false}
);

</script>

</body>
</html>
