<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PART BORROWING V2</title>

  <!-- Google Fonts: Prompt & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome & SheetJS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --bg-app: #f1f5f9;
      --surface: #ffffff;
      --surface-input: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --line-green: #06c755;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-primary: 0 10px 25px rgba(37, 99, 235, 0.3);
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", "Prompt", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overflow-x: hidden;
      touch-action: manipulation;
      background-color: var(--bg-app);
      color: var(--text-main);
    }

    body {
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    /* ================= HEADER ================= */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      padding: calc(14px + env(safe-area-inset-top)) 16px 18px;
      border-radius: 0 0 26px 26px;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(30, 64, 175, 0.22);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: var(--primary);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-sub {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .date-box {
      position: relative;
      min-width: 104px;
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
      transition: background 0.2s;
    }

    .date-box:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    #headerDate {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* ================= CONTAINER & CARDS ================= */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226, 232, 240, 0.8);
      min-width: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .section-title i {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* ================= TOP GRID (DETAIL / LOCATION) ================= */
    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .info-card h3 {
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #setPackingField {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .select-wrap {
      position: relative;
      width: 100%;
    }

    .select-wrap::after {
      content: "\f078";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 12px;
      color: var(--text-muted);
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* ================= INPUTS & SELECTS ================= */
    input, select, textarea {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--border-color);
      background: var(--surface-input);
      border-radius: var(--radius-md);
      padding: 0 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    select, .select {
      -webkit-appearance: none;
      appearance: none;
      padding-right: 34px;
      cursor: pointer;
    }

    input:focus, select:focus, textarea:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input[readonly] {
      background: #f1f5f9;
      color: #334155;
      border-color: transparent;
      cursor: pointer;
    }

    input[readonly]:hover {
      background: #e2e8f0;
    }

    /* ================= PART INFORMATION GRID ================= */
    .part-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-with-btn {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-btn input {
      padding-right: 44px;
    }

    .scan-btn {
      position: absolute;
      right: 5px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-light);
      border: none;
      color: var(--primary);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .scan-btn:hover {
      background: #dbeafe;
    }

    .scan-btn:active {
      transform: scale(0.92);
    }

    /* ================= QTY & PHOTO GRID ================= */
    .bottom-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 14px;
    }

    .qty-card, .photo-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .qty-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-input);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 4px;
      height: 68px;
    }

    .qty-btn {
      width: 54px;
      height: 58px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 600;
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .qty-btn:active {
      transform: scale(0.92);
      background: var(--primary-light);
    }

    .qty-number {
      flex: 1;
      min-width: 0;
      height: 58px;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      padding: 0;
      appearance: textfield;
    }

    .qty-number::-webkit-inner-spin-button,
    .qty-number::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Photo Row: Fixed '+' on the left, scrollable photos on the right */
    .photo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }

    .photo-list {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }

    .photo-list::-webkit-scrollbar {
      height: 4px;
    }

    .photo-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .photo-item {
      width: 68px;
      height: 68px;
      flex: 0 0 68px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface-input);
      position: relative;
      cursor: pointer;
      border: 1.5px solid var(--border-color);
      transition: transform 0.15s ease;
    }

    .photo-item:active {
      transform: scale(0.95);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .add-photo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--primary);
      background: var(--primary-light);
      border: 1.5px dashed #93c5fd;
    }

    .add-photo:hover {
      background: #dbeafe;
    }

    /* ================= REMARK ================= */
    textarea {
      height: 100px;
      padding: 12px 14px;
      resize: none;
      line-height: 1.5;
    }

    /* ================= FLOATING ACTION BUTTON ================= */
    .floating-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(241, 245, 249, 0.98) 65%, rgba(241, 245, 249, 0));
      z-index: 90;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .floating-review {
      pointer-events: auto;
      width: 100%;
      max-width: 960px;
      height: 54px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      box-shadow: var(--shadow-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease;
    }

    .floating-review:active {
      transform: scale(0.98);
    }

    /* ================= REPORT MODAL ================= */
    .report-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 16px;
    }

    @media (min-width: 640px) {
      .report-overlay {
        align-items: center;
      }
    }

    .report-overlay.show {
      display: flex;
      animation: fadeOverlay 0.2s ease;
    }

    @keyframes fadeOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .report-sheet {
      position: relative;
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      background: #ffffff;
      border-radius: 26px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .report-header-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .report-header-btns {
      display: flex;
      gap: 8px;
    }

    .icon-circle-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .icon-circle-btn.close-btn {
      background: #e2e8f0;
      color: #475569;
    }

    .icon-circle-btn:active {
      transform: scale(0.9);
    }

    .report-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14.5px;
      color: var(--text-main);
      background: #ffffff;
      min-height: 160px;
    }

    .report-content[contenteditable="true"] {
      background: #fffbeb;
      outline: 2px dashed #f59e0b;
      outline-offset: -6px;
    }

    .report-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 10px;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .report-actions button {
      height: 46px;
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .report-actions button:active {
      transform: scale(0.96);
    }

    .btn-save { background: var(--success); }
    .btn-copy { background: #8b5cf6; }
    .btn-line { background: var(--line-green); }

    /* ================= PHOTO ACTION SHEET ================= */
    .action-sheet-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 10000;
      padding: 16px;
    }

    @media (min-width: 640px) {
      .action-sheet-overlay {
        align-items: center;
      }
    }

    .action-sheet-overlay.show {
      display: flex;
    }

    .action-sheet {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.2s ease;
    }

    .action-sheet button {
      width: 100%;
      height: 48px;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      border-radius: 12px;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-sheet button:hover {
      background: var(--surface-input);
    }

    .action-sheet button.danger {
      color: var(--danger);
    }

    .action-sheet button.cancel {
      margin-top: 6px;
      margin-bottom: 0;
      background: #f1f5f9;
      color: var(--text-muted);
    }

    /* ================= IMAGE VIEWER ================= */
    .image-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 20px;
    }

    .image-viewer.show {
      display: flex;
    }

    .image-viewer img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
    }

    /* ================= TOAST NOTIFICATION ================= */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #0f172a;
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 999999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ================= RESPONSIVE (MOBILE 2-COLUMN LIKE DESKTOP) ================= */
    @media (max-width: 820px) {
      .bottom-grid {
        grid-template-columns: 1fr 1.45fr;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: calc(10px + env(safe-area-inset-top)) 12px 14px;
        border-radius: 0 0 20px 20px;
      }

      .header-inner {
        gap: 8px;
      }

      .header-title {
        font-size: 15px;
      }

      .header-sub {
        font-size: 10.5px;
      }

      .back-btn {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }

      .date-box {
        min-width: 86px;
        padding: 6px 8px;
        font-size: 10.5px;
        border-radius: 12px;
      }

      .container {
        padding: 10px;
        gap: 10px;
      }

      .card {
        padding: 12px;
        border-radius: 18px;
      }

      .section-title {
        font-size: 14px;
        gap: 8px;
        margin-bottom: 10px;
      }

      .section-title i {
        width: 26px;
        height: 26px;
        font-size: 12px;
        border-radius: 8px;
      }

      .top-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .info-card {
        padding: 10px;
      }

      .info-card h3 {
        font-size: 11.5px;
        margin-bottom: 6px;
      }

      .select-wrap::after {
        right: 10px;
        font-size: 10px;
      }

      input, select, textarea {
        height: 40px;
        font-size: 13px;
        padding: 0 10px;
        border-radius: 11px;
      }

      select, .select {
        padding-right: 26px;
      }

      .part-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px 8px;
      }

      .field {
        gap: 4px;
      }

      .field label {
        font-size: 11.5px;
      }

      .input-with-btn input {
        padding-right: 36px;
      }

      .scan-btn {
        right: 4px;
        width: 30px;
        height: 30px;
        font-size: 14px;
        border-radius: 8px;
      }

      .bottom-grid {
        grid-template-columns: 1fr 1.4fr;
        gap: 8px;
      }

      .qty-box {
        height: 54px;
        border-radius: 13px;
        padding: 3px;
      }

      .qty-btn {
        width: 34px;
        height: 46px;
        font-size: 18px;
        border-radius: 10px;
      }

      .qty-number {
        height: 46px;
        font-size: 22px;
      }

      .photo-row, .photo-list {
        gap: 6px;
      }

      .photo-item {
        width: 54px;
        height: 54px;
        flex: 0 0 54px;
        border-radius: 12px;
      }

      .add-photo {
        font-size: 20px;
      }

      textarea {
        height: 76px;
        padding: 10px;
        font-size: 13px;
      }

      .floating-wrap {
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      }

      .floating-review {
        height: 48px;
        font-size: 15px;
        border-radius: 15px;
      }
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
    <span id="toastMsg">ดำเนินการสำเร็จ</span>
  </div>

  <header class="header">
    <div class="header-inner">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <div class="header-info">
        <div class="header-title">PART BORROWING FROM PL</div>
        <div class="header-sub">Part Loan / Return / Defect</div>
      </div>

      <div class="date-box" id="dateBoxWrap">
        <div id="dateBox"></div>
        <input type="date" id="headerDate">
      </div>
    </div>
  </header>

  <div class="container">
    <!-- DETAIL & LOCATION -->
    <div class="top-grid" id="topGrid">
      <div class="card info-card">
        <h3><i class="fa-solid fa-list-check"></i> Detail</h3>
        <div class="select-wrap">
          <select id="detailSelect" class="select">
            <option value=""></option>
            <option>ยืมชิ้นส่วน</option>
            <option>คืนชิ้นส่วน</option>
            <option>Defect</option>
          </select>
        </div>
      </div>

      <div class="card info-card">
        <h3><i class="fa-solid fa-location-dot"></i> Location</h3>
        <div class="select-wrap">
          <select id="locationSelect" class="select">
            <option value=""></option>
            <option>Box</option>
            <option>Rack</option>
            <option>Set Packing</option>
          </select>
        </div>
      </div>

      <div class="card info-card" id="setPackingField" style="display:none;">
        <h3><i class="fa-solid fa-box-archive"></i> Set Packing No.</h3>
        <input id="setPackingNo" placeholder="00001">
      </div>
    </div>

    <!-- PART INFORMATION -->
    <div class="card">
      <div class="section-title">
        <i class="fa-solid fa-box"></i>
        <span>Part Information</span>
      </div>

      <div class="part-grid">
        <div class="field">
          <div class="field-header">
            <label for="partNo">Part No.</label>
          </div>
          <div class="input-with-btn">
            <input id="partNo" list="partList" placeholder="Part No.">
            <button type="button" id="scanQrBtn" class="scan-btn" onclick="openScanPage()" title="Scan QR Code">
              <i class="fa-solid fa-qrcode"></i>
            </button>
          </div>
          <datalist id="partList"></datalist>
        </div>

        <div class="field">
          <label for="partName">Part Name</label>
          <input id="partName" readonly onclick="editField(this)" onblur="restoreAuto(this)">
        </div>

        <div class="field">
          <label for="model">Model</label>
          <input id="model" readonly onclick="editField(this)" onblur="restoreAuto(this)">
        </div>

        <div class="field">
          <label for="supplier">Supplier</label>
          <input id="supplier" readonly onclick="editField(this)" onblur="restoreAuto(this)">
        </div>
      </div>
    </div>

    <!-- QTY + PHOTO -->
    <div class="bottom-grid">
      <div class="card qty-card">
        <div class="section-title">
          <i class="fa-solid fa-hashtag"></i>
          <span>Qty</span>
        </div>

        <div class="qty-box">
          <button type="button" id="minus" class="qty-btn">−</button>
          <input type="number" id="qty" class="qty-number" value="1" min="1">
          <button type="button" id="plus" class="qty-btn">+</button>
        </div>
      </div>

      <div class="card photo-card">
        <div class="section-title">
          <i class="fa-solid fa-camera"></i>
          <span>Photo</span>
        </div>

        <input type="file" id="photoInput" accept="image/*" multiple hidden>

        <div class="photo-row">
          <div class="photo-item add-photo" onclick="document.getElementById('photoInput').click()" title="เพิ่มรูปภาพ">
            <i class="fa-solid fa-plus"></i>
          </div>
          <div class="photo-list" id="photoList"></div>
        </div>
      </div>
    </div>

    <!-- REMARK -->
    <div class="card">
      <div class="section-title">
        <i class="fa-solid fa-note-sticky"></i>
        <span>Remark</span>
      </div>
      <textarea placeholder="Add remark..."></textarea>
    </div>
  </div>

  <!-- FLOATING REVIEW BUTTON -->
  <div class="floating-wrap">
    <button type="button" class="floating-review" onclick="reviewReport()">
      <i class="fa-solid fa-file-lines"></i>
      <span>Review Report</span>
    </button>
  </div>

  <!-- REPORT OVERLAY -->
  <div id="reportOverlay" class="report-overlay">
    <div class="report-sheet">
      <div class="report-header">
        <div class="report-header-title">
          <i class="fa-solid fa-file-invoice" style="color: var(--primary);"></i>
          <span>Review Report</span>
        </div>
        <div class="report-header-btns">
          <button type="button" id="editBtn" class="icon-circle-btn" onclick="toggleEditReport()" title="แก้ไขรายงาน">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button type="button" class="icon-circle-btn close-btn" onclick="document.getElementById('reportOverlay').classList.remove('show')" title="ปิด">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <div id="report" class="report-content" contenteditable="false"></div>

      <div class="report-actions">
        <button type="button" class="btn-save" onclick="saveReport()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
        <button type="button" class="btn-copy" onclick="copyReport()">
          <i class="fa-solid fa-copy"></i> Copy
        </button>
        <button type="button" class="btn-line" onclick="sendLine()">
          <i class="fa-brands fa-line"></i> LINE
        </button>
      </div>
    </div>
  </div>

  <!-- PHOTO ACTION SHEET -->
  <div id="actionSheet" class="action-sheet-overlay" onclick="if(event.target===this) closeActionSheet()">
    <div class="action-sheet">
      <button type="button" onclick="openPhoto()">
        <i class="fa-solid fa-expand"></i> เปิด
      </button>
      <button type="button" onclick="replacePhoto()">
        <i class="fa-solid fa-arrows-rotate"></i> เปลี่ยนรูป
      </button>
      <button type="button" class="danger" onclick="deletePhoto()">
        <i class="fa-solid fa-trash"></i> ลบรูป
      </button>
      <button type="button" class="cancel" onclick="closeActionSheet()">
        ยกเลิก
      </button>
    </div>
  </div>

  <input type="file" id="replaceInput" accept="image/*" hidden>

  <!-- IMAGE VIEWER -->
  <div id="imageViewer" class="image-viewer" onclick="this.classList.remove('show')">
    <img id="viewerImage" alt="Preview">
  </div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    let selectedDate = new Date();

    function updateDateTime() {
      const date = selectedDate.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });

      const time = new Date().toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit"
      });

      document.getElementById("dateBox").innerHTML = date + "<br>" + time;
    }

    document.getElementById("headerDate").addEventListener("change", function () {
      if (this.value) {
        selectedDate = new Date(this.value);
        updateDateTime();
      }
    });

    document.getElementById("dateBoxWrap").addEventListener("click", function () {
      const picker = document.getElementById("headerDate");
      if (picker.showPicker) {
        picker.showPicker();
      } else {
        picker.click();
      }
    });

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>

  <script>
    const locationSelect = document.getElementById("locationSelect");
    const setPackingField = document.getElementById("setPackingField");
    const topGrid = document.getElementById("topGrid");

    function updateTopGridLayout() {
      if (locationSelect.value === "Set Packing") {
        setPackingField.style.display = "flex";
        topGrid.style.gridTemplateColumns = "1fr 1fr 1.15fr";
      } else {
        setPackingField.style.display = "none";
        topGrid.style.gridTemplateColumns = "1fr 1fr";
      }
    }

    locationSelect.addEventListener("change", updateTopGridLayout);
    window.addEventListener("resize", updateTopGridLayout);
  </script>

  <script>
    let partMaster = {};
    let allPartNo = [];

    async function loadExcel() {
      try {
        const response = await fetch("ข้อมูล Excel.xlsx");
        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);

        rows.forEach(row => {
          const partNo = String(row.PartNo || "").trim();
          if (!partNo) return;

          if (!allPartNo.includes(partNo)) {
            allPartNo.push(partNo);
          }

          partMaster[partNo] = {
            partName: row.PartName || "",
            supplier: row.Supplier || "",
            model: row.Model || ""
          };
        });
      } catch (err) {
        console.error(err);
      }
    }

    loadExcel();

    function editField(el) {
      if (el.hasAttribute("readonly")) {
        el.dataset.autoValue = el.value;
        el.removeAttribute("readonly");
        el.value = "";
        setTimeout(() => {
          el.focus();
        }, 50);
      }
    }

    function restoreAuto(el) {
      if (el.value.trim() === "") {
        el.value = el.dataset.autoValue || "";
      }
    }

    function fillPartData(partNo) {
      if (!partMaster[partNo]) return;

      const partName = document.getElementById("partName");
      const model = document.getElementById("model");
      const supplier = document.getElementById("supplier");

      partName.setAttribute("readonly", true);
      model.setAttribute("readonly", true);
      supplier.setAttribute("readonly", true);

      partName.value = partMaster[partNo].partName || "";
      model.value = partMaster[partNo].model || "";
      supplier.value = partMaster[partNo].supplier || "";
    }

    document.getElementById("partNo").addEventListener("input", function () {
      const keyword = this.value.trim();
      const list = document.getElementById("partList");

      if (keyword === "") {
        document.getElementById("partName").value = "";
        document.getElementById("model").value = "";
        document.getElementById("supplier").value = "";

        document.getElementById("partName").setAttribute("readonly", true);
        document.getElementById("model").setAttribute("readonly", true);
        document.getElementById("supplier").setAttribute("readonly", true);

        list.innerHTML = "";
        return;
      }

      if (partMaster[keyword]) {
        fillPartData(keyword);
        list.innerHTML = "";
        return;
      }

      if (keyword.length < 4) {
        list.innerHTML = "";
        return;
      }

      const cleanKeyword = keyword.replace(/[^A-Za-z0-9]/g, "").toUpperCase();

      const result = allPartNo
        .filter(p => {
          const cleanPart = p.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
          return (
            p.toUpperCase().startsWith(keyword.toUpperCase()) ||
            p.toUpperCase().includes(keyword.toUpperCase()) ||
            cleanPart.includes(cleanKeyword)
          );
        })
        .slice(0, 50);

      list.innerHTML = result.map(p => `<option value="${p}"></option>`).join("");
    });

    document.getElementById("partNo").addEventListener("change", function () {
      const key = this.value.trim();

      if (partMaster[key]) {
        fillPartData(key);
        return;
      }

      const cleanKey = key.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      const found = allPartNo.find(
        p => p.replace(/[^A-Za-z0-9]/g, "").toUpperCase() === cleanKey
      );

      if (found) {
        this.value = found;
        fillPartData(found);
      }
    });

    function openScanPage() {
      location.href = "scan.html";
    }

    function receiveScannedPart() {
      const partNo = localStorage.getItem("scannedPartNo");
      if (!partNo) return;

      document.getElementById("partNo").value = partNo;
      document.getElementById("partNo").dispatchEvent(new Event("input"));
      document.getElementById("partNo").dispatchEvent(new Event("change"));

      localStorage.removeItem("scannedPartNo");
    }

    window.addEventListener("load", receiveScannedPart);
    window.addEventListener("pageshow", receiveScannedPart);
  </script>

  <script>
    const qty = document.getElementById("qty");

    document.getElementById("plus").onclick = () => {
      qty.value = Number(qty.value) + 1;
    };

    document.getElementById("minus").onclick = () => {
      if (Number(qty.value) > 1) {
        qty.value = Number(qty.value) - 1;
      }
    };
  </script>

  <script>
    let reportEditMode = false;

    function reviewReport() {
      let text = "";

      const detail = document.getElementById("detailSelect");
      const borrowLocation = document.getElementById("locationSelect");
      const partNo = document.getElementById("partNo");
      const partName = document.getElementById("partName");
      const model = document.getElementById("model");
      const supplier = document.getElementById("supplier");
      const qty = document.getElementById("qty");

      if (detail.value === "ยืมชิ้นส่วน") {
        const setPackingNo = document.getElementById("setPackingNo").value;
        let locationText = "";

        if (borrowLocation.value === "Set Packing") {
          locationText = `จาก Set Packing No. ${setPackingNo}`;
        } else if (borrowLocation.value) {
          locationText = `จาก ${borrowLocation.value}`;
        }

        text = `🚨 แจ้ง PL 🚨\nIns. นำชิ้นส่วน${locationText} ไปตรวจสอบ\n`;
      } else if (detail.value === "คืนชิ้นส่วน") {
        text = `🚨 แจ้ง PL 🚨\nIns. นำชิ้นส่วนมาคืน${borrowLocation.value ? `ที่ ${borrowLocation.value}` : ""}\n`;
      } else if (detail.value === "Defect") {
        text = `🚨 แจ้ง PL 🚨\nIns. นำชิ้นส่วน${borrowLocation.value ? `ใน ${borrowLocation.value}` : ""} ไป Defect\n`;
      }

      const dateOnly = selectedDate.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });

      text += `Date : ${dateOnly}\n`;

      if (partNo.value) text += `Part No : ${partNo.value}\n`;
      if (partName.value) text += `Part Name : ${partName.value}\n`;
      if (model.value) text += `Model : ${model.value}\n`;
      if (supplier.value) text += `Supplier : ${supplier.value}\n`;

      const qtyValue = Number(qty.value);
      text += `Qty : ${qtyValue} ${qtyValue === 1 ? "Pc." : "Pcs."}\n`;

      const remark = document.querySelector("textarea");
      if (remark && remark.value.trim() !== "") {
        text += `Remark : ${remark.value.trim()}\n`;
      }

      text += "━━━━━━━━━━━━━━\n";
      text += "📷 Photo : Attached";

      document.getElementById("report").innerText = text;
      document.getElementById("reportOverlay").classList.add("show");
    }

    function toggleEditReport() {
      const report = document.getElementById("report");
      const btn = document.getElementById("editBtn");

      if (!reportEditMode) {
        report.contentEditable = "true";
        report.focus();
        btn.innerHTML = '<i class="fa-solid fa-check"></i>';
        btn.style.background = "#10b981";
        reportEditMode = true;
        showToast("เปิดโหมดแก้ไขข้อความแล้ว");
      } else {
        report.contentEditable = "false";
        btn.innerHTML = '<i class="fa-solid fa-pen"></i>';
        btn.style.background = "#2563eb";
        reportEditMode = false;
        showToast("บันทึกการแก้ไขเรียบร้อย");
      }
    }

    function saveReport() {
      const text = document.getElementById("report").innerText;
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Borrowing_Report.txt";
      a.click();
      showToast("บันทึกไฟล์ Borrowing_Report.txt แล้ว");
    }

    function copyReport() {
      navigator.clipboard.writeText(document.getElementById("report").innerText);
      showToast("คัดลอกรายงานเรียบร้อยแล้ว");
    }

    function sendLine() {
      window.open(
        "https://line.me/R/share?text=" +
          encodeURIComponent(document.getElementById("report").innerText),
        "_blank"
      );
    }
  </script>

  <script>
    document.getElementById("photoInput").addEventListener("change", function () {
      const photoList = document.getElementById("photoList");

      for (const file of this.files) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const div = document.createElement("div");
          div.className = "photo-item";
          div.innerHTML = `<img src="${e.target.result}" alt="Attached">`;
          photoList.appendChild(div);
        };
        reader.readAsDataURL(file);
      }
      this.value = "";
    });

    let selectedPhoto = null;

    document.addEventListener("click", function (e) {
      const img = e.target.closest(".photo-item img");
      if (!img) return;
      selectedPhoto = img.closest(".photo-item");
      document.getElementById("actionSheet").classList.add("show");
    });

    function closeActionSheet() {
      document.getElementById("actionSheet").classList.remove("show");
    }

    function openPhoto() {
      const img = selectedPhoto.querySelector("img");
      document.getElementById("viewerImage").src = img.src;
      document.getElementById("imageViewer").classList.add("show");
      closeActionSheet();
    }

    function deletePhoto() {
      selectedPhoto.remove();
      closeActionSheet();
      showToast("ลบรูปภาพแล้ว");
    }

    function replacePhoto() {
      document.getElementById("replaceInput").click();
    }

    document.getElementById("replaceInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file || !selectedPhoto) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        selectedPhoto.innerHTML = `<img src="${e.target.result}" alt="Attached">`;
        showToast("เปลี่ยนรูปภาพเรียบร้อย");
      };
      reader.readAsDataURL(file);
      this.value = "";
      closeActionSheet();
    });

    const slider = document.getElementById("photoList");
    let isDown = false;
    let startX;
    let scrollLeft;

    slider.addEventListener("mousedown", function (e) {
      isDown = true;
      startX = e.pageX - slider.offsetLeft;
      scrollLeft = slider.scrollLeft;
    });

    slider.addEventListener("mouseleave", () => (isDown = false));
    slider.addEventListener("mouseup", () => (isDown = false));

    slider.addEventListener("mousemove", function (e) {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - slider.offsetLeft;
      const walk = (x - startX) * 2;
      slider.scrollLeft = scrollLeft - walk;
    });

    document.getElementById("reportOverlay").addEventListener("click", function (e) {
      if (e.target === this) {
        this.classList.remove("show");
      }
    });
  </script>

</body>
