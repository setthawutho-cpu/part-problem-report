<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Scan Part No.</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
background:#000;
font-family:sans-serif;
overflow:hidden;
}

/* หน้าเริ่ม */

#startPage{
position:fixed;
inset:0;
background:#000;

display:flex;
justify-content:center;
align-items:center;

z-index:99999;
}

#startBtn{
width:240px;
height:64px;

border:none;
border-radius:18px;

background:#2563eb;
color:#fff;

font-size:18px;
font-weight:600;

cursor:pointer;
}

/* กล้อง */

#reader{
display:none;

width:100%;
height:70vh;
background:#000;
}

#reader video{
width:100% !important;
height:100% !important;
object-fit:contain !important;
}

/* Header */

.topbar{
position:fixed;

top:20px;
left:20px;
right:20px;

display:none;
align-items:center;
justify-content:space-between;

z-index:9999;
}

.header-title{
color:#fff;
font-size:16px;
font-weight:600;
}

/* ปุ่ม */

.btn{
width:48px;
height:48px;

border:none;
border-radius:18px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(12px);

color:#fff;
font-size:24px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

box-shadow:0 4px 20px rgba(0,0,0,.3);
}

/* กรอบสแกน */

.scan-frame{
position:fixed;

left:50%;
top:39%;

transform:translate(-50%,-50%);

width:280px;
height:280px;

pointer-events:none;
display:none;

z-index:999;
}

.corner{
position:absolute;

width:30px;
height:30px;

border:5px solid #22c55e;
}

.tl{
top:0;
left:0;

border-right:none;
border-bottom:none;
}

.tr{
top:0;
right:0;

border-left:none;
border-bottom:none;
}

.bl{
left:0;
bottom:0;

border-right:none;
border-top:none;
}

.br{
right:0;
bottom:0;

border-left:none;
border-top:none;
}

.scan-line{
position:absolute;

left:10px;
right:10px;
top:20px;

height:3px;

background:#22c55e;

border-radius:999px;

box-shadow:0 0 10px #22c55e;

animation:scanMove 2s linear infinite;
}

@keyframes scanMove{

0%{
top:20px;
}

50%{
top:250px;
}

100%{
top:20px;
}

}

/* ข้อความ */

.scan-text{
position:fixed;

left:0;
right:0;
bottom:120px;

text-align:center;

color:#fff;
font-size:16px;

display:none;

z-index:999;
}

/* ปุ่มล่าง */

.bottom-tools{
position:fixed;

left:50%;
bottom:35px;

transform:translateX(-50%);

display:none;
gap:20px;

z-index:9999;
}

.tool-btn{
width:64px;
height:64px;

border:none;
border-radius:20px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(12px);

color:#fff;
font-size:28px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

box-shadow:0 4px 20px rgba(0,0,0,.3);
}

</style>
</head>

<body>

<div class="topbar">

<button
class="btn"
onclick="goBack()">
←
</button>

<div class="header-title">
Scan Part No.
</div>

<div style="width:56px"></div>

</div>

<div id="reader"></div>

<div class="scan-frame" id="scanFrame">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="scan-line"></div>

</div>

<div class="scan-text" id="scanText">
สแกน QR Code ของ Part
</div>

<div class="bottom-tools" id="bottomTools">

<button
class="tool-btn"
onclick="toggleTorch()">
🔦
</button>

<label class="tool-btn">

🖼️

<input
id="fileInput"
type="file"
accept="image/*"
hidden>

</label>

</div>

<textarea
id="result"
style="display:none">
</textarea>

<script>

let qrScanner;
let torchOn = false;

function extractPartNo(text){

return text.substring(3,13);

}

function startScanner(){

document.querySelector(".topbar").style.display="flex";

document.getElementById("reader").style.display="block";

document.getElementById("scanFrame").style.display="block";

document.getElementById("scanText").style.display="block";

document.getElementById("bottomTools").style.display="flex";

qrScanner =
new Html5Qrcode("reader");

qrScanner.start(

{
facingMode:"environment"
},

{
fps:10,
qrbox:{
width:250,
height:250
}
},

async function(decodedText){

const partNo =
extractPartNo(decodedText);

document.getElementById(
"result"
).value = partNo;

localStorage.setItem(
"scannedPartNo",
partNo
);

await qrScanner.stop();

history.back();

}

)
.catch(err=>{

alert("เปิดกล้องไม่สำเร็จ");

console.log(err);

});

}

async function toggleTorch(){

try{

torchOn = !torchOn;

await qrScanner
.applyVideoConstraints({

advanced:[
{
torch:torchOn
}
]

});

}catch(err){

alert(
"มือถือไม่รองรับไฟฉาย"
);

}

}

function goBack(){

history.back();

}

document
.getElementById("fileInput")
.addEventListener(
"change",
async function(){

const file =
this.files[0];

if(!file) return;

try{

const result =
await qrScanner.scanFile(
file,
true
);

const partNo =
extractPartNo(result);

document
.getElementById("result")
.value = partNo;

localStorage.setItem(
"scannedPartNo",
partNo
);

history.back();

}catch(err){

alert(
"ไม่พบ QR ในรูป"
);

}

});

startScanner();

</script>

</body>
</html>
