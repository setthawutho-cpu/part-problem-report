<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Scan Part</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Segoe UI,sans-serif;
}

#reader{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#reader video{
width:100% !important;
height:100% !important;
object-fit:cover !important;
}

.topbar{

position:fixed;

top:20px;
left:20px;
right:20px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:9999;
}

.btn{

width:52px;
height:52px;

border:none;
border-radius:50%;

background:rgba(0,0,0,.5);

color:#fff;

font-size:22px;

cursor:pointer;

backdrop-filter:blur(10px);
}

.title{

position:fixed;

bottom:40px;
left:20px;
right:20px;

text-align:center;

color:#fff;

font-size:18px;
font-weight:700;

z-index:9999;
}

</style>

</head>
<body>

<div class="topbar">

<button
class="btn"
onclick="goBack()">
←
</button>

<button
class="btn"
onclick="toggleTorch()">
🔦
</button>

</div>

<div id="reader"></div>

<div class="title">
สแกน QR / Barcode Part No.
</div>

<script>

let scanner;
let torchOn = false;

startScanner();

function startScanner(){

  scanner =
  new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode:"environment"
    },

    {
      fps:15,
      qrbox:250
    },

    onScanSuccess

  )
  .catch(err=>{

    console.error(err);

    alert(
      "ไม่สามารถเปิดกล้องได้"
    );

  });

}

async function onScanSuccess(decodedText){

  alert("SCAN OK : " + decodedText);

  try{
    await scanner.stop();
    await scanner.clear();
  }catch(e){}

  localStorage.setItem(
    "scannedPartNo",
    decodedText
  );

  location.href =
  "part-problem-inform.html";

}

async function toggleTorch(){

  try{

    torchOn = !torchOn;

    await scanner.applyVideoConstraints({
      advanced:[
        {
          torch:torchOn
        }
      ]
    });

  }catch(err){

    alert(
      "โทรศัพท์ไม่รองรับไฟฉาย"
    );

  }

}

async function goBack(){

  try{

    if(scanner){

      await scanner.stop();
      await scanner.clear();

    }

  }catch(e){}

  history.back();

}

</script>

</body>
</html>
