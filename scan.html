<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR Scan</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
background:#000;
font-family:sans-serif;
}

#reader{
width:100%;
height:70vh;
}

#reader video{
width:100% !important;
height:100% !important;
object-fit:contain !important;
}

.topbar{
position:fixed;
top:10px;
left:10px;
right:10px;

display:none;
justify-content:space-between;

z-index:9999;
}

.btn{
width:55px;
height:55px;

border:none;
border-radius:50%;

background:rgba(0,0,0,.6);

color:#fff;
font-size:24px;

display:flex;
align-items:center;
justify-content:center;
}

.result{
height:30vh;
background:#fff;
padding:10px;
}

textarea{
width:100%;
height:100%;
padding:10px;
font-size:14px;
}

#startPage{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:20000;
}

#startBtn{
width:220px;
height:60px;
border:none;
border-radius:15px;
background:#2563eb;
color:#fff;
font-size:18px;
font-weight:bold;
}

#reader{
display:none;
width:100%;
height:70vh;
}

</style>

</head>

<body>

<div id="startPage">

  <button id="startBtn" onclick="startScanner()">
    📷 เปิดกล้องสแกน QR
  </button>

</div>

<div class="topbar">

<button
class="btn"
onclick="goBack()">
←
</button>

<button
class="btn"
onclick="toggleTorch()">
🔦
</button>

<label
class="btn">

🖼️

<input
id="fileInput"
type="file"
accept="image/*"
hidden>

</label>

</div>

<div id="reader"></div>

<div class="result">

<textarea
id="result"
readonly
placeholder="ผลการอ่าน QR จะขึ้นตรงนี้">
</textarea>

</div>

<script>

let qrScanner;
let torchOn = false;

// startScanner();

function extractPartNo(text){

  return text.substring(3,13);

}

function startScanner(){

  document.getElementById("startPage").style.display="none";

  document.querySelector(".topbar").style.display="flex";

  document.getElementById("reader").style.display="block";

  qrScanner =
  new Html5Qrcode("reader");

  qrScanner.start(

    {
      facingMode:"environment"
    },

    {
      fps:10,
      qrbox:{
        width:320,
        height:320
      }
    },

    async function(decodedText){

      const partNo =
      extractPartNo(decodedText);

      document.getElementById(
        "result"
      ).value = partNo;

      localStorage.setItem(
        "scannedPartNo",
        partNo
      );

      await qrScanner.stop();

      history.back();

    }

  )
  .catch(err=>{

    alert(
      "เปิดกล้องไม่สำเร็จ"
    );

    console.log(err);

  });

}

async function toggleTorch(){

  try{

    torchOn = !torchOn;

    await qrScanner
    .applyVideoConstraints({

      advanced:[
        {
          torch:torchOn
        }
      ]

    });

  }catch(err){

    alert(
      "มือถือไม่รองรับไฟฉาย"
    );

  }

}

function goBack(){

  history.back();

}

document
.getElementById("fileInput")
.addEventListener(
"change",
async function(){

  const file =
  this.files[0];

  if(!file) return;

  try{

    const result =
    await qrScanner.scanFile(
      file,
      true
    );

    const partNo =
    extractPartNo(result);

    document
    .getElementById("result")
    .value = partNo;

    localStorage.setItem(
      "scannedPartNo",
      partNo
    );

    history.back();

  }catch(err){

    alert(
      "ไม่พบ QR ในรูป"
    );

  }

});

</script>

</body>
</html>
