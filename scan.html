<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR Scanner</title>

<script src="https://unpkg.com/@zxing/browser"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
background:#111;
font-family:Segoe UI,sans-serif;
overflow:hidden;
}

#video{
width:100%;
height:60vh;
background:#000;
object-fit:contain;
}

.topbar{

position:fixed;

top:15px;
left:15px;
right:15px;

display:flex;
justify-content:space-between;

z-index:9999;

}

.btn{

width:52px;
height:52px;

border:none;
border-radius:50%;

background:rgba(0,0,0,.65);

color:#fff;

font-size:22px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;
}

.result{

height:40vh;

background:#f3f4f6;

overflow:auto;

padding:10px;
}

.box{

background:#fff;

border-radius:12px;

padding:10px;

margin-bottom:10px;
}

.title{

font-size:13px;
font-weight:700;

margin-bottom:6px;

color:#555;
}

textarea{

width:100%;
height:120px;

padding:10px;

border:1px solid #ddd;

border-radius:8px;

resize:none;

font-size:13px;
}

</style>

</head>

<body>

<div class="topbar">

<button
class="btn"
onclick="goBack()">
←
</button>

<button
class="btn"
onclick="toggleTorch()">
🔦
</button>

<label class="btn">

🖼️

<input
id="fileInput"
type="file"
accept="image/*"
hidden>

</label>

</div>

<video
id="video"
autoplay
playsinline>
</video>

<div class="result">

<div class="box">

<div class="title">
QR RESULT
</div>

<textarea
id="qrResult"
readonly>
</textarea>

</div>

<div class="box">

<div class="title">
OCR RESULT
</div>

<textarea
id="ocrResult"
readonly>
</textarea>

</div>

</div>

<canvas
id="canvas"
style="display:none;">
</canvas>

<script>

let stream;
let track;
let torchOn=false;
let codeReader;

const video =
document.getElementById("video");

const qrResult =
document.getElementById("qrResult");

const ocrResult =
document.getElementById("ocrResult");

startCamera();

async function startCamera(){

  try{

    stream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{
          ideal:"environment"
        }
      }

    });

    video.srcObject = stream;

    track =
    stream.getVideoTracks()[0];

    startQR();

  }catch(err){

    alert("เปิดกล้องไม่สำเร็จ");

    console.error(err);

  }

}

async function startQR(){

  codeReader =
  new ZXing.BrowserQRCodeReader();

  codeReader.decodeFromVideoElement(
    video,
    (result,error)=>{

      if(result){

        qrResult.value =
        result.text;

        localStorage.setItem(
          "scannedPartNo",
          result.text
        );

      }

    }
  );

}

async function toggleTorch(){

  try{

    torchOn = !torchOn;

    await track.applyConstraints({

      advanced:[
        {
          torch:torchOn
        }
      ]

    });

  }catch(e){

    alert(
      "มือถือไม่รองรับไฟฉาย"
    );

  }

}

function goBack(){

  if(codeReader){

    codeReader.reset();

  }

  history.back();

}

document
.getElementById("fileInput")
.addEventListener(
"change",
readImage
);

async function readImage(e){

  const file =
  e.target.files[0];

  if(!file) return;

  const img =
  new Image();

  img.onload =
  async ()=>{

    try{

      const tmpReader =
      new ZXing.BrowserQRCodeReader();

      const result =
      await tmpReader.decodeFromImageElement(img);

      qrResult.value =
      result.text;

    }catch(err){

      qrResult.value =
      "ไม่พบ QR Code";

    }

    const canvas =
    document.getElementById("canvas");

    const ctx =
    canvas.getContext("2d");

    canvas.width =
    img.width;

    canvas.height =
    img.height;

    ctx.drawImage(
      img,
      0,
      0
    );

    ocrResult.value =
    "กำลังอ่านข้อความ...";

    try{

      const ocr =
      await Tesseract.recognize(
        canvas,
        "eng"
      );

      ocrResult.value =
      ocr.data.text;

    }catch(err){

      ocrResult.value =
      "อ่านข้อความไม่สำเร็จ";

    }

  };

  img.src =
  URL.createObjectURL(file);

}

</script>

</body>
</html>
