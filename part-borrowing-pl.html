<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PART BORROWING FROM PL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    margin:0;
    padding:10px;
    background:#dfeaf3;
    font-family:Segoe UI,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    background:#c7d9ea;
    padding:15px;
    border-radius:8px;
    padding-bottom:140px;
}

.title{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

.top-row{
    display:flex;
    gap:10px;
}

.top-row>div{
    flex:1;
}

.label-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input,
select{
    width:100%;
    padding:8px;
    margin:4px 0 8px;
    box-sizing:border-box;
    font-size:16px;
}

#photos{
    background:#fff;
    border:1px solid #999;
}

.manual-btn{
    width:70px !important;
    height:24px !important;

    margin:0 !important;
    padding:0 !important;

    background:#d9d9d9 !important;
    color:#000 !important;

    border:1px solid #666 !important;

    box-shadow:
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 #888,
        2px 2px 3px rgba(0,0,0,0.25);

    font-size:13px !important;
    font-weight:normal !important;

    cursor:pointer;
}

.review{
    background:#2196f3;
    color:white;
}

.copy{
    background:#9c27b0;
    color:white;
}

.line{
    background:#06C755;
    color:white;
}

.save{
    background:#ff9800;
    color:white;
}

input,
select,
textarea,
button{
    border-radius:0 !important;
}

input,
select{
    font-size:16px !important;
    border:1px solid #999;
    background:#fff;
}

.manual-btn:active{
    transform:translateY(1px);

    box-shadow:
        inset -1px -1px 0 #ffffff,
        inset 1px 1px 0 #888;
}

.report{
    margin-top:10px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
    white-space:pre-wrap;
    line-height:1.2;

    overflow-wrap:break-word;
    word-wrap:break-word;
    word-break:break-word;

    max-width:100%;
    overflow-x:hidden;
}

#qty{
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

#photoCount{
    color:#0066cc;
    margin-bottom:10px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
    z-index:99999;
}

.bottom-nav button{
    flex:1;
    margin:0;
    padding:0;
    border:none;
    background:#fff;
    color:#333;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-size:18px;
    font-weight:normal;
}

.bottom-nav button span{
    font-size:10px;
    margin-top:2px;
    line-height:1;
}

.bottom-nav button:active{
    background:#f1f1f1;
}

.top-nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9999;
    background:#dfeaf3;
    padding:8px 12px;
    box-sizing:border-box;

    display:flex;
    align-items:center;
}

.top-nav span{
    color:#000;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
}

.container{
    padding-top:50px;
}

.top-nav span{
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>
<body>

<div class="top-nav">

    <span onclick="backToMenu()">
        ❮ กลับ
    </span>

</div>

<div class="container">

<div class="title">
🚨 PART BORROWING FROM PL 🚨
</div>

<div class="top-row">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Detail</label>
<select id="detail">
<option value=""></option>
<option>ยืมชิ้นส่วน</option>
<option>คืนชิ้นส่วน</option>
</select>
</div>

</div>

<label>Location</label>
<select id="location">
<option value=""></option>
<option>Box</option>
<option>Rack</option>
<option>SRT Packing</option>
</select>

<label>Part No.</label>
<input type="text" id="partno" list="partList" autocomplete="off">

<datalist id="partList"></datalist>

<div class="label-row">
<label>Part Name</label>
<button type="button" id="partnameBtn" class="manual-btn">
Manual
</button>
</div>

<input type="text" id="partname" readonly>

<div class="label-row">
<label>Model</label>
<button type="button" id="modelBtn" class="manual-btn">
Manual
</button>
</div>

<input type="text" id="model" readonly>

<div class="label-row">
<label>Supplier</label>
<button type="button" id="supplierBtn" class="manual-btn">
Manual
</button>
</div>

<input type="text" id="supplier" readonly>

<label>Qty</label>
<input type="number" id="qty">

<label>Photo</label>
<input type="file"
       id="photos"
       multiple
       accept="image/*">

<div id="photoCount">
เลือกแล้ว 0 รูป
</div>

<button class="review" onclick="reviewReport()">
🔍 Review
</button>

<button class="copy" onclick="copyReport()">
📋 Copy Report
</button>

<button class="line" onclick="sendLine()">
📤 Send LINE
</button>

<button class="save" onclick="saveData()">
💾 Save Data
</button>

<div id="report" class="report"></div>

</div>

<script>

date.value =
new Date().toISOString().split("T")[0];

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

try{

const response =
await fetch("ข้อมูล Excel.xlsx");

const data =
await response.arrayBuffer();

const wb =
XLSX.read(data,{type:"array"});

const sheet =
wb.Sheets[wb.SheetNames[0]];

const rows =
XLSX.utils.sheet_to_json(sheet);

rows.forEach(row=>{

const partNo =
String(row.PartNo || "").trim();

if(partNo){

allPartNo.push(partNo);

partMaster[partNo]={
partName:row.PartName || "",
model:row.Model || "",
supplier:row.Supplier || ""
};

}

});

}catch(e){
console.log(e);
}

}

loadExcel();

let partnameManual = false;
let modelManual = false;
let supplierManual = false;

/* PART NAME */
partnameBtn.onclick = function(){

    partnameManual = !partnameManual;

    if(partnameManual){

        partname.readOnly = false;

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        partname.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);

    }

};

/* MODEL */
modelBtn.onclick = function(){

    modelManual = !modelManual;

    if(modelManual){

        model.readOnly = false;

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        model.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);

    }

};

/* SUPPLIER */
supplierBtn.onclick = function(){

    supplierManual = !supplierManual;

    if(supplierManual){

        supplier.readOnly = false;

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        supplier.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);

    }

};
partno.addEventListener("input",function(){

const keyword =
this.value.trim();

if(partMaster[keyword]){

fillPartData(keyword);

return;

}

if(keyword.length<3){

partList.innerHTML="";
return;

}

const result =
allPartNo
.filter(x=>x.includes(keyword))
.slice(0,10);

partList.innerHTML =
result
.map(x=>`<option value="${x}"></option>`)
.join("");

});

function fillPartData(partNo){

    if(!partMaster[partNo]) return;

    if(!partnameManual){
        partname.value =
        partMaster[partNo].partName || "";
    }

    if(!modelManual){
        model.value =
        partMaster[partNo].model || "";
    }

    if(!supplierManual){
        supplier.value =
        partMaster[partNo].supplier || "";
    }

}

photos.addEventListener("change",()=>{

    photoCount.innerText =
    `📷 เลือกแล้ว ${photos.files.length} รูป`;

    reviewReport();

});

function reviewReport(){

let text =
"🚨 PART BORROWING FROM PL 🚨\n\n";

if(date.value)
text += `Date : ${date.value}\n`;

if(detail.value)
text += `Detail : ${detail.value}\n`;

if(location.value)
text += `Location : ${location.value}\n`;

text += "\n";

if(partno.value)
text += `Part No. : ${partno.value}\n`;

if(partname.value)
text += `Part Name : ${partname.value}\n`;

if(model.value)
text += `Model : ${model.value}\n`;

if(supplier.value)
text += `Supplier : ${supplier.value}\n`;

if(qty.value)
text += `Qty : ${qty.value} Pcs.\n`;

text += "\n━━━━━━━━━━━━━━\n";

text += `Photo : ${photos.files.length} รูป`;

report.style.display = "block";
report.innerText = text;

}

function copyReport(){

if(!report.innerText){

reviewReport();

}

navigator.clipboard.writeText(
report.innerText
);

alert("Copy สำเร็จ");

}

function sendLine(){

    if(!report.innerText){
        reviewReport();
    }

    location.href =
    "https://line.me/R/share?text=" +
    encodeURIComponent(report.innerText);

}

function saveData(){

    const data={
        date:date.value,
        detail:detail.value,
        location:location.value,
        partNo:partno.value,
        partName:partname.value,
        model:model.value,
        supplier:supplier.value,
        qty:qty.value
    };

    localStorage.setItem(
        "borrowPLData",
        JSON.stringify(data)
    );

    alert("บันทึกสำเร็จ");

}

function backToMenu(){
    location.href = "menu.html";
}

window.onload=()=>{

const saved=
localStorage.getItem("borrowPLData");

if(!saved) return;

const data=
JSON.parse(saved);

date.value=data.date || "";
detail.value=data.detail || "";
location.value=data.location || "";
partno.value=data.partNo || "";
partname.value=data.partName || "";
model.value=data.model || "";
supplier.value=data.supplier || "";
qty.value=data.qty || "";

if(partno.value){
    fillPartData(partno.value);
}

};

</script>

<div class="bottom-nav">

<button onclick="location.href='menu.html'">
🏠
<span>Home</span>
</button>

<button onclick="location.href='dashboard.html'">
📊
<span>Dashboard</span>
</button>

📝
<span>Document</span>

📏
<span>STD</span>
</button>

<button onclick="location.href='settings.html'">
⚙️
<span>Setting</span>
</button>

</div>

</body>
</html>
