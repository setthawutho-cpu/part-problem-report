<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PART BORROWING FROM PL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    margin:0;
    padding:10px;
    background:#dfeaf3;
    font-family:Segoe UI,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    background:#c7d9ea;
    padding:15px;
    border-radius:8px;
    padding-bottom:90px;
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.top-row{
    display:flex;
    gap:10px;
}

.top-row>div{
    flex:1;
}

.label-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input,
select{
    width:100%;
    padding:8px;
    margin:4px 0 8px;
    box-sizing:border-box;
    font-size:16px;
}

#photos{
    background:#fff;
    border:1px solid #999;
}

.manual-btn{
    width:70px;
    height:28px;
    margin:0;
    border:1px solid #666;
    background:#d9d9d9;
}

button{
    width:100%;
    padding:10px;
    border:none;
    margin-top:5px;
    color:#fff;
    font-weight:bold;
}

.review{background:#2196f3;}
.copy{background:#9c27b0;}
.line{background:#06C755;}
.save{background:#ff9800;}

.report{
    margin-top:10px;
    background:#fff;
    padding:10px;
    border:1px solid #ccc;
    white-space:pre-wrap;
    display:none;
}

#photoCount{
    color:#0066cc;
    margin-bottom:10px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
}

.bottom-nav button{
    flex:1;
    margin:0;
    background:#fff;
    color:#333;
    font-size:18px;
}

.bottom-nav span{
    display:block;
    font-size:10px;
}

</style>
</head>
<body>

<div class="container">

<div class="title">
🚨 PART BORROWING FROM PL 🚨
</div>

<div class="top-row">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Detail</label>
<select id="detail">
<option value=""></option>
<option>ยืมชิ้นส่วน</option>
<option>คืนชิ้นส่วน</option>
</select>
</div>

</div>

<label>Location</label>
<select id="location">
<option value=""></option>
<option>Box</option>
<option>Rack</option>
<option>Srt Packing</option>
</select>

<label>Part No.</label>
<input type="text" id="partno" list="partList" autocomplete="off">

<datalist id="partList"></datalist>

<div class="label-row">
<label>Part Name</label>
<button type="button" id="partnameBtn" class="manual-btn">
Manual
</button>
</div>

<input type="text" id="partname" readonly>

<div class="label-row">
<label>Model</label>
<button type="button" id="modelBtn" class="manual-btn">
Manual
</button>
</div>

<input type="text" id="model" readonly>

<div class="label-row">
<label>Supplier</label>
<button type="button" id="supplierBtn" class="manual-btn">
Manual
</button>
</div>

<input type="text" id="supplier" readonly>

<label>Qty</label>
<input type="number" id="qty">

<label>Photo</label>
<input type="file"
       id="photos"
       multiple
       accept="image/*">

<div id="photoCount">
เลือกแล้ว 0 รูป
</div>

<button class="review" onclick="reviewReport()">
🔍 Review
</button>

<button class="copy" onclick="copyReport()">
📋 Copy Report
</button>

<button class="line" onclick="sendLine()">
📤 Send LINE
</button>

<button class="save" onclick="saveData()">
💾 Save Data
</button>

<div id="report" class="report"></div>

</div>

<script>

date.value =
new Date().toISOString().split("T")[0];

let partMaster = {};
let allPartNo = [];

async function loadExcel(){

try{

const response =
await fetch("ข้อมูล Excel.xlsx");

const data =
await response.arrayBuffer();

const wb =
XLSX.read(data,{type:"array"});

const sheet =
wb.Sheets[wb.SheetNames[0]];

const rows =
XLSX.utils.sheet_to_json(sheet);

rows.forEach(row=>{

const partNo =
String(row.PartNo || "").trim();

if(partNo){

allPartNo.push(partNo);

partMaster[partNo]={
partName:row.PartName || "",
model:row.Model || "",
supplier:row.Supplier || ""
};

}

});

}catch(e){
console.log(e);
}

}

loadExcel();

let partnameManual = false;
let modelManual = false;
let supplierManual = false;

/* PART NAME */
partnameBtn.onclick = function(){

    partnameManual = !partnameManual;

    if(partnameManual){

        partname.readOnly = false;

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        partname.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);

    }

};

/* MODEL */
modelBtn.onclick = function(){

    modelManual = !modelManual;

    if(modelManual){

        model.readOnly = false;

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        model.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);

    }

};

/* SUPPLIER */
supplierBtn.onclick = function(){

    supplierManual = !supplierManual;

    if(supplierManual){

        supplier.readOnly = false;

        this.innerText = "Auto";
        this.style.background = "#06C755";
        this.style.color = "#fff";

    }else{

        supplier.readOnly = true;

        this.innerText = "Manual";
        this.style.background = "#d9d9d9";
        this.style.color = "#000";

        fillPartData(partno.value);

    }

};
partno.addEventListener("input",function(){

const keyword =
this.value.trim();

if(partMaster[keyword]){

fillPartData(keyword);

return;

}

if(keyword.length<3){

partList.innerHTML="";
return;

}

const result =
allPartNo
.filter(x=>x.includes(keyword))
.slice(0,10);

partList.innerHTML =
result
.map(x=>`<option value="${x}"></option>`)
.join("");

});

function fillPartData(partNo){

    if(!partMaster[partNo]) return;

    if(!partnameManual){
        partname.value =
        partMaster[partNo].partName || "";
    }

    if(!modelManual){
        model.value =
        partMaster[partNo].model || "";
    }

    if(!supplierManual){
        supplier.value =
        partMaster[partNo].supplier || "";
    }

}

photos.addEventListener("change",()=>{

photoCount.innerText =
`เลือกแล้ว ${photos.files.length} รูป`;

});

function reviewReport(){

let text =
"🚨 PART BORROWING FROM PL 🚨\n\n";

if(date.value)
text += `Date : ${date.value}\n`;

if(detail.value)
text += `Detail : ${detail.value}\n`;

if(location.value)
text += `Location : ${location.value}\n`;

text += "\n";

if(partno.value)
text += `Part No. : ${partno.value}\n`;

if(partname.value)
text += `Part Name : ${partname.value}\n`;

if(model.value)
text += `Model : ${model.value}\n`;

if(supplier.value)
text += `Supplier : ${supplier.value}\n`;

if(qty.value)
text += `Qty : ${qty.value} Pcs.\n`;

text += "\n━━━━━━━━━━━━━━\n";

text +=
`Photo : ${photos.files.length} Attached`;

report.style.display="block";
report.innerText=text;

}

function copyReport(){

if(!report.innerText){

reviewReport();

}

navigator.clipboard.writeText(
report.innerText
);

alert("Copy สำเร็จ");

}

function sendLine(){

    if(!report.innerText){
        reviewReport();
    }

    location.href =
    "https://line.me/R/share?text=" +
    encodeURIComponent(report.innerText);

}

function saveData(){

const data={

date:date.value,
detail:detail.value,
location:location.value,
partNo:partno.value,
partName:partname.value,
model:model.value,
supplier:supplier.value,
qty:qty.value

};

localStorage.setItem(
"borrowPLData",
JSON.stringify(data)
);

alert("บันทึกสำเร็จ");

}

window.onload=()=>{

const saved=
localStorage.getItem("borrowPLData");

if(!saved) return;

const data=
JSON.parse(saved);

date.value=data.date || "";
detail.value=data.detail || "";
location.value=data.location || "";
partno.value=data.partNo || "";
partname.value=data.partName || "";
model.value=data.model || "";
supplier.value=data.supplier || "";
qty.value=data.qty || "";

if(partno.value){
    fillPartData(partno.value);
}

};

</script>

</body>
</html>
