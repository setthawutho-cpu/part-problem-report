<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#dfeaf3">

<link rel="stylesheet" href="bottom-nav.css">

<title>GD&T Calculator</title>

<style>

#guideArea{
    margin-bottom:15px;
}

.guide-card{
    background:#fffde7;
    border:1px solid #ffd54f;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
}

.guide-img{
    width:100%;
    border-radius:8px;
    border:1px solid #ddd;
}

.guide-title{
    margin-top:8px;
    font-size:16px;
    font-weight:700;
}

.guide-text{
    margin-top:5px;
    font-size:14px;
    line-height:1.5;
}

.bottom-nav button,
.bottom-nav button span{
    font-weight:400 !important;
}

#historyArea button{
    width:100%;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input,
select{
    width:100%;
    height:45px;
    margin-bottom:10px;
    font-size:16px;
}

.calc-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:8px;
    background:#2196f3;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

#result{
    margin-top:10px;
    padding:12px;
    background:#f5f5f5;
    border-radius:8px;
}

html,
body{
    width:100%;
    margin:0;
    overflow-x:hidden;
    touch-action:manipulation;
    overscroll-behavior:none;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
    scrollbar-width:none;
}

::-webkit-scrollbar{
    display:none;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

.top-nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:50px;
    background:#dfeaf3;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;
}

.top-nav .back{
    position:absolute;
    left:12px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.lang-btn{
    position:absolute;
    right:10px;
    width:45px;
    height:35px;
    border:none;
    border-radius:5px;
    background:#607d8b;
    color:#fff;
}

.container{
    max-width:500px;
    margin:auto;
    padding:10px;
    padding-top:60px;
    padding-bottom:90px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:15px;
}

</style>

</head>

<body>

<div class="top-nav">

    <span class="back"
        onclick="history.back()">
        ❮ กลับ
    </span>

    <span id="pageTitle">
        📐 GD&T Calculator
    </span>

    <button id="langBtn"
        class="lang-btn">
        EN
    </button>

</div>

<div class="container">

<div class="card">

<label>
Calculator Type
</label>

<select id="calcType">

<option value="tp">
📍 True Position
</option>

<option value="circularity">
⭕ Circularity
</option>

<option value="concentricity">
🔄 Concentricity
</option>

<option value="parallelism">
📐 Parallelism
</option>

<option value="perpendicularity">
📏 Perpendicularity
</option>

<option value="runout">
🛞 Runout
</option>

<option value="flatness">
🔵 Flatness
</option>

<option value="positionpass">
🎯 Position PASS / NG
</option>

</select>

<div id="guideArea"></div>

<div id="formArea"></div>

<button class="calc-btn" onclick="calculateGDT()">
🧮 Calculate
</button>

<div id="result"></div>

<button
class="calc-btn"
onclick="clearHistory()"
style="
margin-top:10px;
background:#e53935;
">
🗑️ Clear History
</button>

<h3 id="historyTitle">
📋 History
</h3>

<div id="historyArea"></div>

</div>
</div>

<script>

const langs=["EN","TH","JP"];
let lang=0;

langBtn.onclick=function(){

    lang++;

    if(lang>=langs.length){
        lang=0;
    }

    langBtn.innerText=langs[lang];

    applyLanguage();

};

function applyLanguage(){

    if(lang===0){

        pageTitle.innerText="📐 GD&T Calculator";
        historyTitle.innerText="📋 History";

    }

    if(lang===1){

        pageTitle.innerText="📐 เครื่องคำนวณ GD&T";
        historyTitle.innerText="📋 ประวัติ";

    }

    if(lang===2){

        pageTitle.innerText="📐 GD&T 計算機";
        historyTitle.innerText="📋 履歴";

    }

}

const calcType=document.getElementById("calcType");
const formArea=document.getElementById("formArea");

calcType.addEventListener("change",showForm);

showForm();

function showForm(){

    const type=calcType.value;

    const guideArea =
    document.getElementById("guideArea");

if(type==="tp"){

guideArea.innerHTML=`

<div class="guide-card">

<img
class="guide-img"
src="images/true-position.png">

<div class="guide-title">
📍 True Position
</div>

<div class="guide-text">
วัดตำแหน่ง Actual X และ Actual Y
เทียบกับ Basic Dimension
แล้วคำนวณค่า Position
</div>

</div>

`;

        formArea.innerHTML=`
        <input id="a" type="number" step="0.001" placeholder="True X">
        <input id="b" type="number" step="0.001" placeholder="True Y">
        <input id="c" type="number" step="0.001" placeholder="Actual X">
        <input id="d" type="number" step="0.001" placeholder="Actual Y">
        `;

    }

    else if(type==="positionpass"){

        formArea.innerHTML=`
        <input id="a" type="number" step="0.001" placeholder="True X">
        <input id="b" type="number" step="0.001" placeholder="True Y">
        <input id="c" type="number" step="0.001" placeholder="Actual X">
        <input id="d" type="number" step="0.001" placeholder="Actual Y">
        <input id="e" type="number" step="0.001" placeholder="Tolerance">
        `;

    }

    else if(type==="concentricity"){

        formArea.innerHTML=`
        <input id="a" type="number" step="0.001" placeholder="Center X1">
        <input id="b" type="number" step="0.001" placeholder="Center Y1">
        <input id="c" type="number" step="0.001" placeholder="Center X2">
        <input id="d" type="number" step="0.001" placeholder="Center Y2">
        `;

    }

    else{

        formArea.innerHTML=`
        <input id="a" type="number" step="0.001" placeholder="Max / High">
        <input id="b" type="number" step="0.001" placeholder="Min / Low">
        `;

    }

}

function calculateGDT(){

    let text="";

    const type=calcType.value;

    if(type==="tp"){

        const tx=Number(a.value);
        const ty=Number(b.value);
        const ax=Number(c.value);
        const ay=Number(d.value);

        const dx=ax-tx;
        const dy=ay-ty;

        const tp=2*Math.sqrt(dx*dx+dy*dy);

        text=`
ΔX = ${dx.toFixed(3)} mm.<br>
ΔY = ${dy.toFixed(3)} mm.<br><br>
🎯 True Position = ⌀${tp.toFixed(3)} mm
`;

    }

    else if(type==="positionpass"){

        const tx=Number(a.value);
        const ty=Number(b.value);
        const ax=Number(c.value);
        const ay=Number(d.value);
        const tol=Number(e.value);

        const dx=ax-tx;
        const dy=ay-ty;

        const tp=2*Math.sqrt(dx*dx+dy*dy);

        text=`
ΔX = ${dx.toFixed(3)} mm.<br>
ΔY = ${dy.toFixed(3)} mm.<br><br>

🎯 True Position = ⌀${tp.toFixed(3)} mm<br>

Tolerance = ⌀${tol.toFixed(3)} mm<br><br>

${tp<=tol?"✅ PASS":"❌ NG"}
`;

    }

    else if(type==="circularity"){

        text=`⭕ Circularity = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

    }

    else if(type==="parallelism"){

        text=`📐 Parallelism = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

    }

    else if(type==="runout"){

        text=`🛞 Runout = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

    }

    else if(type==="flatness"){

        text=`🔵 Flatness = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

    }

    else if(type==="perpendicularity"){

        text=`📏 Perpendicularity Error = ${Math.abs(Number(a.value)-Number(b.value)).toFixed(3)}°`;

    }

    else if(type==="concentricity"){

        const x1=Number(a.value);
        const y1=Number(b.value);
        const x2=Number(c.value);
        const y2=Number(d.value);

        const res=
        Math.sqrt(
            Math.pow(x2-x1,2)+
            Math.pow(y2-y1,2)
        );

        text=`🔄 Concentricity = ${res.toFixed(3)} mm`;

    }

    result.innerHTML=text;

    saveHistory(text);

}

function saveHistory(text){

    let history=
    JSON.parse(localStorage.getItem("gdtHistory")||"[]");

    history.unshift({
        date:new Date().toLocaleString(),
        result:text
    });

    history=history.slice(0,100);

    localStorage.setItem(
        "gdtHistory",
        JSON.stringify(history)
    );

    loadHistory();

}

function loadHistory(){

    let history=
    JSON.parse(localStorage.getItem("gdtHistory")||"[]");

    historyArea.innerHTML=
    history.map((item,index)=>`

    <div style="
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    ">

    <b>${item.date}</b>

    <div style="margin-top:5px;">
    ${item.result}
    </div>

    <button
    onclick="deleteHistory(${index})"
    style="
    background:#f44336;
    margin-top:8px;
    height:40px;
    ">
    🗑️ Delete
    </button>

    </div>

    `).join("");

}

function deleteHistory(index){

    let history=
    JSON.parse(localStorage.getItem("gdtHistory")||"[]");

    history.splice(index,1);

    localStorage.setItem(
        "gdtHistory",
        JSON.stringify(history)
    );

    loadHistory();

}

function clearHistory(){

    if(!confirm("Delete all history ?")) return;

    localStorage.removeItem("gdtHistory");

    loadHistory();

}

loadHistory();

applyLanguage();

document.addEventListener(
'gesturestart',
function(e){
e.preventDefault();
});

let lastTouchEnd=0;

document.addEventListener(
'touchend',
function(e){

const now=Date.now();

if(now-lastTouchEnd<=300){
e.preventDefault();
}

lastTouchEnd=now;

},{passive:false});

</script>

<script>
window.currentPage="standard";
</script>

<script src="bottom-nav.js"></script>

</body>
</html>
