<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.top{display:flex;justify-content:space-between;padding:20px}.icon{width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:none}.display{font-size:64px;text-align:right;padding:20px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}.btn{height:70px;font-size:28px;border:none;border-radius:35px}.g{background:#555;color:#fff}.d{background:#333;color:#fff}.o{background:#f4a034;color:#fff}.panel{display:none;position:fixed;top:80px;left:10px;right:10px;background:#222;padding:15px;border-radius:16px;max-height:70vh;overflow:auto}input,select{width:100%;padding:8px;margin:4px 0}</style></head><body><div class=top><button class=icon onclick="toggleHistory()">🕘</button><button class=icon onclick="toggleMenu()">🧮</button></div><div id=display class=display>0</div><div id=history class=panel><h3>ประวัติ</h3><div id=historyList></div><button onclick="localStorage.removeItem('history');loadHistory()">ลบทั้งหมด</button></div><div id=menu class=panel><h3>เมนู</h3><button onclick="showGDT()">GD&T Calculator</button><button onclick="showConv()">Unit Converter</button><button onclick="showSci()">Scientific</button><div id=extra></div></div><div class=keys><button class='btn g' onclick='clr()'>AC</button><button class='btn g' onclick='add("%")'>%</button><button class='btn g' onclick='add(".")'>.</button><button class='btn o' onclick='add("/")'>÷</button><button class='btn d' onclick='add("7")'>7</button><button class='btn d' onclick='add("8")'>8</button><button class='btn d' onclick='add("9")'>9</button><button class='btn o' onclick='add("*")'>×</button><button class='btn d' onclick='add("4")'>4</button><button class='btn d' onclick='add("5")'>5</button><button class='btn d' onclick='add("6")'>6</button><button class='btn o' onclick='add("-")'>−</button><button class='btn d' onclick='add("1")'>1</button><button class='btn d' onclick='add("2")'>2</button><button class='btn d' onclick='add("3")'>3</button><button class='btn o' onclick='add("+")'>+</button><button class='btn d' onclick='neg()'>±</button><button class='btn d' onclick='add("0")'>0</button><button class='btn d' onclick='back()'>⌫</button><button class='btn o' onclick='calc()'>=</button></div><script>let exp='';function update(){display.innerText=exp||'0'}function add(v){exp+=v;update()}function clr(){exp='';update()}function back(){exp=exp.slice(0,-1);update()}function neg(){if(exp)exp='(-'+exp+')';update()}function calc(){try{let r=eval(exp);let h=JSON.parse(localStorage.getItem('history')||'[]');h.unshift(exp+' = '+r);localStorage.setItem('history',JSON.stringify(h));exp=''+r;update();loadHistory()}catch(e){alert('Error')}}function toggleHistory(){history.style.display=history.style.display=='block'?'none':'block';loadHistory()}function toggleMenu(){menu.style.display=menu.style.display=='block'?'none':'block'}function loadHistory(){let h=JSON.parse(localStorage.getItem('history')||'[]');historyList.innerHTML=h.map(x=>'<div onclick="exp=''+x.split(' = ')[1]+'';update()">'+x+'</div><hr>').join('')}function showSci(){extra.innerHTML='<h4>Scientific</h4><button onclick="exp+=Math.PI;update()">π</button><button onclick="exp=Math.sqrt(eval(exp));update()">√</button><button onclick="exp=Math.sin(eval(exp)*Math.PI/180);update()">sin</button><button onclick="exp=Math.cos(eval(exp)*Math.PI/180);update()">cos</button><button onclick="exp=Math.tan(eval(exp)*Math.PI/180);update()">tan</button>'}function showGDT(){extra.innerHTML='<h4>GD&T</h4>⌖ Position=2√(ΔX²+ΔY²)<br>○ Circularity=max-min<br>▱ Flatness=max-min<br>// Parallelism=max-min<br>⊥ Perpendicularity=max-min<br>◎ Concentricity=|C1-C2|<br>↗ Circular Runout=max-min<br>↗↗ Total Runout=max-min'}function showConv(){extra.innerHTML='<h4>Converter</h4><input id=v type=number placeholder=value><select id=t><option>mm-cm</option><option>cm-mm</option><option>m-cm</option><option>kg-g</option><option>g-kg</option><option>C-F</option><option>F-C</option></select><button onclick="conv()">แปลง</button><div id=res></div>'}function conv(){let n=+v.value,r='';switch(t.value){case 'mm-cm':r=n/10;break;case 'cm-mm':r=n*10;break;case 'm-cm':r=n*100;break;case 'kg-g':r=n*1000;break;case 'g-kg':r=n/1000;break;case 'C-F':r=n*9/5+32;break;case 'F-C':r=(n-32)*5/9;break;}res.innerText=r}</script></body></html>
