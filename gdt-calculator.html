<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>GD&T Calculator</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="bottom-nav.css">

<meta name="theme-color" content="#dfeaf3">

<style>

html,body{
margin:0;
padding:0;
font-family:Segoe UI,sans-serif;
background:#dfeaf3;
}

.top-nav{
position:fixed;
top:0;
left:0;
width:100%;
height:50px;
background:#dfeaf3;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.back{
position:absolute;
left:12px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:600px;
margin:auto;
padding:60px 10px 90px;
}

.card{
background:#fff;
border-radius:10px;
padding:15px;
}

select,input{
width:100%;
height:45px;
margin-bottom:10px;
box-sizing:border-box;
}

.calc-btn{
width:100%;
height:50px;
border:none;
border-radius:8px;
background:#2196f3;
color:#fff;
font-size:16px;
font-weight:bold;
}

.guide-card{
background:#fffde7;
border:1px solid #ffd54f;
border-radius:10px;
padding:10px;
margin-bottom:10px;
}

.guide-img{
    width:100%;
    max-height:200px;
    object-fit:contain;
    background:#fff;
    border-radius:8px;
}

.guide-title{
font-weight:bold;
margin-top:8px;
}

.guide-text{
margin-top:5px;
line-height:1.5;
}

#result{
margin-top:10px;
padding:10px;
background:#f5f5f5;
border-radius:8px;
}

.history-item{
background:#fff;
border:1px solid #ccc;
border-radius:8px;
padding:10px;
margin-top:8px;
}

</style>

</head>
<body>

<div class="top-nav">

<span class="back" onclick="history.back()">
❮ กลับ
</span>

<span id="pageTitle">
📐 GD&T Calculator
</span>

<button id="langBtn"
style="
position:absolute;
right:10px;
width:50px;
height:35px;
border:none;
border-radius:5px;
background:#607d8b;
color:#fff;
">
EN
</button>

</div>

<div class="container">

<div class="card">

<select id="calcType">

<option value="tp">📍 True Position</option>

<option value="positionpass">🎯 Position PASS / NG</option>

<option value="circularity">⭕ Circularity</option>

<option value="concentricity">🔄 Concentricity</option>

<option value="parallelism">📐 Parallelism</option>

<option value="perpendicularity">📏 Perpendicularity</option>

<option value="runout">🛞 Runout</option>

<option value="flatness">🔵 Flatness</option>

</select>

<div id="guideArea"></div>

<div id="formArea"></div>

<button
id="calcBtn"
class="calc-btn"
onclick="calculateGDT()">
🧮 Calculate
</button>

<div id="result"></div>

<button
id="clearBtn"
class="calc-btn"
style="margin-top:10px;background:#e53935"
onclick="clearHistory()">
🗑️ Clear History
</button>

<h3 id="historyTitle">
📋 History
</h3>

<div id="historyArea"></div>

</div>

</div>

<script>

const calcType=document.getElementById("calcType");
const formArea=document.getElementById("formArea");
const guideArea=document.getElementById("guideArea");

const langs=["EN","TH","JP"];
let lang=0;

const textLang={

EN:{
title:"📐 GD&T Calculator",
history:"📋 History",
tp:"True Position",
concentricity:"Concentricity",
parallelism:"Parallelism",
perpendicularity:"Perpendicularity",
runout:"Runout",
flatness:"Flatness",
circularity:"Circularity"
},

TH:{
title:"📐 เครื่องคำนวณ GD&T",
history:"📋 ประวัติ",
tp:"ตำแหน่งจริง",
concentricity:"ร่วมศูนย์",
parallelism:"ความขนาน",
perpendicularity:"ความตั้งฉาก",
runout:"รันเอาท์",
flatness:"ความเรียบ",
circularity:"ความกลม"
},

JP:{
title:"📐 GD&T 計算機",
history:"📋 履歴",
tp:"真位置",
concentricity:"同心度",
parallelism:"平行度",
perpendicularity:"直角度",
runout:"振れ",
flatness:"平面度",
circularity:"真円度"
}

};

langBtn.onclick=function(){

lang++;

if(lang>=langs.length){
lang=0;
}

langBtn.innerText=langs[lang];

applyLanguage();
showForm();

};

function applyLanguage(){

const t=textLang[langs[lang]];

pageTitle.innerText=t.title;

backBtn.innerText=t.back;

calcBtn.innerText=t.calculate;

clearBtn.innerText=t.clear;

historyTitle.innerText=t.history;

calcType.options[0].text=
"📍 "+t.tp;

calcType.options[1].text=
"🎯 "+(
langs[lang]==="TH"
? "Position ผ่าน/ไม่ผ่าน"
: langs[lang]==="JP"
? "位置 OK/NG"
: "Position PASS / NG"
);

calcType.options[2].text=
"⭕ "+t.circularity;

calcType.options[3].text=
"🔄 "+t.concentricity;

calcType.options[4].text=
"📐 "+t.parallelism;

calcType.options[5].text=
"📏 "+t.perpendicularity;

calcType.options[6].text=
"🛞 "+t.runout;

calcType.options[7].text=
"🔵 "+t.flatness;

}

calcType.addEventListener("change",showForm);

function showForm(){

const type=calcType.value;

if(type==="tp" || type==="positionpass"){

guideArea.innerHTML=`
<div class="guide-card">
<img class="guide-img" src="images/true-position.png">
<div class="guide-title">
📍 ${textLang[langs[lang]].tp}
</div>
<div class="guide-text">
TP = 2 × √(ΔX² + ΔY²)
</div>
</div>
`;

formArea.innerHTML=`
<input id="a" type="number" step="0.001" placeholder="True X">
<input id="b" type="number" step="0.001" placeholder="True Y">
<input id="c" type="number" step="0.001" placeholder="Actual X">
<input id="d" type="number" step="0.001" placeholder="Actual Y">
${type==="positionpass"
?'<input id="e" type="number" step="0.001" placeholder="Tolerance">'
:''}
`;

}

else if(type==="concentricity"){

guideArea.innerHTML=`
<div class="guide-card">
<img class="guide-img" src="images/concentricity.png">
<div class="guide-title">
🔄 ${textLang[langs[lang]].concentricity}
</div>
</div>
`;

formArea.innerHTML=`
<input id="a" type="number" placeholder="Center X1">
<input id="b" type="number" placeholder="Center Y1">
<input id="c" type="number" placeholder="Center X2">
<input id="d" type="number" placeholder="Center Y2">
`;

}

else{

guideArea.innerHTML=`
<div class="guide-card">
<img class="guide-img" src="images/${type}.png">
<div class="guide-title">
${textLang[langs[lang]][type] || type}
</div>
<div class="guide-text">
Result = Max - Min
</div>
</div>
`;

formArea.innerHTML=`
<input id="a" type="number" placeholder="Max / High">
<input id="b" type="number" placeholder="Min / Low">
`;

}

}

function calculateGDT(){

const type=calcType.value;

let text="";

if(type==="tp"){

const dx=Number(c.value)-Number(a.value);
const dy=Number(d.value)-Number(b.value);

const tp=2*Math.sqrt(dx*dx+dy*dy);

text=`🎯 True Position = ⌀${tp.toFixed(3)} mm`;

}

else if(type==="positionpass"){

const dx=Number(c.value)-Number(a.value);
const dy=Number(d.value)-Number(b.value);

const tp=2*Math.sqrt(dx*dx+dy*dy);

text=`
🎯 True Position = ⌀${tp.toFixed(3)} mm<br>
Tolerance = ⌀${Number(e.value).toFixed(3)} mm<br><br>
${tp<=Number(e.value)?"✅ PASS":"❌ NG"}
`;

}

else if(type==="concentricity"){

const res=Math.sqrt(
Math.pow(Number(c.value)-Number(a.value),2)+
Math.pow(Number(d.value)-Number(b.value),2)
);

text=`🔄 Concentricity = ${res.toFixed(3)} mm`;

}

else if(type==="parallelism"){

text=`📐 Parallelism = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

}

else if(type==="perpendicularity"){

text=`📏 Perpendicularity Error = ${Math.abs(Number(a.value)-Number(b.value)).toFixed(3)}°`;

}

else if(type==="runout"){

text=`🛞 Runout = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

}

else if(type==="flatness"){

text=`🔵 Flatness = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

}

else if(type==="circularity"){

text=`⭕ Circularity = ${(Number(a.value)-Number(b.value)).toFixed(3)} mm`;

}

result.innerHTML=text;

saveHistory(text);

}

function saveHistory(text){

let history=JSON.parse(
localStorage.getItem("gdtHistory")||"[]"
);

history.unshift({
date:new Date().toLocaleString(),
result:text
});

history=history.slice(0,100);

localStorage.setItem(
"gdtHistory",
JSON.stringify(history)
);

loadHistory();

}

function loadHistory(){

const history=JSON.parse(
localStorage.getItem("gdtHistory")||"[]"
);

historyArea.innerHTML=history.map(item=>`

<div class="history-item">

<b>${item.date}</b>

<div style="margin-top:5px">
${item.result}
</div>

</div>

`).join("");

}

function clearHistory(){

localStorage.removeItem("gdtHistory");

loadHistory();

}

showForm();
loadHistory();
applyLanguage();

</script>

<script>
window.currentPage="standard";
</script>

<script src="bottom-nav.js"></script>

</body>
</html>
