<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PART PROBLEM INFORM MODERN</title><style>:root{--primary:#2563eb;--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0}*{box-sizing:border-box;font-family:Inter,Prompt,sans-serif}body{margin:0;background:var(--bg)}.header{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;padding:18px;border-radius:0 0 24px 24px}.container{max-width:960px;margin:auto;padding:12px 16px 100px}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.part-grid,.inspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;margin-bottom:6px;color:#64748b;font-size:13px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:14px}.partno-wrap{display:flex;gap:8px}.qr{width:48px;border:none;background:#eff6ff;border-radius:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;padding:12px;border-radius:16px;text-align:center}.review{position:fixed;left:16px;right:16px;bottom:16px;height:54px;border:none;border-radius:18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:700}@media(max-width:768px){.part-grid,.inspect-grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="header"><h2>PART PROBLEM INFORM</h2><div>Supplier Quality Report</div></div><div class="container"><div class="card"><h3>📦 Part Information</h3><div class="field"><label>Part No.</label><div class="partno-wrap"><input placeholder="Part No."><button class="qr">📷</button></div></div><div class="part-grid"><div class="field"><label>Part Name</label><input></div><div class="field"><label>Model</label><input></div><div class="field"><label>Supplier</label><input></div><div class="field"><label>Product</label><input></div></div></div><div class="card"><h3>⚠ Problem Detail</h3><div class="field"><label>Problem</label><textarea></textarea></div><div class="field"><label>Detail</label><textarea></textarea></div></div><div class="card"><h3>📊 Inspection Result</h3><div class="stats"><div class="stat"><div>Check</div><strong>0</strong></div><div class="stat"><div>OK</div><strong>0</strong></div><div class="stat"><div>NG</div><strong>0</strong></div></div><br><div class="inspect-grid"><div class="field"><label>Check Qty</label><input type="number"></div><div class="field"><label>OK Qty</label><input type="number"></div><div class="field"><label>NG Result</label><select><option>Rework</option><option>Reject</option><option>Defect</option></select></div></div></div></div><button class="review">Review Report</button></body></html>
