<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PART PROBLEM INFORM MODERN</title>
<style>
:root{--primary:#2563eb;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
html,body{background:var(--bg);overflow-x:hidden}
body{padding-bottom:90px}
.header{position:sticky;top:0;z-index:1000;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;padding:16px;border-radius:0 0 24px 24px}
.container{max-width:1000px;margin:auto;padding:12px}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;margin-bottom:6px;font-size:13px;color:#64748b;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px;font-size:14px}
textarea{min-height:90px}
.partno-wrap{display:flex;gap:8px}.qr{width:48px;border:none;border-radius:14px;background:#dbeafe}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;padding:12px;border-radius:16px;text-align:center}
.review{position:fixed;left:16px;right:16px;bottom:16px;height:56px;border:none;border-radius:18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:700}
</style></head><body>
<div class="header"><h2>PART PROBLEM INFORM</h2><div>Modern Responsive Template</div></div>
<div class="container">
<div class="card"><h3>Part Information</h3><br>
<label>Part No.</label><div class="partno-wrap"><input><button class="qr">QR</button></div><br>
<div class="grid2">
<div><label>Part Name</label><input></div>
<div><label>Model</label><input></div>
<div><label>Supplier</label><input></div>
<div><label>Product</label><input></div>
</div></div>
<div class="card"><h3>Problem Detail</h3><br>
<label>Problem</label><textarea></textarea><br>
<label>Detail</label><textarea></textarea></div>
<div class="card"><h3>Inspection Result</h3><br>
<div class="stats"><div class="stat">Check<br><b>0</b></div><div class="stat">OK<br><b>0</b></div><div class="stat">NG<br><b>0</b></div></div><br>
<div class="grid2"><div><label>Check Qty</label><input type="number"></div><div><label>OK Qty</label><input type="number"></div><div><label>NG Qty</label><input readonly></div><div><label>Part NG</label><select><option>Rework</option><option>Reject</option><option>Defect</option></select></div></div>
</div></div>
<button class="review">Review Report</button>
</body></html>
