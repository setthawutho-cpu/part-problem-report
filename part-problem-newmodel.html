<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PART PROBLEM NEW MODEL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    background:#dfeaf3;
    font-family:Segoe UI,sans-serif;

    touch-action: manipulation;
    overscroll-behavior: none;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    background:#c7d9ea;
    padding:10px;
    padding-top:50px;
    padding-bottom:90px;
    border-radius:8px;
    box-sizing:border-box;
}

.top-nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9999;
    background:#dfeaf3;
    padding:8px 12px;
    box-sizing:border-box;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

input,
select,
textarea{
    width:100%;
    padding:6px;
    box-sizing:border-box;
    font-size:16px;
}

label{
    display:block;
    margin-top:6px;
}

textarea{
    min-height:80px;
}

.manual-btn{
    width:70px !important;
    height:24px;

    margin:0 !important;
    padding:0 !important;

    background:#d9d9d9;
    color:#000;

    border:1px solid #666 !important;

    box-shadow:
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 #888,
        2px 2px 3px rgba(0,0,0,0.25);

    font-size:13px;
    font-weight:normal;
}

.manual-btn:active{
    transform:translateY(1px);

    box-shadow:
        inset -1px -1px 0 #ffffff,
        inset 1px 1px 0 #888;
}

.inspection-box{
    background:#b7c7d8;
    border:1px solid #999;
    margin-top:10px;
}

.result{
    background:#95c11f;
    padding:8px;
    font-weight:bold;
}

.inspection-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.review{
    background:#2196f3;
    color:white;
}

.copy{
    background:#9c27b0;
    color:white;
}

.line{
    background:#06C755;
    color:white;
}

.report{
    display:none;
    background:#fff;
    margin-top:10px;
    padding:10px;
    border:1px solid #ccc;
    white-space:pre-wrap;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
    z-index:99999;
}

.bottom-nav button{
    flex:1;
    margin:0;
    background:#fff;
    color:#333;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.bottom-nav button span{
    font-size:10px;
    margin-top:2px;
    line-height:1;
}

.bottom-nav button:active{
    background:#f1f1f1;
}

input,
select,
textarea{
    font-size:16px !important;
}

input,
select,
textarea,
button{
    border-radius:0 !important;
}

label{
    font-size:16px !important;
    font-weight:400;
}

.bottom-nav button{
    width:auto !important;
    padding:0 !important;
    margin:0 !important;
}

.manual-btn{
    flex:none !important;
}

input,
select,
textarea{
    background:#ffffff !important;
    background-color:#ffffff !important;
    color:#000000 !important;
    border:1px solid #999;
}

#date{
    height:32px;
    font-size:16px !important;
}

#partNg{
    height:40px;
}

.bottom-nav button{
    width:auto !important;
    padding:0 !important;
    margin:0 !important;
}

</style>
</head>
<body>

<div class="container">

<div class="top-nav">
<span onclick="location.href='menu.html'">❮ กลับ</span>
<span></span>
</div>

<div class="title" id="title">
🚨 PART PROBLEM NEW MODEL 🚨
</div>

<label id="lblDate">Date</label>
<input type="date" id="date">

<label id="lblPartNo">Part No.</label>
<input type="text" id="partno">

<div style="display:flex;justify-content:space-between;align-items:center;">
<label id="lblPartName">Part Name</label>
<button id="partnameBtn" class="manual-btn" type="button">Manual</button>
</div>
<input type="text" id="partname" readonly>

<div style="display:flex;justify-content:space-between;align-items:center;">
<label id="lblModel">Model</label>
<button id="modelBtn" class="manual-btn" type="button">Manual</button>
</div>
<input type="text" id="model" readonly>

<div style="display:flex;justify-content:space-between;align-items:center;">
<label id="lblSupplier">Supplier</label>
<button id="supplierBtn" class="manual-btn" type="button">Manual</button>
</div>
<input type="text" id="supplier" readonly>

<label id="lblProblem">Problem</label>
<textarea id="problem"></textarea>

<label id="lblDetail">Detail</label>
<textarea id="detail"></textarea>

<div class="inspection-box">

<div class="result">
📊 INSPECTION RESULT
</div>

<div class="inspection-grid">

<div>
<label id="lblCheck">Check</label>
<input type="number" id="checkQty">
</div>

<div>
<label id="lblOk">OK</label>
<input type="number" id="okQty">
</div>

<div>
<label id="lblNg">NG</label>
<input type="number" id="ngQty" readonly>
</div>

</div>

<div style="padding:10px;">
<label id="lblPartNg">Part NG</label>

<select id="partNg">
<option></option>
<option>Rework</option>
<option>Reject</option>
<option>Defect</option>
</select>
</div>

</div>

<button class="review" onclick="reviewReport()">
🔍 Review Report
</button>

<button class="copy" onclick="copyReport()">
📋 Copy Report
</button>

<button class="line" onclick="sendLine()">
📤 Send LINE
</button>

<div id="report" class="report"></div>

</div>

<div class="bottom-nav">

<button onclick="location.href='menu.html'">
🏠
<span>Home</span>
</button>

<button onclick="location.href='dashboard.html'">
📊
<span>Dashboard</span>
</button>

<button onclick="location.href='document.html'">
📝
<span>Document</span>
</button>

<button onclick="location.href='standard.html'">
📏
<span>STD</span>
</button>

<button onclick="location.href='settings.html'">
⚙️
<span>Setting</span>
</button>

</div>

<script>

date.value=new Date().toISOString().split("T")[0];

let partMaster = {};

async function loadExcel(){

    const response =
    await fetch("ข้อมูล Excel.xlsx");

    const data =
    await response.arrayBuffer();

    const workbook =
    XLSX.read(data,{type:"array"});

    const sheet =
    workbook.Sheets[workbook.SheetNames[0]];

    const rows =
    XLSX.utils.sheet_to_json(sheet);

    rows.forEach(row=>{

        const partNo =
        String(row.PartNo || "").trim();

        if(partNo){

            partMaster[partNo] = {

                partName:
                row.PartName || "",

                model:
                row.Model || "",

                supplier:
                row.Supplier || ""

            };

        }

    });

}

loadExcel();


let partnameManual=false;
let modelManual=false;
let supplierManual=false;

function toggleManual(btn,input,flag){

window[flag]=!window[flag];

if(window[flag]){

input.readOnly=false;

btn.innerText="Auto";
btn.style.background="#06C755";
btn.style.color="#fff";

}else{

input.readOnly=true;

btn.innerText="Manual";
btn.style.background="#d9d9d9";
btn.style.color="#000";

}

}

partnameBtn.onclick=()=>toggleManual(
partnameBtn,
partname,
"partnameManual"
);

modelBtn.onclick=()=>toggleManual(
modelBtn,
model,
"modelManual"
);

supplierBtn.onclick=()=>toggleManual(
supplierBtn,
supplier,
"supplierManual"
);

partno.addEventListener("input",()=>{

    fillPartData(
        partno.value.trim()
    );

});

function fillPartData(partNo){

    if(!partMaster[partNo]) return;

    if(!partnameManual){
        partname.value =
        partMaster[partNo].partName || "";
    }

    if(!modelManual){
        model.value =
        partMaster[partNo].model || "";
    }

    if(!supplierManual){
        supplier.value =
        partMaster[partNo].supplier || "";
    }

}
    
function calculateNG(){

let check=
Number(checkQty.value||0);

let ok=
Number(okQty.value||0);

let ng=check-ok;

if(ng<0) ng=0;

ngQty.value=
ng===0 ? "" : ng;

}

document
.querySelectorAll("input,select")
.forEach(el=>{

el.addEventListener("input",calculateNG);
el.addEventListener("change",calculateNG);

});

function reviewReport(){

const unit=
(Number(checkQty.value||0)===1)
?"Pc."
:"Pcs.";

let text="แจ้งปัญหาครับ\n\n";

if(date.value)
text+=`Date: ${date.value.split("-").reverse().join("/")}\n`;

if(partname.value)
text+=`Part Name : ${partname.value}\n`;

if(partno.value)
text+=`Part No : ${partno.value}\n`;

if(model.value)
text+=`Model : ${model.value}\n`;

if(supplier.value)
text+=`Supplier : ${supplier.value}\n`;

text+="\n";

text+=`ปัญหา : ${problem.value || "-"}\n`;

text+=`รายละเอียด : ${detail.value || "-"}\n`;

text+="\n";

if(checkQty.value)
text+=`Check ${checkQty.value} ${unit}\n`;

text+=`OK ${okQty.value || 0} ${unit}\n`;

if(ngQty.value)
text+=`NG ${ngQty.value} ${unit}\n`;

if(partNg.value)
text+=`Part NG ${partNg.value}\n`;

report.innerText=text;
report.style.display="block";

}

function sendLine(){

if(!report.innerText.trim()){
reviewReport();
}

location.href=
"https://line.me/R/share?text="+
encodeURIComponent(report.innerText);

}

function copyReport(){

    if(!report.innerText.trim()){
        reviewReport();
    }

    navigator.clipboard.writeText(
        report.innerText
    );

    alert("📋 Copy Report สำเร็จ");
}

function changeLanguage(){

    const lang =
    Number(localStorage.getItem("language")) || 0;

    const text = {

        EN:{
            title:"🚨 PART PROBLEM NEW MODEL 🚨",
            date:"Date",
            partno:"Part No.",
            partname:"Part Name",
            model:"Model",
            supplier:"Supplier",
            problem:"Problem",
            detail:"Detail",
            check:"Check",
            ok:"OK",
            ng:"NG",
            partng:"Part NG"
        },

        TH:{
            title:"🚨 แจ้งปัญหา NEW MODEL 🚨",
            date:"วันที่",
            partno:"Part No.",
            partname:"Part Name",
            model:"Model",
            supplier:"Supplier",
            problem:"ปัญหา",
            detail:"รายละเอียด",
            check:"ตรวจสอบ",
            ok:"OK",
            ng:"NG",
            partng:"Part NG"
        },

        JP:{
            title:"🚨 新機種不具合 🚨",
            date:"日付",
            partno:"Part No.",
            partname:"部品名",
            model:"モデル",
            supplier:"サプライヤー",
            problem:"不具合",
            detail:"詳細",
            check:"確認",
            ok:"OK",
            ng:"NG",
            partng:"Part NG"
        }
    };

    const t =
    lang === 1 ? text.TH :
    lang === 2 ? text.JP :
    text.EN;

    title.innerText = t.title;
    lblDate.innerText = t.date;
    lblPartNo.innerText = t.partno;
    lblPartName.innerText = t.partname;
    lblModel.innerText = t.model;
    lblSupplier.innerText = t.supplier;
    lblProblem.innerText = t.problem;
    lblDetail.innerText = t.detail;
    lblCheck.innerText = t.check;
    lblOk.innerText = t.ok;
    lblNg.innerText = t.ng;
    lblPartNg.innerText = t.partng;
}

changeLanguage();

</script>

<script>
document.addEventListener("gesturestart", function(e){
    e.preventDefault();
});

document.addEventListener("dblclick", function(e){
    e.preventDefault();
}, { passive:false });

document.addEventListener("touchmove", function(e){
    if(e.scale !== undefined && e.scale !== 1){
        e.preventDefault();
    }
}, { passive:false });
</script>

</body>
</html>
