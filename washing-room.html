<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Inspection Part</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    padding-bottom:80px;
}

/* HEADER */

.header{
    background:#009688;
    color:#fff;
    padding:12px 15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:999;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    object-fit:contain;
}

#appTitle{
    font-size:20px;
    font-weight:bold;
}

.lang-btn{
    border:none;
    background:#fff;
    color:#009688;
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* MENU */

.menu-grid{

    padding:15px;

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;
}

.menu-card{

    background:#fff;
    border:none;
    border-radius:15px;

    min-height:140px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:10px;

    cursor:pointer;

    box-shadow:0 2px 10px rgba(0,0,0,.08);

    transition:.2s;
}

.menu-card:hover{
    transform:translateY(-3px);
}

.icon{
    font-size:42px;
}

.menu-card span{
    text-align:center;
    font-size:14px;
    padding:0 8px;
}

/* BOTTOM NAV */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;

    background:#fff;

    display:flex;

    height:70px;

    border-top:1px solid #ddd;
}

.bottom-nav button{

    flex:1;

    border:none;
    background:none;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:4px;

    cursor:pointer;

    font-size:12px;
}

.bottom-nav button:hover{
    color:#009688;
}

.nav-icon{
    font-size:20px;
}

/* MOBILE */

@media(max-width:768px){

    .menu-grid{
        grid-template-columns:repeat(2,1fr);
    }

    #appTitle{
        font-size:16px;
    }

}

</style>
</head>

<body>

<div class="header">

    <div class="logo-area">

        <img src="icon-192.png" class="logo">

        <span id="appTitle">
            INSPECTION PART
        </span>

    </div>

    <button class="lang-btn"
        onclick="changeLanguage()">
        🌐 TH | EN
    </button>

</div>

<div class="menu-grid">

    <button class="menu-card"
        onclick="location.href='part-problem-report.html'">

        <div class="icon">📋</div>

        <span id="reportText">
            PART PROBLEM REPORT
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='part-problem-newmodel.html'">

        <div class="icon">📦</div>

        <span id="newModelText">
            PART PROBLEM NEW MODEL
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='part-borrowing-pl.html'">

        <div class="icon">📨</div>

        <span id="borrowText">
            PART BORROWING FROM PL
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='assembly-trial.html'">

        <div class="icon">🧪</div>

        <span id="trialText">
            ASSEMBLY TRIAL
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='washing-room.html'">

        <div class="icon">🧼</div>

        <span id="washText">
            WASHING ROOM
        </span>

    </button>

</div>

<div class="bottom-nav">

    <button
        onclick="location.href='menu.html'">
        <div class="nav-icon">🏠</div>
        <span>Home</span>
    </button>

    <button
        onclick="location.href='part-problem-report.html'">
        <div class="nav-icon">📋</div>
        <span>Report</span>
    </button>

    <button
        onclick="location.href='part-problem-newmodel.html'">
        <div class="nav-icon">📦</div>
        <span>New Model</span>
    </button>

    <button
        onclick="location.href='part-borrowing-pl.html'">
        <div class="nav-icon">📨</div>
        <span>Borrow</span>
    </button>

    <button
        onclick="location.href='settings.html'">
        <div class="nav-icon">⚙️</div>
        <span>Setting</span>
    </button>

</div>

<script>

let currentLang="en";

function changeLanguage(){

    currentLang=
    currentLang==="en"?"th":"en";

    if(currentLang==="th"){

        appTitle.innerText="ระบบ Inspection Part";

        reportText.innerText="แจ้งปัญหา";
        newModelText.innerText="ปัญหา New Model";
        borrowText.innerText="ยืมชิ้นส่วนจาก PL";
        trialText.innerText="ประกอบทดลอง";
        washText.innerText="ห้องล้าง";

    }else{

        appTitle.innerText="INSPECTION PART";

        reportText.innerText="PART PROBLEM REPORT";
        newModelText.innerText="PART PROBLEM NEW MODEL";
        borrowText.innerText="PART BORROWING FROM PL";
        trialText.innerText="ASSEMBLY TRIAL";
        washText.innerText="WASHING ROOM";

    }

}

</script>

</body>
</html>
