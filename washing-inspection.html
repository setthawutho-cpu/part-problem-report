<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#dfeaf3">

<title>🔬 INSPECTION</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>

html,
body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family:Segoe UI,sans-serif;
    background:#dfeaf3;
}

*{
    box-sizing:border-box;
}

.top-nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
   background:#dfeaf3;
    color:#fff;
    padding:12px;
    z-index:9999;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.top-nav span{
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:500px;
    margin:auto;
    padding:10px;
    padding-top:60px;
    padding-bottom:90px;
}

.header{
    background:#dfeaf3;
    color:#000;
    text-align:center;
    padding:15px;
    border-radius:8px;
    font-size:22px;
    font-weight:bold;
}

.card{
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

label{
    display:block;
    margin-bottom:4px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    height:40px;
    font-size:16px;
    margin-bottom:10px;
}

textarea{
    height:100px;
    resize:none;
}

.review{
    width:100%;
    border:none;
    padding:12px;
    background:#2196f3;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.copy{
    width:100%;
    border:none;
    padding:12px;
    background:#9c27b0;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.line{
    width:100%;
    border:none;
    padding:12px;
    background:#06C755;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.report{
    margin-top:10px;
    background:#fff;
    border:1px solid #ccc;
    padding:10px;
    white-space:pre-wrap;
    display:none;
}

</style>
</head>

<body>

<div class="top-nav">

    <span onclick="history.back()">
        ❮ กลับ
    </span>

    <span>
        🔬 Inspection
    </span>

</div>

<div class="container">

<div class="header">
🔬 INSPECTION
</div>

<div class="card">

<label>Inspection No.</label>
<input type="text" id="inspectionNo">

<label>Date</label>
<input type="date" id="date">

<label>Part No.</label>
<input type="text" id="partNo">

<label>Part Name</label>
<input type="text" id="partName">

<label>Result</label>
<select id="result">
    <option></option>
    <option>OK</option>
    <option>NG</option>
</select>

<label>Remark</label>
<textarea id="remark"></textarea>

<button class="review" onclick="reviewData()">
🔍 Review
</button>

<button class="copy" onclick="copyReport()">
📋 Copy
</button>

<button class="line" onclick="sendLine()">
📤 Send LINE
</button>

<div id="report" class="report"></div>

</div>

</div>

<script>

date.value =
new Date().toISOString().split("T")[0];

function reviewData(){

let text =
`🔬 INSPECTION REPORT

Date : ${date.value}
Inspection No. : ${inspectionNo.value}
Part No. : ${partNo.value}
Part Name : ${partName.value}
Result : ${result.value}

Remark
${remark.value}`;

report.style.display="block";
report.innerText=text;

}

function copyReport(){

navigator.clipboard.writeText(
report.innerText
);

alert("📋 Copy สำเร็จ");

}

function sendLine(){

if(!report.innerText.trim()){
alert("กรุณากด Review ก่อน");
return;
}

location.href =
"https://line.me/R/share?text=" +
encodeURIComponent(
report.innerText
);

}

</script>

<script>
window.currentPage="washing";
</script>

<script src="bottom-nav.js"></script>

</body>
</html>
