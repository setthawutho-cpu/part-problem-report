<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HB Calculator">
  <title>HB Calculator</title>
  <style>
    :root {
      --bg-outer: #05080f;
      --bg-app: #0d1320;
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-card-active: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg-outer);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 440px;
      height: min(860px, 100dvh);
      display: flex;
      flex-direction: column;
      padding: calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
      gap: 14px;
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.14), transparent 42%),
        var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      position: relative;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-weight: 700;
    }

    .topActions {
      display: flex;
      gap: 8px;
    }

    .iconBtn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .iconBtn:active {
      transform: scale(0.92);
      background: var(--bg-card-active);
    }

    .display {
      min-height: 175px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
      overflow: hidden;
    }

    #subDisplay {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      min-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #display {
      color: var(--text);
      font-size: 38px;
      font-weight: 700;
      text-align: right;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #display.error {
      color: var(--danger);
      font-size: 24px;
    }

    .hbPage {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hbPage.active {
      display: grid;
    }

    .hbField {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hbField label {
      font-size: 11px;
      color: var(--muted);
      padding-left: 4px;
      font-weight: 600;
    }

    .hbInput {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(10, 15, 28, 0.9);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      padding: 0 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .hbInput.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(245, 158, 11, 0.12);
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      flex: 1;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 25px;
      font-weight: 500;
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.92);
      background: var(--bg-card-active);
    }

    .gray {
      background: rgba(148, 163, 184, 0.16);
      color: #e2e8f0;
      font-size: 20px;
      font-weight: 600;
    }

    .orange {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border: none;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.28);
    }

    .history, .modePanel {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.97);
      backdrop-filter: blur(18px);
      z-index: 1000;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .history {
      transform: translateY(-100%);
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }

    .history.show {
      transform: translateY(0);
    }

    .historyHeader {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .historyContent {
      flex: 1;
      overflow-y: auto;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .historyItem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .delBtn {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .modePanel {
      left: auto;
      right: 0;
      width: 280px;
      transform: translateX(100%);
      padding: calc(20px + env(safe-area-inset-top)) 16px 20px;
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    .modePanel.show {
      transform: translateX(0);
    }

    .modeTitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      padding-left: 4px;
      font-weight: 600;
    }

    .modeBtn {
      width: 100%;
      margin-bottom: 8px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 15px;
      text-align: left;
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modeBtn.activeMode {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--accent);
      color: #fde68a;
      font-weight: 600;
    }

    @media (max-width: 767px) {
      #app {
        max-width: 100%;
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <span>HB Calculator</span>
        <span class="badge" id="modeBadge">CALC</span>
      </div>
      <div class="topActions">
        <button class="iconBtn" onclick="toggleHistory()" title="ประวัติ">🕒</button>
        <button class="iconBtn" onclick="toggleMode()" title="โหมด">🧮</button>
      </div>
    </div>

    <div class="display">
      <div id="subDisplay"></div>
      <div id="display">0</div>
      <div id="hbPage" class="hbPage">
        <div class="hbField">
          <label for="hbF">Force (F)</label>
          <input class="hbInput" id="hbF" placeholder="0" onclick="setInput('hbF')" readonly>
        </div>
        <div class="hbField">
          <label for="hbD">Ball Dia (D)</label>
          <input class="hbInput" id="hbD" placeholder="0" onclick="setInput('hbD')" readonly>
        </div>
        <div class="hbField">
          <label for="hbX">Indent (X)</label>
          <input class="hbInput" id="hbX" placeholder="0" onclick="setInput('hbX')" readonly>
        </div>
      </div>
    </div>

    <div class="pad" id="calculatorPad">
      <button class="btn gray" onclick="backspace()">⌫</button>
      <button class="btn gray" onclick="clearAll()">AC</button>
      <button class="btn gray" onclick="input('%')">%</button>
      <button class="btn orange" onclick="input('/')">÷</button>

      <button class="btn" onclick="input('7')">7</button>
      <button class="btn" onclick="input('8')">8</button>
      <button class="btn" onclick="input('9')">9</button>
      <button class="btn orange" onclick="input('*')">×</button>

      <button class="btn" onclick="input('4')">4</button>
      <button class="btn" onclick="input('5')">5</button>
      <button class="btn" onclick="input('6')">6</button>
      <button class="btn orange" onclick="input('-')">−</button>

      <button class="btn" onclick="input('1')">1</button>
      <button class="btn" onclick="input('2')">2</button>
      <button class="btn" onclick="input('3')">3</button>
      <button class="btn orange" onclick="input('+')">+</button>

      <button class="btn" onclick="plusminus()">±</button>
      <button class="btn" onclick="input('0')">0</button>
      <button class="btn" onclick="input('.')">.</button>
      <button class="btn orange" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="history" id="history">
    <div class="historyHeader">
      <h3>History</h3>
      <div style="display:flex; gap:8px;">
        <button class="delBtn" onclick="clearHistory()">Clear</button>
        <button class="delBtn" onclick="toggleHistory()">Close</button>
      </div>
    </div>
    <div class="historyContent" id="historyList"></div>
  </div>

  <div class="modePanel" id="modePanel">
    <div class="modeTitle">เลือกโหมดการคำนวณ</div>
    <button class="modeBtn activeMode" onclick="selectMode('CALC', this)">🔢 Standard Calc</button>
    <button class="modeBtn" onclick="selectMode('HB', this)">⚙️ HB Hardness</button>
    <button class="modeBtn" onclick="selectMode('Position', this)">⌖ Position</button>
    <button class="modeBtn" onclick="selectMode('Circularity', this)">○ Circularity</button>
    <button class="modeBtn" onclick="selectMode('Flatness', this)">▱ Flatness</button>
    <button class="modeBtn" onclick="selectMode('Parallelism', this)">∥ Parallelism</button>
    <button class="modeBtn" onclick="selectMode('Perpendicularity', this)">⊥ Perpendicularity</button>
    <button class="modeBtn" onclick="selectMode('Concentricity', this)">◎ Concentricity</button>
    <button class="modeBtn" onclick="selectMode('Circular Runout', this)">↗ Circular Runout</button>
    <button class="modeBtn" onclick="selectMode('Total Runout', this)">⇉ Total Runout</button>
  </div>

  <script>
    let expression = "";
    let activeInput = null;
    let currentMode = "CALC";

    const display = document.getElementById("display");
    const subDisplay = document.getElementById("subDisplay");
    const hbPage = document.getElementById("hbPage");
    const modeBadge = document.getElementById("modeBadge");

    document.addEventListener("click", (e) => {
      const panel = document.getElementById("modePanel");
      const btn = e.target.closest(".iconBtn");
      if (panel.classList.contains("show") && !panel.contains(e.target) && !btn) {
        panel.classList.remove("show");
      }
    });

    function setInput(id) {
      document.querySelectorAll(".hbInput").forEach(el => el.classList.remove("active"));
      activeInput = id;
      const box = document.getElementById(id);
      if (box) box.classList.add("active");
    }

    function updateDisplay(text, isError = false) {
      display.classList.toggle("error", isError);
      display.textContent = text;
    }

    function update() {
      updateDisplay(expression === "" ? "0" : expression, false);
    }

    function input(v) {
      if (activeInput) {
        const box = document.getElementById(activeInput);
        if (v === "." && box.value.includes(".")) return;
        box.value += v;
        return;
      }
      expression += v;
      update();
    }

    function clearAll() {
      subDisplay.textContent = "";
      if (activeInput) {
        document.getElementById(activeInput).value = "";
        return;
      }
      expression = "";
      update();
    }

    function backspace() {
      if (activeInput) {
        const box = document.getElementById(activeInput);
        box.value = box.value.slice(0, -1);
        return;
      }
      expression = expression.slice(0, -1);
      update();
    }

    function plusminus() {
      if (activeInput) {
        const box = document.getElementById(activeInput);
        if (!box.value) return;
        box.value = box.value.startsWith("-") ? box.value.slice(1) : "-" + box.value;
        return;
      }
      if (!expression) return;
      expression = expression.startsWith("-") ? expression.slice(1) : "-" + expression;
      update();
    }

    function toggleHistory() {
      document.getElementById("history").classList.toggle("show");
    }

    function toggleMode() {
      document.getElementById("modePanel").classList.toggle("show");
    }

    function selectMode(mode, btnEl) {
      document.getElementById("modePanel").classList.remove("show");
      document.querySelectorAll(".modeBtn").forEach(b => b.classList.remove("activeMode"));
      if (btnEl) btnEl.classList.add("activeMode");

      currentMode = mode;
      modeBadge.textContent = mode;
      subDisplay.textContent = "";

      if (mode === "HB") {
        activeInput = null;
        hbPage.classList.add("active");
        updateDisplay("HB", false);
        setInput("hbF");
      } else {
        activeInput = null;
        hbPage.classList.remove("active");
        update();
      }
    }

    function getHistory() {
      return JSON.parse(localStorage.getItem("calcHistory") || "[]");
    }

    function saveHistory(txt) {
      const data = getHistory();
      data.unshift(txt);
      localStorage.setItem("calcHistory", JSON.stringify(data.slice(0, 50)));
      renderHistory();
    }

    function renderHistory() {
      const data = getHistory();
      const list = document.getElementById("historyList");
      if (!data.length) {
        list.innerHTML = `<div style="color:var(--muted); text-align:center; padding:24px;">ยังไม่มีประวัติการคำนวณ</div>`;
        return;
      }
      list.innerHTML = data.map((item, index) => `
        <div class="historyItem">
          <span>${item}</span>
          <button class="delBtn" onclick="deleteHistory(${index})">ลบ</button>
        </div>
      `).join("");
    }

    function deleteHistory(index) {
      const data = getHistory();
      data.splice(index, 1);
      localStorage.setItem("calcHistory", JSON.stringify(data));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem("calcHistory");
      renderHistory();
    }

    function calculate() {
      if (currentMode === "HB") {
        calculateHB();
        return;
      }
      try {
        const exp = expression.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
        const result = Function(`"use strict"; return (${exp})`)();
        if (!Number.isFinite(result)) throw new Error("Math");
        const cleanResult = Number(result.toFixed(8));
        subDisplay.textContent = `${expression} =`;
        saveHistory(`${expression} = ${cleanResult}`);
        expression = String(cleanResult);
        update();
      } catch {
        updateDisplay("Error", true);
        expression = "";
      }
    }

    function calculateHB() {
      const F = parseFloat(document.getElementById("hbF").value) || 0;
      const D = parseFloat(document.getElementById("hbD").value) || 0;
      const X = parseFloat(document.getElementById("hbX").value) || 0;

      if (D <= 0 || F <= 0 || X <= 0 || X >= D) {
        subDisplay.textContent = "ตรวจสอบค่า F, D, X (ต้องมากกว่า 0 และ X < D)";
        updateDisplay("Input Error", true);
        return;
      }

      const denom = Math.PI * D * (D - Math.sqrt(D * D - X * X));
      if (denom <= 0) {
        updateDisplay("Input Error", true);
        return;
      }

      const HB = (2 * F) / denom;
      const formatted = `${HB.toFixed(1)} HB`;
      subDisplay.textContent = `F=${F} | D=${D} | X=${X}`;
      updateDisplay(formatted, false);
      saveHistory(`HB (F=${F}, D=${D}, X=${X}) = ${formatted}`);
    }

    renderHistory();
  </script>
</body>
</html>
