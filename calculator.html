<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HB & GD&T Pro">
  <title>HB &amp; GD&amp;T Calculator Pro</title>
  <style>
    :root {
      --bg-outer: #05080f;
      --bg-app: #0d1320;
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-card-active: rgba(255, 255, 255, 0.22);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --cyan: #38bdf8;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg-outer);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
      gap: clamp(6px, 1.2dvh, 10px);
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.14), transparent 42%),
        var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      position: relative;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: clamp(14px, 3.8vw, 16px);
      letter-spacing: 0.2px;
      min-width: 0;
      overflow: hidden;
    }

    .brand span:first-child {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge {
      font-size: clamp(10px, 2.8vw, 11px);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topActions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .iconBtn {
      width: clamp(34px, 9vw, 40px);
      height: clamp(34px, 9vw, 40px);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text);
      font-size: clamp(15px, 4vw, 17px);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      touch-action: manipulation;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.12s ease, border-color 0.12s ease;
    }

    .iconBtn:active, .iconBtn.pressed {
      transform: scale(0.88);
      background: rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.5);
    }

    .display {
      flex: 0 0 auto;
      min-height: clamp(92px, 18dvh, 155px);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(8px, 1.5dvh, 12px) 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(4px, 0.8dvh, 6px);
      overflow: hidden;
      min-width: 0;
    }

    .formulaRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 16px;
      min-width: 0;
    }

    #formulaTag {
      font-size: clamp(10px, 2.7vw, 11px);
      color: var(--cyan);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }

    #subDisplay {
      color: var(--muted);
      font-size: clamp(11px, 2.9vw, 12px);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
      max-width: 55%;
    }

    #display {
      color: var(--text);
      font-size: clamp(22px, 6.8vw, 34px);
      font-weight: 700;
      text-align: right;
      width: 100%;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #display.error {
      color: var(--danger);
      font-size: clamp(17px, 4.8vw, 21px);
    }

    .dynamicInputs {
      display: none;
      gap: 6px;
      width: 100%;
      min-width: 0;
    }

    .dynamicInputs.active {
      display: grid;
    }

    .cols-1 { grid-template-columns: minmax(0, 1fr); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .fieldBox {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .fieldBox label {
      font-size: clamp(10px, 2.5vw, 11px);
      color: var(--muted);
      padding-left: 2px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .calcInput, .calcSelect {
      width: 100%;
      min-width: 0;
      height: clamp(30px, 4.4dvh, 36px);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(10, 15, 28, 0.92);
      color: var(--text);
      font-size: clamp(12px, 3.4vw, 14px);
      font-weight: 600;
      padding: 0 7px;
      outline: none;
      transition: all 0.2s ease;
    }

    .calcInput.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
      background: rgba(245, 158, 11, 0.14);
    }

    .pad {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(5px, 1.1dvh, 9px);
    }

    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-bottom: 3px solid rgba(0, 0, 0, 0.45);
      border-radius: clamp(12px, 3.2vw, 16px);
      font-size: clamp(18px, 5.2vw, 23px);
      font-weight: 500;
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      touch-action: manipulation;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.07s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.1s ease, box-shadow 0.07s ease, border-color 0.1s ease;
    }

    .btn:active, .btn.pressed {
      transform: translateY(2px) scale(0.93);
      background: var(--bg-card-active);
      border-color: rgba(255, 255, 255, 0.35);
      border-bottom-width: 1px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25), inset 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .gray {
      background: rgba(148, 163, 184, 0.16);
      color: #e2e8f0;
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 600;
    }

    .gray:active, .gray.pressed {
      background: rgba(148, 163, 184, 0.34);
      border-color: rgba(226, 232, 240, 0.45);
    }

    .orange {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border: none;
      border-bottom: 3px solid #9a3412;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .orange:active, .orange.pressed {
      background: linear-gradient(135deg, #fbbf24, #f97316);
      border-bottom-width: 1px;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.65), inset 0 2px 6px rgba(124, 45, 18, 0.5);
    }

    /* Ripple effect when touched */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.38);
      transform: scale(0);
      animation: rippleAnim 0.42s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    .history, .modePanel {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.98);
      backdrop-filter: blur(18px);
      z-index: 1000;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .history {
      transform: translateY(-100%);
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .history.show {
      transform: translateY(0);
    }

    .historyHeader {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .historyContent {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .historyItem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .delBtn {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.12s ease;
    }

    .delBtn:active, .delBtn.pressed {
      transform: scale(0.9);
      background: rgba(239, 68, 68, 0.35);
    }

    .modePanel {
      left: auto;
      right: 0;
      width: min(295px, 84vw);
      transform: translateX(100%);
      padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    .modePanel.show {
      transform: translateX(0);
    }

    .modeGroupTitle {
      font-size: 11px;
      color: var(--muted);
      margin: 12px 0 6px 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .modeGroupTitle:first-child {
      margin-top: 0;
    }

    .modeBtn {
      width: 100%;
      margin-bottom: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      text-align: left;
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.12s ease;
    }

    .modeBtn:active, .modeBtn.pressed {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.15);
    }

    .modeBtn.activeMode {
      background: rgba(245, 158, 11, 0.18);
      border-color: var(--accent);
      color: #fde68a;
      font-weight: 600;
    }

    /* ล็อกเต็มจอพอดี 100% บนมือถือ (แก้ปัญหาล้นจอบน OPPO / Android) */
    @media (max-width: 767px) {
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* ปรับอัตโนมัติสำหรับหน้าจอที่มีความสูงน้อย (เช่น เปิดในแอปแชท หรือจอ Split Screen) */
    @media (max-height: 640px) {
      #app {
        padding: max(6px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
        gap: 5px;
      }
      .topbar {
        min-height: 32px;
      }
      .display {
        min-height: 82px;
        padding: 6px 10px;
        border-radius: 14px;
      }
      .calcInput, .calcSelect {
        height: 28px;
        font-size: 12px;
      }
      .pad {
        gap: 4px;
      }
      .btn {
        border-radius: 10px;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <span>HB &amp; GD&amp;T</span>
        <span class="badge" id="modeBadge">Standard Calc</span>
      </div>
      <div class="topActions">
        <button class="iconBtn" onclick="toggleHistory()" title="ประวัติ">🕒</button>
        <button class="iconBtn" onclick="toggleMode()" title="เลือกโหมด">☰</button>
      </div>
    </div>

    <div class="display">
      <div class="formulaRow">
        <span id="formulaTag">Standard Calculator</span>
        <span id="subDisplay"></span>
      </div>
      <div id="display">0</div>
      <div id="dynamicInputs" class="dynamicInputs"></div>
    </div>

    <div class="pad" id="calculatorPad">
      <button class="btn gray" onclick="backspace()">⌫</button>
      <button class="btn gray" onclick="clearAll()">AC</button>
      <button class="btn gray" onclick="input('%')">%</button>
      <button class="btn orange" onclick="input('/')">÷</button>

      <button class="btn" onclick="input('7')">7</button>
      <button class="btn" onclick="input('8')">8</button>
      <button class="btn" onclick="input('9')">9</button>
      <button class="btn orange" onclick="input('*')">×</button>

      <button class="btn" onclick="input('4')">4</button>
      <button class="btn" onclick="input('5')">5</button>
      <button class="btn" onclick="input('6')">6</button>
      <button class="btn orange" onclick="input('-')">−</button>

      <button class="btn" onclick="input('1')">1</button>
      <button class="btn" onclick="input('2')">2</button>
      <button class="btn" onclick="input('3')">3</button>
      <button class="btn orange" onclick="input('+')">+</button>

      <button class="btn" onclick="plusminus()">±</button>
      <button class="btn" onclick="input('0')">0</button>
      <button class="btn" onclick="input('.')">.</button>
      <button class="btn orange" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="history" id="history">
    <div class="historyHeader">
      <h3>ประวัติการคำนวณ</h3>
      <div style="display:flex; gap:8px;">
        <button class="delBtn" onclick="clearHistory()">ล้างทั้งหมด</button>
        <button class="delBtn" onclick="toggleHistory()">ปิด</button>
      </div>
    </div>
    <div class="historyContent" id="historyList"></div>
  </div>

  <div class="modePanel" id="modePanel">
    <div class="modeGroupTitle">เครื่องคิดเลข &amp; ความแข็ง</div>
    <button class="modeBtn activeMode" onclick="selectMode('CALC', this)">🔢 Standard Calc</button>
    <button class="modeBtn" onclick="selectMode('HB', this)">⚙️ HB Hardness</button>
    <button class="modeBtn" onclick="selectMode('CONVERT', this)">🔄 แปลงค่าความแข็ง (HB/HV/HRC/HRA/HRB)</button>

    <div class="modeGroupTitle">งานวัดละเอียด GD&amp;T</div>
    <button class="modeBtn" onclick="selectMode('Position', this)">⌖ Position</button>
    <button class="modeBtn" onclick="selectMode('Circularity', this)">○ Circularity</button>
    <button class="modeBtn" onclick="selectMode('Flatness', this)">▱ Flatness</button>
    <button class="modeBtn" onclick="selectMode('Parallelism', this)">∥ Parallelism</button>
    <button class="modeBtn" onclick="selectMode('Perpendicularity', this)">⊥ Perpendicularity</button>
    <button class="modeBtn" onclick="selectMode('Concentricity', this)">◎ Concentricity</button>
    <button class="modeBtn" onclick="selectMode('Circular Runout', this)">↗ Circular Runout</button>
    <button class="modeBtn" onclick="selectMode('Total Runout', this)">⇉ Total Runout</button>
  </div>

  <script>
    const ASTM_TABLE = [
      { hb: 653, hv: 690, hrc: 60.0, hra: 81.2, hrb: null },
      { hb: 615, hv: 649, hrc: 58.0, hra: 80.1, hrb: null },
      { hb: 577, hv: 606, hrc: 56.0, hra: 79.0, hrb: null },
      { hb: 543, hv: 570, hrc: 54.0, hra: 78.0, hrb: null },
      { hb: 512, hv: 538, hrc: 52.0, hra: 76.8, hrb: null },
      { hb: 481, hv: 505, hrc: 50.0, hra: 75.9, hrb: null },
      { hb: 455, hv: 478, hrc: 48.0, hra: 74.7, hrb: null },
      { hb: 432, hv: 454, hrc: 46.0, hra: 73.6, hrb: null },
      { hb: 409, hv: 430, hrc: 44.0, hra: 72.5, hrb: null },
      { hb: 390, hv: 410, hrc: 42.0, hra: 71.5, hrb: null },
      { hb: 371, hv: 390, hrc: 40.0, hra: 70.4, hrb: null },
      { hb: 353, hv: 371, hrc: 38.0, hra: 69.4, hrb: null },
      { hb: 336, hv: 353, hrc: 36.0, hra: 68.4, hrb: null },
      { hb: 319, hv: 335, hrc: 34.0, hra: 67.4, hrb: null },
      { hb: 301, hv: 317, hrc: 32.0, hra: 66.3, hrb: null },
      { hb: 286, hv: 301, hrc: 30.0, hra: 65.3, hrb: null },
      { hb: 271, hv: 285, hrc: 28.0, hra: 64.3, hrb: null },
      { hb: 258, hv: 271, hrc: 26.0, hra: 63.3, hrb: null },
      { hb: 247, hv: 260, hrc: 24.0, hra: 62.4, hrb: 100.0 },
      { hb: 237, hv: 248, hrc: 22.0, hra: 61.5, hrb: 99.0 },
      { hb: 226, hv: 238, hrc: 20.0, hra: 60.5, hrb: 97.8 },
      { hb: 210, hv: 220, hrc: null, hra: 59.0, hrb: 95.0 },
      { hb: 190, hv: 200, hrc: null, hra: 56.5, hrb: 91.5 },
      { hb: 172, hv: 180, hrc: null, hra: 53.5, hrb: 87.0 },
      { hb: 156, hv: 164, hrc: null, hra: 50.5, hrb: 82.0 },
      { hb: 140, hv: 147, hrc: null, hra: 47.0, hrb: 76.0 },
      { hb: 125, hv: 131, hrc: null, hra: 43.0, hrb: 70.0 },
      { hb: 112, hv: 118, hrc: null, hra: 39.5, hrb: 63.0 },
      { hb: 100, hv: 105, hrc: null, hra: 35.5, hrb: 56.0 }
    ];

    const CONVERSION_MAP = {
      HB_HV: { from: "hb", to: "hv", labelFrom: "HB", labelTo: "HV", title: "แปลง HB เป็น HV (ASTM E140)" },
      HV_HRC: { from: "hv", to: "hrc", labelFrom: "HV", labelTo: "HRC", title: "แปลง HV เป็น HRC (ASTM E140)" },
      HRC_HRA: { from: "hrc", to: "hra", labelFrom: "HRC", labelTo: "HRA", title: "แปลง HRC เป็น HRA (ASTM E140)" },
      HRA_HRB: { from: "hra", to: "hrb", labelFrom: "HRA", labelTo: "HRB", title: "แปลง HRA เป็น HRB (ASTM E140)" },
      HV_HB: { from: "hv", to: "hb", labelFrom: "HV", labelTo: "HB", title: "แปลง HV เป็น HB (ASTM E140)" },
      HRC_HV: { from: "hrc", to: "hv", labelFrom: "HRC", labelTo: "HV", title: "แปลง HRC เป็น HV (ASTM E140)" },
      HRA_HRC: { from: "hra", to: "hrc", labelFrom: "HRA", labelTo: "HRC", title: "แปลง HRA เป็น HRC (ASTM E140)" },
      HRB_HRA: { from: "hrb", to: "hra", labelFrom: "HRB", labelTo: "HRA", title: "แปลง HRB เป็น HRA (ASTM E140)" }
    };

    const MODES = {
      CALC: {
        badge: "Standard Calc",
        formula: "Standard Calculator",
        cols: 0,
        fields: []
      },
      HB: {
        badge: "HB Hardness",
        formula: "HB = 2F / [πD(D - √(D² - X²))]",
        cols: 3,
        fields: [
          { id: "in1", label: "Force (F)" },
          { id: "in2", label: "Ball Dia (D)" },
          { id: "in3", label: "Indent (X)" }
        ]
      },
      CONVERT: {
        badge: "แปลงค่าความแข็ง",
        formula: "ASTM E140 Standard Conversion",
        cols: 2,
        isConvert: true
      },
      Position: {
        badge: "⌖ Position",
        formula: "Pos = 2 × √(ΔX² + ΔY²)",
        cols: 2,
        fields: [
          { id: "in1", label: "ค่าเบี่ยงเบน ΔX" },
          { id: "in2", label: "ค่าเบี่ยงเบน ΔY" }
        ]
      },
      Circularity: {
        badge: "○ Circularity",
        formula: "Roundness = R_max − R_min",
        cols: 2,
        fields: [
          { id: "in1", label: "รัศมีสูงสุด (R max)" },
          { id: "in2", label: "รัศมีต่ำสุด (R min)" }
        ]
      },
      Flatness: {
        badge: "▱ Flatness",
        formula: "Flatness = Z_max − Z_min",
        cols: 2,
        fields: [
          { id: "in1", label: "จุดสูงสุด (Max)" },
          { id: "in2", label: "จุดต่ำสุด (Min)" }
        ]
      },
      Parallelism: {
        badge: "∥ Parallelism",
        formula: "Parallelism = Max − Min",
        cols: 2,
        fields: [
          { id: "in1", label: "ค่าสูงสุด (Max)" },
          { id: "in2", label: "ค่าต่ำสุด (Min)" }
        ]
      },
      Perpendicularity: {
        badge: "⊥ Perpendicularity",
        formula: "Perp = Max − Min",
        cols: 2,
        fields: [
          { id: "in1", label: "ค่าเบี่ยงเบน Max" },
          { id: "in2", label: "ค่าเบี่ยงเบน Min" }
        ]
      },
      Concentricity: {
        badge: "◎ Concentricity",
        formula: "Conc = 2 × e (ระยะเยื้องศูนย์)",
        cols: 2,
        fields: [
          { id: "in1", label: "เยื้องศูนย์ ΔX" },
          { id: "in2", label: "เยื้องศูนย์ ΔY" }
        ]
      },
      "Circular Runout": {
        badge: "↗ Circular Runout",
        formula: "FIM (TIR) = Max − Min",
        cols: 2,
        fields: [
          { id: "in1", label: "เข็มสูงสุด (Max)" },
          { id: "in2", label: "เข็มต่ำสุด (Min)" }
        ]
      },
      "Total Runout": {
        badge: "⇉ Total Runout",
        formula: "Total TIR = Max_all − Min_all",
        cols: 2,
        fields: [
          { id: "in1", label: "สูงสุดตลอดแนว (Max)" },
          { id: "in2", label: "ต่ำสุดตลอดแนว (Min)" }
        ]
      }
    };

    let expression = "";
    let activeInput = null;
    let currentMode = "CALC";
    let audioCtx = null;

    const display = document.getElementById("display");
    const subDisplay = document.getElementById("subDisplay");
    const formulaTag = document.getElementById("formulaTag");
    const dynamicInputs = document.getElementById("dynamicInputs");
    const modeBadge = document.getElementById("modeBadge");

    // ระบบเสียงคลิกเบาๆ + สั่น Haptic + แสงกระเพื่อมเมื่อสัมผัสปุ่ม
    function playTapFeedback(isAction = false) {
      // 1. สั่นเบาๆ บนมือถือ Android / OPPO
      if (navigator.vibrate) {
        try {
          navigator.vibrate(isAction ? 18 : 10);
        } catch {}
      }

      // 2. เสียงคลิกนุ่มๆ แบบปุ่มสัมผัส (ไม่ต้องโหลดไฟล์เสียงภายนอก)
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(isAction ? 520 : 680, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.025);

        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.026);
      } catch {}
    }

    function createRipple(btn, e) {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const clientX = e.clientX !== undefined ? e.clientX : rect.left + rect.width / 2;
      const clientY = e.clientY !== undefined ? e.clientY : rect.top + rect.height / 2;

      const circle = document.createElement("span");
      circle.className = "ripple";
      circle.style.width = circle.style.height = `${size}px`;
      circle.style.left = `${clientX - rect.left - size / 2}px`;
      circle.style.top = `${clientY - rect.top - size / 2}px`;

      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 450);
    }

    // ดักจับการสัมผัสปุ่มทุกปุ่มในแอปให้ยุบตัวทันทีที่นิ้วแตะ (PointerDown)
    document.addEventListener("pointerdown", (e) => {
      const btn = e.target.closest(".btn, .iconBtn, .modeBtn, .delBtn");
      if (!btn) return;
      btn.classList.add("pressed");
      const isAction = btn.classList.contains("orange") || btn.classList.contains("gray");
      playTapFeedback(isAction);
      if (btn.classList.contains("btn")) {
        createRipple(btn, e);
      }
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(evt => {
      document.addEventListener(evt, (e) => {
        const btn = e.target.closest(".btn, .iconBtn, .modeBtn, .delBtn");
        if (btn) btn.classList.remove("pressed");
      }, true);
    });

    document.addEventListener("click", (e) => {
      const panel = document.getElementById("modePanel");
      const btn = e.target.closest(".iconBtn");
      if (panel.classList.contains("show") && !panel.contains(e.target) && !btn) {
        panel.classList.remove("show");
      }
    });

    function setInput(id) {
      document.querySelectorAll(".calcInput").forEach(el => el.classList.remove("active"));
      activeInput = id;
      const box = document.getElementById(id);
      if (box) box.classList.add("active");
    }

    function updateDisplay(text, isError = false) {
      display.classList.toggle("error", isError);
      display.textContent = text;
    }

    function update() {
      updateDisplay(expression === "" ? "0" : expression, false);
    }

    function input(v) {
      if (activeInput) {
        const box = document.getElementById(activeInput);
        if (!box) return;
        if (v === "." && box.value.includes(".")) return;
        if (["+", "-", "*", "/", "%"].includes(v)) return;
        box.value += v;
        return;
      }
      expression += v;
      update();
    }

    function clearAll() {
      subDisplay.textContent = "";
      if (currentMode !== "CALC") {
        document.querySelectorAll(".calcInput").forEach(el => el.value = "");
        if (currentMode === "CONVERT") {
          updateConvertPlaceholder();
        } else {
          updateDisplay("0", false);
        }
        const first = document.querySelector(".calcInput");
        if (first) setInput(first.id);
        return;
      }
      expression = "";
      update();
    }

    function backspace() {
      if (activeInput) {
        const box = document.getElementById(activeInput);
        if (box) box.value = box.value.slice(0, -1);
        return;
      }
      expression = expression.slice(0, -1);
      update();
    }

    function plusminus() {
      if (activeInput) {
        const box = document.getElementById(activeInput);
        if (!box || !box.value) return;
        box.value = box.value.startsWith("-") ? box.value.slice(1) : "-" + box.value;
        return;
      }
      if (!expression) return;
      expression = expression.startsWith("-") ? expression.slice(1) : "-" + expression;
      update();
    }

    function toggleHistory() {
      document.getElementById("history").classList.toggle("show");
    }

    function toggleMode() {
      document.getElementById("modePanel").classList.toggle("show");
    }

    function updateConvertPlaceholder() {
      const typeEl = document.getElementById("convType");
      if (!typeEl) return;
      const cfg = CONVERSION_MAP[typeEl.value];
      formulaTag.textContent = cfg.title;
      document.getElementById("convLabel").textContent = `กรอกค่า ${cfg.labelFrom}`;
      subDisplay.textContent = "";
      updateDisplay(`0 ${cfg.labelTo}`, false);
    }

    function selectMode(mode, btnEl) {
      document.getElementById("modePanel").classList.remove("show");
      document.querySelectorAll(".modeBtn").forEach(b => b.classList.remove("activeMode"));
      if (btnEl) btnEl.classList.add("activeMode");

      currentMode = mode;
      const cfg = MODES[mode];
      modeBadge.textContent = cfg.badge;
      formulaTag.textContent = cfg.formula;
      subDisplay.textContent = "";
      activeInput = null;

      if (mode === "CALC") {
        dynamicInputs.className = "dynamicInputs";
        dynamicInputs.innerHTML = "";
        update();
        return;
      }

      if (cfg.isConvert) {
        dynamicInputs.className = "dynamicInputs active cols-2";
        dynamicInputs.innerHTML = `
          <div class="fieldBox">
            <label for="convType">เลือกรูปแบบการแปลง</label>
            <select class="calcSelect" id="convType" onchange="updateConvertPlaceholder()">
              <option value="HB_HV">HB ➔ HV</option>
              <option value="HV_HRC">HV ➔ HRC</option>
              <option value="HRC_HRA">HRC ➔ HRA</option>
              <option value="HRA_HRB">HRA ➔ HRB</option>
              <option value="HV_HB">HV ➔ HB</option>
              <option value="HRC_HV">HRC ➔ HV</option>
              <option value="HRA_HRC">HRA ➔ HRC</option>
              <option value="HRB_HRA">HRB ➔ HRA</option>
            </select>
          </div>
          <div class="fieldBox">
            <label id="convLabel" for="inConv">กรอกค่า HB</label>
            <input class="calcInput" id="inConv" placeholder="0" onclick="setInput('inConv')" readonly>
          </div>
        `;
        updateConvertPlaceholder();
        setInput("inConv");
        return;
      }

      dynamicInputs.className = `dynamicInputs active cols-${cfg.cols}`;
      dynamicInputs.innerHTML = cfg.fields.map(f => `
        <div class="fieldBox">
          <label for="${f.id}">${f.label}</label>
          <input class="calcInput" id="${f.id}" placeholder="0" onclick="setInput('${f.id}')" readonly>
        </div>
      `).join("");

      updateDisplay("0", false);
      if (cfg.fields.length > 0) {
        setInput(cfg.fields[0].id);
      }
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem("calcHistory") || "[]");
      } catch {
        return [];
      }
    }

    function saveHistory(txt) {
      try {
        const data = getHistory();
        data.unshift(txt);
        localStorage.setItem("calcHistory", JSON.stringify(data.slice(0, 60)));
        renderHistory();
      } catch {}
    }

    function renderHistory() {
      const data = getHistory();
      const list = document.getElementById("historyList");
      if (!data.length) {
        list.innerHTML = `<div style="color:var(--muted); text-align:center; padding:24px;">ยังไม่มีประวัติการคำนวณ</div>`;
        return;
      }
      list.innerHTML = data.map((item, index) => `
        <div class="historyItem">
          <span>${item}</span>
          <button class="delBtn" onclick="deleteHistory(${index})">ลบ</button>
        </div>
      `).join("");
    }

    function deleteHistory(index) {
      try {
        const data = getHistory();
        data.splice(index, 1);
        localStorage.setItem("calcHistory", JSON.stringify(data));
        renderHistory();
      } catch {}
    }

    function clearHistory() {
      try {
        localStorage.removeItem("calcHistory");
        renderHistory();
      } catch {}
    }

    function interpolateHardness(val, fromKey, toKey) {
      const validRows = ASTM_TABLE
        .filter(r => r[fromKey] !== null && r[toKey] !== null)
        .sort((a, b) => a[fromKey] - b[fromKey]);

      if (!validRows.length) return null;
      const minVal = validRows[0][fromKey];
      const maxVal = validRows[validRows.length - 1][fromKey];

      if (val < minVal || val > maxVal) {
        return { error: `ค่าต้องอยู่ระหว่าง ${minVal} - ${maxVal}` };
      }

      for (let i = 0; i < validRows.length - 1; i++) {
        const r1 = validRows[i];
        const r2 = validRows[i + 1];
        if (val >= r1[fromKey] && val <= r2[fromKey]) {
          const ratio = (val - r1[fromKey]) / (r2[fromKey] - r1[fromKey]);
          const result = r1[toKey] + ratio * (r2[toKey] - r1[toKey]);
          return { value: result };
        }
      }
      return null;
    }

    function calculate() {
      if (currentMode === "CALC") {
        try {
          if (!expression) return;
          const exp = expression.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
          const result = Function(`"use strict"; return (${exp})`)();
          if (!Number.isFinite(result)) throw new Error("Math");
          const cleanResult = Number(result.toFixed(8));
          subDisplay.textContent = `${expression} =`;
          saveHistory(`${expression} = ${cleanResult}`);
          expression = String(cleanResult);
          update();
        } catch {
          updateDisplay("Error", true);
          expression = "";
        }
        return;
      }

      if (currentMode === "HB") {
        const F = parseFloat(document.getElementById("in1").value);
        const D = parseFloat(document.getElementById("in2").value);
        const X = parseFloat(document.getElementById("in3").value);

        if (isNaN(F) || isNaN(D) || isNaN(X) || D <= 0 || F <= 0 || X <= 0 || X >= D) {
          subDisplay.textContent = "กรอก F, D, X > 0 และ X < D";
          updateDisplay("Input Error", true);
          return;
        }
        const denom = Math.PI * D * (D - Math.sqrt(D * D - X * X));
        const hb = (2 * F) / denom;
        const res = `${hb.toFixed(1)} HB`;
        subDisplay.textContent = `F=${F}, D=${D}, X=${X}`;
        updateDisplay(res, false);
        saveHistory(`HB (F=${F}, D=${D}, X=${X}) = ${res}`);
        return;
      }

      if (currentMode === "CONVERT") {
        const type = document.getElementById("convType").value;
        const cfg = CONVERSION_MAP[type];
        const val = parseFloat(document.getElementById("inConv").value);

        if (isNaN(val)) {
          subDisplay.textContent = `กรุณากรอกค่า ${cfg.labelFrom}`;
          updateDisplay("Input Error", true);
          return;
        }

        const out = interpolateHardness(val, cfg.from, cfg.to);
        if (!out || out.error) {
          subDisplay.textContent = out ? out.error : "นอกช่วงมาตรฐาน ASTM E140";
          updateDisplay("Out of Range", true);
          return;
        }

        const formatted = `${out.value.toFixed(1)} ${cfg.labelTo}`;
        subDisplay.textContent = `${val} ${cfg.labelFrom} ➔`;
        updateDisplay(formatted, false);
        saveHistory(`แปลงค่า: ${val} ${cfg.labelFrom} = ${formatted}`);
        return;
      }

      const v1 = parseFloat(document.getElementById("in1")?.value);
      const v2 = parseFloat(document.getElementById("in2")?.value);

      if (isNaN(v1) || isNaN(v2)) {
        subDisplay.textContent = "กรุณากรอกตัวเลขให้ครบทั้ง 2 ช่อง";
        updateDisplay("Input Error", true);
        return;
      }

      let resultVal = 0;
      let detail = "";

      if (currentMode === "Position" || currentMode === "Concentricity") {
        resultVal = 2 * Math.sqrt(v1 * v1 + v2 * v2);
        detail = `ΔX=${v1}, ΔY=${v2}`;
      } else {
        resultVal = Math.abs(v1 - v2);
        detail = `Max=${v1}, Min=${v2}`;
      }

      const formatted = `${resultVal.toFixed(4)} mm`;
      subDisplay.textContent = detail;
      updateDisplay(formatted, false);
      saveHistory(`${currentMode} (${detail}) = ${formatted}`);
    }

    renderHistory();
  </script>
</body>
