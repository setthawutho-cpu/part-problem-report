<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HB & GD&T Pro">
  <title>HB &amp; GD&amp;T Calculator Pro</title>
  <style>
    :root {
      --bg-outer: #05080f;
      --bg-app: #0d1320;
      --bg-card: rgba(255, 255, 255, 0.065);
      --bg-card-active: rgba(255, 255, 255, 0.16);
      --border: rgba(255, 255, 255, 0.11);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --cyan: #38bdf8;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg-outer);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
      gap: clamp(6px, 1.1dvh, 10px);
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.14), transparent 42%),
        var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      position: relative;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: clamp(14px, 3.8vw, 16px);
      letter-spacing: 0.2px;
      min-width: 0;
      overflow: hidden;
    }

    .brand span:first-child {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge {
      font-size: clamp(10px, 2.8vw, 11px);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topActions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .iconBtn {
      width: clamp(34px, 9vw, 40px);
      height: clamp(34px, 9vw, 40px);
      border: 1px solid var(--border);
      border-bottom: 3px solid rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text);
      font-size: clamp(15px, 4vw, 17px);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      transition: transform 0.06s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.12s ease, border-bottom-width 0.06s ease;
    }

    .iconBtn.pressed, .iconBtn:active {
      transform: translateY(2px) scale(0.95);
      border-bottom-width: 1px;
      background: var(--bg-card-active);
    }

    .display {
      flex: 0 0 auto;
      min-height: clamp(92px, 17dvh, 155px);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(8px, 1.4dvh, 12px) 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(4px, 0.7dvh, 6px);
      overflow: hidden;
      min-width: 0;
    }

    .formulaRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 16px;
      min-width: 0;
    }

    #formulaTag {
      font-size: clamp(10px, 2.7vw, 11px);
      color: var(--cyan);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }

    #subDisplay {
      color: var(--muted);
      font-size: clamp(11px, 2.9vw, 12px);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
      max-width: 58%;
    }

    #display {
      color: var(--text);
      font-size: clamp(22px, 6.8vw, 34px);
      font-weight: 700;
      text-align: right;
      width: 100%;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #display.error {
      color: var(--danger);
      font-size: clamp(17px, 4.8vw, 21px);
    }

    .dynamicInputs {
      display: none;
      gap: 5px;
      width: 100%;
      min-width: 0;
    }

    .dynamicInputs.active {
      display: grid;
    }

    .cols-1 { grid-template-columns: minmax(0, 1fr); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .fieldBox {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .fieldBox.span-2 {
      grid-column: span 2;
    }

    .fieldBox label {
      font-size: clamp(9.5px, 2.4vw, 10.5px);
      color: var(--muted);
      padding-left: 2px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .calcInput, .calcSelect {
      width: 100%;
      min-width: 0;
      height: clamp(29px, 4.2dvh, 35px);
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(10, 15, 28, 0.92);
      color: var(--text);
      font-size: clamp(12px, 3.3vw, 14px);
      font-weight: 600;
      padding: 0 7px;
      outline: none;
      transition: all 0.15s ease;
    }

    .calcInput.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
      background: rgba(245, 158, 11, 0.16);
    }

    .pad {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(5px, 1.1dvh, 9px);
    }

    /* Tactile 3D Button Styling */
    .btn {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 3.5px solid rgba(0, 0, 0, 0.52);
      border-radius: clamp(12px, 3.2vw, 16px);
      font-size: clamp(18px, 5.2vw, 23px);
      font-weight: 500;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.05s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.05s ease,
                  border-bottom-width 0.05s ease,
                  background 0.12s ease;
    }

    .btn.pressed, .btn:active {
      transform: translateY(2.5px) scale(0.955);
      border-bottom-width: 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.35);
      background: rgba(255, 255, 255, 0.18);
    }

    .gray {
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.24), rgba(148, 163, 184, 0.14));
      border-bottom-color: rgba(0, 0, 0, 0.58);
      color: #e2e8f0;
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 600;
    }

    .gray.pressed, .gray:active {
      background: rgba(148, 163, 184, 0.32);
    }

    .orange {
      background: linear-gradient(180deg, #f59e0b, #d97706);
      border: 1px solid rgba(253, 230, 138, 0.35);
      border-bottom: 3.5px solid #92400e;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .orange.pressed, .orange:active {
      background: linear-gradient(180deg, #fbbf24, #ea580c);
      border-bottom-width: 1px;
      box-shadow: 0 1px 4px rgba(217, 119, 6, 0.4), inset 0 2px 6px rgba(120, 53, 15, 0.45);
    }

    /* Ripple Wave Animation */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.48) 0%, rgba(255, 255, 255, 0) 70%);
      transform: scale(0);
      animation: rippleAnim 0.38s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .history, .modePanel {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.98);
      backdrop-filter: blur(18px);
      z-index: 1000;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .history {
      transform: translateY(-100%);
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .history.show {
      transform: translateY(0);
    }

    .historyHeader {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .historyContent {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .historyItem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .delBtn {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .delBtn:active {
      transform: scale(0.94);
    }

    .modePanel {
      left: auto;
      right: 0;
      width: min(305px, 85vw);
      transform: translateX(100%);
      padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    .modePanel.show {
      transform: translateX(0);
    }

    .modeGroupTitle {
      font-size: 11px;
      color: var(--muted);
      margin: 12px 0 6px 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .modeGroupTitle:first-child {
      margin-top: 0;
    }

    .modeBtn {
      width: 100%;
      margin-bottom: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      text-align: left;
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .modeBtn:active {
      transform: scale(0.97);
    }

    .modeBtn.activeMode {
      background: rgba(245, 158, 11, 0.18);
      border-color: var(--accent);
      color: #fde68a;
      font-weight: 600;
    }

    @media (max-width: 767px) {
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    @media (max-height: 640px) {
      #app {
        padding: max(6px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
        gap: 5px;
      }
      .topbar {
        min-height: 32px;
      }
      .display {
        min-height: 82px;
        padding: 6px 10px;
        border-radius: 14px;
      }
      .calcInput, .calcSelect {
        height: 27px;
        font-size: 12px;
      }
      .pad {
        gap: 4px;
      }
      .btn {
        border-radius: 10px;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <span>HB &amp; GD&amp;T</span>
        <span class="badge" id="modeBadge">Standard Calc</span>
      </div>
      <div class="topActions">
        <button class="iconBtn" id="soundBtn" onclick="toggleSound()" title="เสียงกดปุ่ม">🔊</button>
        <button class="iconBtn" onclick="toggleHistory()" title="ประวัติ">🕒</button>
        <button class="iconBtn" onclick="toggleMode()" title="เลือกโหมด">☰</button>
      </div>
    </div>

    <div class="display">
      <div class="formulaRow">
        <span id="formulaTag">Standard Calculator</span>
        <span id="subDisplay"></span>
      </div>
      <div id="display">0</div>
      <div id="dynamicInputs" class="dynamicInputs"></div>
    </div>

    <div class="pad" id="calculatorPad">
      <button class="btn gray" onclick="backspace()">⌫</button>
      <button class="btn gray" onclick="clearAll()">AC</button>
      <button class="btn gray" onclick="input('%')">%</button>
      <button class="btn orange" onclick="input('/')">÷</button>

      <button class="btn" onclick="input('7')">7</button>
      <button class="btn" onclick="input('8')">8</button>
      <button class="btn" onclick="input('9')">9</button>
      <button class="btn orange" onclick="input('*')">×</button>

      <button class="btn" onclick="input('4')">4</button>
      <button class="btn" onclick="input('5')">5</button>
      <button class="btn" onclick="input('6')">6</button>
      <button class="btn orange" onclick="input('-')">−</button>

      <button class="btn" onclick="input('1')">1</button>
      <button class="btn" onclick="input('2')">2</button>
      <button class="btn" onclick="input('3')">3</button>
      <button class="btn orange" onclick="input('+')">+</button>

      <button class="btn" onclick="plusminus()">±</button>
      <button class="btn" onclick="input('0')">0</button>
      <button class="btn" onclick="input('.')">.</button>
      <button class="btn orange" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="history" id="history">
    <div class="historyHeader">
      <h3>ประวัติการคำนวณ</h3>
      <div style="display:flex; gap:8px;">
        <button class="delBtn" onclick="clearHistory()">ล้างทั้งหมด</button>
        <button class="delBtn" onclick="toggleHistory()">ปิด</button>
      </div>
    </div>
    <div class="historyContent" id="historyList"></div>
  </div>

  <div class="modePanel" id="modePanel">
    <div class="modeGroupTitle">เครื่องคิดเลข &amp; ความแข็ง</div>
    <button class="modeBtn activeMode" onclick="selectMode('CALC', this)">🔢 Standard Calc</button>
    <button class="modeBtn" onclick="selectMode('HB', this)">⚙️ HB Hardness</button>
    <button class="modeBtn" onclick="selectMode('CONVERT', this)">🔄 แปลงค่าความแข็ง (HB/HV/HRC/HRA/HRB)</button>

    <div class="modeGroupTitle">ความลึกผิวชุบแข็ง (Effective Case Depth)</div>
    <button class="modeBtn" onclick="selectMode('ECD_INDUCTION', this)">⚡ Effective Case Depth: Induction</button>
    <button class="modeBtn" onclick="selectMode('ECD_CARB', this)">🔥 Effective Case Depth: Carburizing</button>

    <div class="modeGroupTitle">งานวัดละเอียด GD&amp;T</div>
    <button class="modeBtn" onclick="selectMode('Position', this)">⌖ Position</button>
    <button class="modeBtn" onclick="selectMode('Circularity', this)">○ Circularity</button>
    <button class="modeBtn" onclick="selectMode('Flatness', this)">▱ Flatness</button>
    <button class="modeBtn" onclick="selectMode('Parallelism', this)">∥ Parallelism</button>
    <button class="modeBtn" onclick="selectMode('Perpendicularity', this)">⊥ Perpendicularity</button>
    <button class="modeBtn" onclick="selectMode('Concentricity', this)">◎ Concentricity</button>
    <button class="modeBtn" onclick="selectMode('Circular Runout', this)">↗ Circular Runout</button>
    <button class="modeBtn" onclick="selectMode('Total Runout', this)">⇉ Total Runout</button>
  </div>

  <script>
    /* ================= Tactile Feedback Engine (Vibration + Sound + Ripple) ================= */
    let soundEnabled = true;
    let audioCtx = null;

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundBtn");
      btn.textContent = soundEnabled ? "🔊" : "🔇";
      if (soundEnabled) playTactileClick("action");
    }

    function playTactileClick(type = "num") {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (!audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === "eq") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.035);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        } else if (type === "action") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.03);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(280, now + 0.024);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } catch {}
    }

    function triggerHaptic(ms = 12) {
      try {
        if (navigator.vibrate) navigator.vibrate(ms);
      } catch {}
    }

    function spawnRipple(el, clientX, clientY) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = `${size}px`;
      const x = (clientX ? clientX - rect.left : rect.width / 2) - size / 2;
      const y = (clientY ? clientY - rect.top : rect.height / 2) - size / 2;
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 400);
    }

    document.addEventListener("pointerdown", (e) => {
      const target = e.target.closest(".btn, .iconBtn, .modeBtn, .delBtn");
      if (!target) return;

      target.classList.add("pressed");
      spawnRipple(target, e.clientX, e.clientY);

      if (target.classList.contains("orange")) {
        triggerHaptic(16);
        playTactileClick(target.textContent.trim() === "=" ? "eq" : "action");
      } else if (target.classList.contains("gray")) {
        triggerHaptic(14);
        playTactileClick("action");
      } else {
        triggerHaptic(10);
        playTactileClick("num");
      }
    });

    const clearPressed = () => {
      document.querySelectorAll(".pressed").forEach(el => el.classList.remove("pressed"));
    };
    document.addEventListener("pointerup", clearPressed);
    document.addEventListener("pointercancel", clearPressed);
    document.addEventListener("pointerleave", clearPressed);

    /* ================= Hardness & GD&T Calculation Engine ================= */
    const ASTM_TABLE = [
      { hb: 653, hv: 690, hrc: 60.0, hra: 81.2, hrb: null },
      { hb: 615, hv: 649, hrc: 58.0, hra: 80.1, hrb: null },
      { hb: 577, hv: 606, hrc: 56.0, hra: 79.0, hrb: null },
      { hb: 543, hv: 570, hrc: 54.0, hra: 78.0, hrb: null },
      { hb: 512, hv: 538, hrc: 52.0, hra: 76.8, hrb: null },
      { hb: 481, hv: 505, hrc: 50.0, hra: 75.9, hrb: null },
      { hb: 455, hv: 478, hrc: 48.0, hra: 74.7, hrb: null },
      { hb: 432, hv: 454, hrc: 46.0, hra: 73.6, hrb: null },
      { hb: 409, hv: 430, hrc: 44.0, hra: 72.5, hrb: null },

    function input(v) {

        if (!box) return;
        if (v === "." && box.value.includes(".")) return;
        if (["+", "-", "*", "/", "%"].includes(v)) return;
        box.value += v;
        return;
      }
      expression += v;
      update();

        } else {

        const first = document.querySelector(".calcInput");
        if (first) setInput(first.id);
        return;
      }
      expression = "";
      update();
    }

    function interpolateHardness(val, fromKey, toKey) {
      const validRows = ASTM_TABLE
        .filter(r => r[fromKey] !== null && r[toKey] !== null)
        .sort((a, b) => a[fromKey] - b[fromKey]);

      if (!validRows.length) return null;
      const minVal = validRows[fromKey];
      const maxVal = validRows[validRows.length - 1][fromKey];

      if (val < minVal || val > maxVal) {
        return { error: `ค่าต้องอยู่ระหว่าง ${minVal} - ${maxVal}` };
      }

      for (let i = 0; i < validRows.length - 1; i++) {
        const r1 = validRows[i];
        const r2 = validRows[i + 1];
        if (val >= r1[fromKey] && val <= r2[fromKey]) {
          const ratio = (val - r1[fromKey]) / (r2[fromKey] - r1[fromKey]);
          const result = r1[toKey] + ratio * (r2[toKey] - r1[toKey]);
          return { value: result };
        }
      }
      return null;
    }

    function calculate() {
      if (currentMode === "CALC") {
        try {
          if (!expression) return;
          const exp = expression.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
          const result = Function(`"use strict"; return (${exp})`)();
          if (!Number.isFinite(result)) throw new Error("Math");
          const cleanResult = Number(result.toFixed(8));
          subDisplay.textContent = `${expression} =`;
          saveHistory(`${expression} = ${cleanResult}`);
          expression = String(cleanResult);
          update();
        } catch {
          updateDisplay("Error", true);
          expression = "";
        }
        return;
      }

      if (currentMode === "HB") {
        const F = parseFloat(document.getElementById("in1").value);
        const D = parseFloat(document.getElementById("in2").value);
        const X = parseFloat(document.getElementById("in3").value);

        if (isNaN(F) || isNaN(D) || isNaN(X) || D <= 0 || F <= 0 || X <= 0 || X >= D) {
          subDisplay.textContent = "กรอก F, D, X > 0 และ X < D";
          updateDisplay("Input Error", true);
          return;
        }
        const denom = Math.PI * D * (D - Math.sqrt(D * D - X * X));
        const hb = (2 * F) / denom;
        const res = `${hb.toFixed(1)} HB`;
        subDisplay.textContent = `F=${F}, D=${D}, X=${X}`;
        updateDisplay(res, false);
        saveHistory(`HB (F=${F}, D=${D}, X=${X}) = ${res}`);
        return;
      }

      if (currentMode === "CONVERT") {
        const type = document.getElementById("convType").value;
        const cfg = CONVERSION_MAP[type];
        const val = parseFloat(document.getElementById("inConv").value);

        if (isNaN(val)) {
          subDisplay.textContent = `กรุณากรอกค่า ${cfg.labelFrom}`;
          updateDisplay("Input Error", true);
          return;
        }

        const out = interpolateHardness(val, cfg.from, cfg.to);
        if (!out || out.error) {
          subDisplay.textContent = out ? out.error : "นอกช่วงมาตรฐาน ASTM E140";
          updateDisplay("Out of Range", true);
          return;
        }

        const formatted = `${out.value.toFixed(1)} ${cfg.labelTo}`;
        subDisplay.textContent = `${val} ${cfg.labelFrom} ➔`;
        updateDisplay(formatted, false);
        saveHistory(`แปลงค่า: ${val} ${cfg.labelFrom} = ${formatted}`);
        return;
      }

      if (currentMode === "ECD_INDUCTION" || currentMode === "ECD_CARB") {
        const preset = document.getElementById("ecdPreset").value;
        const limitInput = parseFloat(document.getElementById("ecdLimit").value);
        const d1 = parseFloat(document.getElementById("ecdD1").value);
        const h1 = parseFloat(document.getElementById("ecdH1").value);
        const d2 = parseFloat(document.getElementById("ecdD2").value);
        const h2 = parseFloat(document.getElementById("ecdH2").value);

        const modeName = currentMode === "ECD_INDUCTION" ? "ECD Induction" : "ECD Carburizing";

        if (preset === "HARRIS_CARB") {
          if (isNaN(limitInput) || isNaN(d1) || limitInput <= 0 || d1 < 0) {
            subDisplay.textContent = "กรอกค่า K และเวลาอบชุบ t (ชม.)";
            updateDisplay("Input Error", true);
            return;
          }
          const ecd = limitInput * Math.sqrt(d1);
          const res = `${ecd.toFixed(3)} mm`;
          subDisplay.textContent = `K=${limitInput}, t=${d1} hr`;
          updateDisplay(res, false);
          saveHistory(`${modeName} (K=${limitInput}, t=${d1}hr) = ${res}`);
          return;
        }

        if (isNaN(limitInput) || isNaN(d1) || isNaN(h1) || isNaN(d2) || isNaN(h2)) {
          subDisplay.textContent = "กรอกข้อมูลให้ครบทั้ง 5 ช่อง";
          updateDisplay("Input Error", true);
          return;
        }

        const hLim = preset === "ISO3754_80" ? 0.80 * limitInput : limitInput;

        if (h1 === h2) {
          subDisplay.textContent = "ค่า H1 และ H2 ต้องไม่เท่ากัน";
          updateDisplay("Math Error", true);
          return;
        }

        if (!((h1 >= hLim && hLim >= h2) || (h1 <= hLim && hLim <= h2))) {
          subDisplay.textContent = `H_lim (${hLim.toFixed(1)}) ต้องอยู่ระหว่าง H1 และ H2`;
          updateDisplay("Range Error", true);
          return;
        }

        const ecd = d1 + ((d2 - d1) * (h1 - hLim)) / (h1 - h2);
        const res = `${ecd.toFixed(3)} mm`;
        subDisplay.textContent = `H_lim=${hLim.toFixed(1)} | (${d1}→${d2}mm)`;
        updateDisplay(res, false);
        saveHistory(`${modeName} [H_lim=${hLim.toFixed(1)}] (${d1}mm:${h1}, ${d2}mm:${h2}) = ${res}`);
        return;
      }

      const v1 = parseFloat(document.getElementById("in1")?.value);
      const v2 = parseFloat(document.getElementById("in2")?.value);

      if (isNaN(v1) || isNaN(v2)) {
        subDisplay.textContent = "กรุณากรอกตัวเลขให้ครบทั้ง 2 ช่อง";
        updateDisplay("Input Error", true);
        return;
      }

      let resultVal = 0;
      let detail = "";

      if (currentMode === "Position" || currentMode === "Concentricity") {
        resultVal = 2 * Math.sqrt(v1 * v1 + v2 * v2);
        detail = `ΔX=${v1}, ΔY=${v2}`;
      } else {
        resultVal = Math.abs(v1 - v2);
        detail = `Max=${v1}, Min=${v2}`;
      }

      const formatted = `${resultVal.toFixed(4)} mm`;
      subDisplay.textContent = detail;
      updateDisplay(formatted, false);
      saveHistory(`${currentMode} (${detail}) = ${formatted}`);
    }

    renderHistory();
  </script>
</body>
</html>
