<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04112d">

<title>GD&T Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    overflow-x:hidden;
    touch-action:manipulation;
    overscroll-behavior:none;
}

body{
    background:#04112d;
    color:#ffffff;
    font-family:system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
}

.wrap{
    max-width:480px;
    margin:auto;
    padding:12px;
}

.card{
    background:#081a40;
    border-radius:24px;
    padding:14px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.top{
    margin-bottom:12px;
}

.history-btn{
    background:#ffaf1a;
    color:#000;
    border:none;
    padding:10px 15px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.sel{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:14px;
    background:#213150;
    color:#4be0ff;
    font-size:18px;
}

.symbols{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:8px;
}

.sym{
    min-width:160px;
    flex-shrink:0;
}

.sym{
    padding:14px;
    border-radius:18px;
    background:#213150;
    border:2px solid #344a72;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.sym.active{
    border-color:#ffaf1a;
    color:#ffaf1a;
}

.result{
    background:#020c24;
    border-radius:20px;
    padding:14px;
    margin-top:12px;
}

.result-title{
    margin-bottom:8px;
}

.value{
    font-size:42px;
    color:#ffbf2f;
    text-align:right;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:12px;
}

.stats div{
    background:#132547;
    padding:10px;
    border-radius:12px;
    text-align:center;
    font-size:12px;
}

.inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.inp{
    background:#102043;
    border:2px solid #29406b;
    border-radius:16px;
    padding:10px;
    min-height:150px;
    cursor:pointer;
}

.inp.active{
    border-color:#ffaf1a;
}

.num{
    color:#ffbf2f;
    font-size:22px;
    margin-top:6px;
    font-weight:bold;
}

.selected{
    margin-bottom:10px;
    color:#ffbf2f;
    font-weight:bold;
}

.pad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.k{
    background:#233452;
    border:none;
    color:#fff;
    border-radius:16px;
    min-height:90px;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
}

.red{
    background:#641b36;
    color:#ffb0bf;
}

.blue{
    background:#005981;
    color:#70dfff;
}

.yellow{
    background:#ffb000;
    color:#111;
}

.k:active{
    transform:scale(.96);
}

.history-list{
    display:none;
    margin-top:12px;
    background:#132547;
    border-radius:12px;
    padding:10px;
    max-height:200px;
    overflow:auto;
}

.history-item{
    padding:8px;
    border-bottom:1px solid rgba(255,255,255,.1);
    font-size:13px;
}

.history-item:last-child{
    border-bottom:none;
}

.pad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:10px;
}

.result:last-child{
    padding-bottom:20px;
}

*{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="top">

<button
class="history-btn"
onclick="viewHistory()">
🕘 ประวัติ
</button>

<select id="mode" class="sel">

<option>Position</option>
<option>Circularity</option>
<option>Flatness</option>
<option>Parallelism</option>
<option>Perpendicularity</option>
<option>Concentricity</option>
<option>Circular Runout</option>
<option>Total Runout</option>

</select>

</div>

<div class="symbols" id="symbols">
</div>

<div class="result">

<div class="result-title">
ผลลัพธ์ GD&T
</div>

<div class="value" id="result">
0.0000
</div>

<div class="stats">

<div>
MAX<br>
<span id="max">0</span>
</div>

<div>
MIN<br>
<span id="min">0</span>
</div>

<div>
RANGE<br>
<span id="range">0</span>
</div>

<div>
MEAN<br>
<span id="mean">0</span>
</div>

</div>

</div>

<div class="inputs">

<div
class="inp active"
data-f="xn">
X Nominal
<div class="num" id="xn">0</div>
</div>

<div
class="inp"
data-f="xa">
X Actual
<div class="num" id="xa">0</div>
</div>

<div
class="inp"
data-f="yn">
Y Nominal
<div class="num" id="yn">0</div>
</div>

<div
class="inp"
data-f="ya">
Y Actual
<div class="num" id="ya">0</div>
</div>

</div>

<div class="result">

<div
id="selected"
class="selected">
ช่องที่เลือก : X Nominal
</div>

<div
class="pad"
id="pad">
</div>

<div
id="historyList"
class="history-list">
</div>

</div>

</div>

</div>

<script>

const syms = [
'⌖',
'○',
'▱',
'∥',
'⊥',
'◎',
'↗',
'⇉'
];

const names = [
'Position',
'Circularity',
'Flatness',
'Parallelism',
'Perpendicularity',
'Concentricity',
'Circular Runout',
'Total Runout'
];

const symbolArea =
document.getElementById('symbols');

names.forEach((name,index)=>{

    const div =
    document.createElement('div');

    div.className =
    'sym' +
    (index===0 ? ' active' : '');

    div.innerHTML =
    syms[index] +
    '<br>' +
    name;

    div.onclick = ()=>{

        document
        .querySelectorAll('.sym')
        .forEach(x=>
            x.classList.remove('active')
        );

        div.classList.add('active');

        mode.value = name;

        calc();
    };

    symbolArea.appendChild(div);
});

let vals = {
xn:'0',
xa:'0',
yn:'0',
ya:'0'
};

let field = 'xn';

let hist =
JSON.parse(
localStorage.getItem('gdtHistory')
|| '[]'
);

document
.querySelectorAll('.inp')
.forEach(el=>{

    el.onclick = ()=>{

        document
        .querySelectorAll('.inp')
        .forEach(x=>
            x.classList.remove('active')
        );

        el.classList.add('active');

        field = el.dataset.f;

        document
        .getElementById('selected')
        .innerText =
        'ช่องที่เลือก : ' +
        field.toUpperCase();
    };

});

const keypad = [
'7','8','9','⌫',
'4','5','6','C',
'1','2','3','Next',
'-','0','.','Save'
];

keypad.forEach(key=>{

    const btn =
    document.createElement('button');

    btn.className = 'k';

    if(key==='C'){
        btn.classList.add('red');
    }

    if(key==='Next'){
        btn.classList.add('blue');
    }

    if(key==='Save'){
        btn.classList.add('yellow');
    }

    btn.textContent = key;

    btn.onclick = ()=>press(key);

    document
    .getElementById('pad')
    .appendChild(btn);

});

function press(key){

    if(key==='C'){

        vals[field]='0';

    }

    else if(key==='⌫'){

        vals[field]=
        vals[field].slice(0,-1)
        || '0';

    }

    else if(key==='Next'){

        const arr=[
            'xn',
            'xa',
            'yn',
            'ya'
        ];

        field =
        arr[
            (arr.indexOf(field)+1)
            %
            arr.length
        ];

        document
        .querySelector(
            `[data-f="${field}"]`
        )
        .click();

        return;
    }

    else if(key==='Save'){

        hist.push({

            mode:mode.value,

            xn:vals.xn,
            xa:vals.xa,
            yn:vals.yn,
            ya:vals.ya,

            result:
            document.getElementById('result')
            .innerText,

            time:
            new Date()
            .toLocaleString(
                'th-TH'
            )

        });

        localStorage.setItem(
            'gdtHistory',
            JSON.stringify(hist)
        );

        alert('บันทึกแล้ว');

        return;
    }

    else{

        if(
            key==='.'
            &&
            vals[field].includes('.')
        ){
            return;
        }

        if(
            vals[field]==='0'
            &&
            key!=='.'
        ){
            vals[field]='';
        }

        vals[field]+=key;
    }

    document
    .getElementById(field)
    .innerText =
    vals[field];

    calc();
}

function calc(){

    const xn =
    parseFloat(vals.xn)||0;

    const xa =
    parseFloat(vals.xa)||0;

    const yn =
    parseFloat(vals.yn)||0;

    const ya =
    parseFloat(vals.ya)||0;

    let resultValue=0;

    const modeValue =
    document.getElementById('mode')
    .value;

    if(
        modeValue==='Position'
        ||
        modeValue==='Concentricity'
    ){

        resultValue =
        Math.sqrt(
            Math.pow(xa-xn,2)
            +
            Math.pow(ya-yn,2)
        ) * 2;

    }

    else if(
        modeValue==='Circularity'
        ||
        modeValue==='Flatness'
    ){

        resultValue =
        Math.abs(xa-xn);

    }

    else if(
        modeValue==='Parallelism'
        ||
        modeValue==='Perpendicularity'
    ){

        resultValue =
        Math.abs(
            (xa-xn)
            -
            (ya-yn)
        );

    }

    else if(
        modeValue==='Circular Runout'
    ){

        resultValue =
        (
            Math.abs(xa-xn)
            +
            Math.abs(ya-yn)
        ) / 2;

    }

    else if(
        modeValue==='Total Runout'
    ){

        resultValue =
        Math.abs(xa-xn)
        +
        Math.abs(ya-yn);

    }

    document
    .getElementById('result')
    .innerText =
    resultValue.toFixed(4);

    const arr=[
        xn,
        xa,
        yn,
        ya
    ];

    document
    .getElementById('max')
    .innerText =
    Math.max(...arr)
    .toFixed(3);

    document
    .getElementById('min')
    .innerText =
    Math.min(...arr)
    .toFixed(3);

    document
    .getElementById('range')
    .innerText =
    (
        Math.max(...arr)
        -
        Math.min(...arr)
    )
    .toFixed(3);

    document
    .getElementById('mean')
    .innerText =
    (
        arr.reduce(
            (a,b)=>a+b,
            0
        )
        /
        arr.length
    )
    .toFixed(3);

}

function viewHistory(){

    const box =
    document.getElementById(
        'historyList'
    );

    if(
        box.style.display==='block'
    ){
        box.style.display='none';
        return;
    }

    box.style.display='block';

    if(hist.length===0){

        box.innerHTML =
        'ยังไม่มีประวัติ';

        return;
    }

    box.innerHTML='';

    hist
    .slice()
    .reverse()
    .forEach(item=>{

        const div =
        document.createElement('div');

        div.className =
        'history-item';

        div.innerHTML =

        '<b>'
        + item.mode +
        '</b><br>' +

        'Result : '
        + item.result +
        '<br>' +

        item.time;

        box.appendChild(div);

    });

}

document
.getElementById('mode')
.onchange = calc;

calc();

</script>

<script>

let lastTouchEnd = 0;

document.addEventListener(
'touchend',
function(event){

    const now = Date.now();

    if(now - lastTouchEnd <= 300){
        event.preventDefault();
    }

    lastTouchEnd = now;

},
{ passive:false }
);

document.addEventListener(
'gesturestart',
function(e){
    e.preventDefault();
}
);

</script>

</body>
</html>
