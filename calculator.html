<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>HB Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
}

body{
    width:100%;
    min-height:100dvh;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:manipulation;
}

#app{
    width:100%;
    min-height:100dvh;

    display:flex;
    flex-direction:column;

    padding-top:
        calc(20px + env(safe-area-inset-top));

    padding-left:20px;
    padding-right:20px;

    padding-bottom:
        calc(90px + env(safe-area-inset-bottom));

    overflow:hidden;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.iconBtn{
    width:56px;
    height:56px;
    border:none;
    border-radius:50%;
    background:#2c2c2e;
    color:#fff;
    font-size:28px;
}

.display{
    flex:1;
    display:flex;
    justify-content:flex-end;
    align-items:flex-end;

    padding:20px 10px;

    color:#fff;
    font-size:clamp(48px,16vw,110px);

    overflow:hidden;
    word-break:break-all;
}

.pad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;

    padding-bottom:
        calc(20px + env(safe-area-inset-bottom));
}

.btn{
    aspect-ratio:1;
    border:none;
    border-radius:50%;

    font-size:clamp(22px,5vw,42px);

    background:#333;
    color:#fff;
}

.gray{
    background:#707070;
}

.orange{
    background:#f5a033;
}

.btn:active{
    transform:scale(.92);
    filter:brightness(1.4);
    box-shadow:0 0 20px rgba(255,255,255,.4);
}

.history{
    position:fixed;
    inset:0;
    background:#111;
    color:#fff;
    z-index:1000;

    transform:translateY(-100%);
    transition:.3s;
}

.history.show{
    transform:translateY(0);
}

.historyHeader{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
}

.historyContent{
    height:calc(100% - 70px);
    overflow:auto;
    padding:10px;
}

.historyItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #222;
}

.delBtn{
    background:#ff3b30;
    color:#fff;
    border:none;
    padding:6px 10px;
    border-radius:8px;
}

.modePanel{
    position:fixed;
    right:-270px;
    top:0;

    width:260px;
    height:100dvh;

    background:#111;
    z-index:999;

    transition:.3s;
    padding-top:80px;
    overflow-y:auto;
}

.modePanel.show{
    right:0;
}

.modeBtn{
    width:92%;
    margin:6px auto;
    display:block;

    padding:15px;

    border:none;
    border-radius:12px;

    font-size:18px;

    background:#262626;
    color:#fff;
}
</style>
</head>

<body>

<div id="app">

<div class="topbar">
<button class="iconBtn" onclick="toggleHistory()">🕒</button>
<button class="iconBtn" onclick="toggleMode()">🧮</button>
</div>

<div class="display" id="display">0</div>

<div class="pad">

<button class="btn gray" onclick="backspace()">⌫</button>
<button class="btn gray" onclick="clearAll()">AC</button>
<button class="btn gray" onclick="input('%')">%</button>
<button class="btn orange" onclick="input('/')">÷</button>

<button class="btn" onclick="input('7')">7</button>
<button class="btn" onclick="input('8')">8</button>
<button class="btn" onclick="input('9')">9</button>
<button class="btn orange" onclick="input('*')">×</button>

<button class="btn" onclick="input('4')">4</button>
<button class="btn" onclick="input('5')">5</button>
<button class="btn" onclick="input('6')">6</button>
<button class="btn orange" onclick="input('-')">−</button>

<button class="btn" onclick="input('1')">1</button>
<button class="btn" onclick="input('2')">2</button>
<button class="btn" onclick="input('3')">3</button>
<button class="btn orange" onclick="input('+')">+</button>

<button class="btn" onclick="plusminus()">±</button>
<button class="btn" onclick="input('0')">0</button>
<button class="btn" onclick="input('.')">.</button>
<button class="btn orange" onclick="calculate()">=</button>

</div>
</div>

<div class="history" id="history">

<div class="historyHeader">
<h3>History</h3>

<div>
<button class="delBtn" onclick="clearHistory()">
Clear
</button>

<button class="delBtn" onclick="toggleHistory()">
Close
</button>
</div>

</div>

<div class="historyContent" id="historyList"></div>

</div>

<div class="modePanel" id="modePanel">

<button class="modeBtn">HB</button>

<button class="modeBtn">
⌖ Position
</button>

<button class="modeBtn">
○ Circularity
</button>

<button class="modeBtn">
▱ Flatness
</button>

<button class="modeBtn">
∥ Parallelism
</button>

<button class="modeBtn">
⊥ Perpendicularity
</button>

<button class="modeBtn">
◎ Concentricity
</button>

<button class="modeBtn">
↗ Circular Runout
</button>

<button class="modeBtn">
⇉ Total Runout
</button>

</div>

<script>

let expression="";

const display=document.getElementById("display");

function update(){
display.textContent=
expression==="" ? "0" : expression;
}

function input(v){
expression+=v;
update();
}

function clearAll(){
expression="";
update();
}

function backspace(){
expression=
expression.slice(0,-1);
update();
}

function plusminus(){

if(expression==="") return;

if(expression.startsWith("-")){
expression=
expression.substring(1);
}else{
expression="-"+expression;
}

update();
}

function calculate(){

try{

let result=
eval(expression);

saveHistory(
expression+" = "+result
);

expression=
String(result);

update();

}catch{

display.textContent=
"Error";

expression="";

}

}

function toggleHistory(){
document
.getElementById("history")
.classList
.toggle("show");
}

function toggleMode(){
document
.getElementById("modePanel")
.classList
.toggle("show");
}

function getHistory(){

return JSON.parse(
localStorage.getItem("calcHistory")
|| "[]"
);

}

function saveHistory(txt){

let data=getHistory();

data.unshift(txt);

localStorage.setItem(
"calcHistory",
JSON.stringify(data)
);

renderHistory();

}

function renderHistory(){

let data=getHistory();

let html="";

data.forEach((item,index)=>{

html+=`
<div class="historyItem">
<div>${item}</div>
<button
class="delBtn"
onclick="deleteHistory(${index})">
X
</button>
</div>
`;

});

document.getElementById(
"historyList"
).innerHTML=html;

}

function deleteHistory(index){

let data=getHistory();

data.splice(index,1);

localStorage.setItem(
"calcHistory",
JSON.stringify(data)
);

renderHistory();

}

function clearHistory(){

localStorage.removeItem(
"calcHistory"
);

renderHistory();

}

renderHistory();

</script>

</body>
</html>
