<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>HB Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    width:100%;
    min-height:100vh;
    background:#1a1a1a;
    font-family:Arial,sans-serif;
    touch-action:manipulation;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#app{
    width:100%;
    max-width:500px;

    height:900px;

    display:flex;
    flex-direction:column;

    padding:20px;

    overflow:hidden;

    overscroll-behavior:none;
    touch-action:none;

    background:#000;

    border-radius:25px;

    box-shadow:
        0 0 30px rgba(0,0,0,.5),
        0 0 80px rgba(255,255,255,.08);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:0px;
    margin-bottom:10px;
}

.iconBtn{
    width:56px;
    height:56px;
    border:none;
    border-radius:50%;
    background:#2c2c2e;
    color:#fff;
    font-size:28px;
}

.display{
    height:200px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    padding:20px 10px;

    overflow:hidden;
}

#display{
    color:#fff;
    font-size:32px;
    text-align:right;
    width:100%;
    margin-bottom:3px;
}

.pad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    flex:1;
}

.btn{
    width:92%;
    margin:auto;

    aspect-ratio:1;
    border:none;
    border-radius:50%;

    font-size:32px;

    background:#333;
    color:#fff;
}

.gray{
    background:#707070;
}

.orange{
    background:#f5a033;
}

.btn:active{
    transform:scale(.92);
    filter:brightness(1.4);
    box-shadow:0 0 20px rgba(255,255,255,.4);
}

.history{
    position:fixed;
    inset:0;
    background:#111;
    color:#fff;
    z-index:1000;

    transform:translateY(-100%);
    transition:.3s;
}

.history.show{
    transform:translateY(0);
}

.historyHeader{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
}

.historyContent{
    height:calc(100% - 70px);
    overflow:auto;
    padding:10px;
}

.historyItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #222;
}

.delBtn{
    background:#ff3b30;
    color:#fff;
    border:none;
    padding:6px 10px;
    border-radius:8px;
}

.modePanel{
    position:fixed;
    right:-270px;
    top:0;

    width:260px;
    height:100dvh;

    background:#111;
    z-index:999;

    transition:.3s;
    padding-top:80px;
    overflow-y:auto;
}

.modePanel.show{
    right:0;
}

.modeBtn{
    width:92%;
    margin:6px auto;
    display:block;

    padding:15px;

    border:none;
    border-radius:12px;

    font-size:18px;

    background:#262626;
    color:#fff;
}

.hbPage{
    width:100%;
    height:0;
    overflow:hidden;
}

.hbInput{
    width:100%;
    height:34px;
    margin-bottom:3px;
    border:none;
    border-radius:8px;
    background:#222;
    color:#fff;
    font-size:15px;
    padding:6px 12px;
    display:flex;
    align-items:center;
}

.hbInput.active{
    border:2px solid #f5a033;
    box-shadow:0 0 8px rgba(245,160,51,.5);
}

@media (max-width:767px){

    body{
        background:#000;
    }

    #app{
        max-width:100%;
        height:100dvh;
        height:100dvh;
        border-radius:0;
        box-shadow:none;

        padding-top:0;
        padding-bottom:calc(55px + env(safe-area-inset-bottom));
        padding-left:20px;
        padding-right:20px;
    }

}

</style>
</head>

<body>

<div id="app">

<div class="topbar">
<button class="iconBtn" onclick="toggleHistory()">🕒</button>
<button class="iconBtn" onclick="toggleMode()">🧮</button>
</div>

<div class="display">

    <div id="display">0</div>

    <div id="hbPage" class="hbPage">
    </div>

</div>

<div class="pad" id="calculatorPad">

<button class="btn gray" onclick="backspace()">⌫</button>
<button class="btn gray" onclick="clearAll()">AC</button>
<button class="btn gray" onclick="input('%')">%</button>
<button class="btn orange" onclick="input('/')">÷</button>

<button class="btn" onclick="input('7')">7</button>
<button class="btn" onclick="input('8')">8</button>
<button class="btn" onclick="input('9')">9</button>
<button class="btn orange" onclick="input('*')">×</button>

<button class="btn" onclick="input('4')">4</button>
<button class="btn" onclick="input('5')">5</button>
<button class="btn" onclick="input('6')">6</button>
<button class="btn orange" onclick="input('-')">−</button>

<button class="btn" onclick="input('1')">1</button>
<button class="btn" onclick="input('2')">2</button>
<button class="btn" onclick="input('3')">3</button>
<button class="btn orange" onclick="input('+')">+</button>

<button class="btn" onclick="plusminus()">±</button>
<button class="btn" onclick="input('0')">0</button>
<button class="btn" onclick="input('.')">.</button>
<button class="btn orange" onclick="calculate()">=</button>

</div>
</div>

<div class="history" id="history">

<div class="historyHeader">
<h3>History</h3>

<div>
<button class="delBtn" onclick="clearHistory()">
Clear
</button>

<button class="delBtn" onclick="toggleHistory()">
Close
</button>
</div>

</div>

<div class="historyContent" id="historyList"></div>

</div>

<div class="modePanel" id="modePanel">

<button class="modeBtn" onclick="selectMode('HB')">HB</button>

<button class="modeBtn" onclick="selectMode('Position')">
⌖ Position
</button>

<button class="modeBtn" onclick="selectMode('Circularity')">
○ Circularity
</button>

<button class="modeBtn" onclick="selectMode('Flatness')">
▱ Flatness
</button>

<button class="modeBtn" onclick="selectMode('Parallelism')">
∥ Parallelism
</button>

<button class="modeBtn" onclick="selectMode('Perpendicularity')">
⊥ Perpendicularity
</button>

<button class="modeBtn" onclick="selectMode('Concentricity')">
◎ Concentricity
</button>

<button class="modeBtn" onclick="selectMode('Circular Runout')">
↗ Circular Runout
</button>

<button class="modeBtn" onclick="selectMode('Total Runout')">
⇉ Total Runout
</button>

</div>

<script>

document.addEventListener("click",function(e){

    const panel =
        document.getElementById("modePanel");

    const btn =
        e.target.closest(".iconBtn");

    if(
        panel.classList.contains("show") &&
        !panel.contains(e.target) &&
        !btn
    ){
        panel.classList.remove("show");
    }

});

let expression="";
let activeInput=null;

const display=document.getElementById("display");
document.getElementById("hbPage").innerHTML="";

function setInput(id){

    document
    .querySelectorAll(".hbInput")
    .forEach(el =>
        el.classList.remove("active")
    );

    activeInput=id;

    document
    .getElementById(id)
    .classList.add("active");
}

function update(){
display.textContent=
expression==="" ? "0" : expression;
}

function input(v){

    if(activeInput){

        let box =
        document.getElementById(activeInput);

        if(
    box.innerText==="Force" ||
    box.innerText==="Ball Diameter" ||
    box.innerText==="Indentation"
){
    box.innerText=v;
}else{
    box.innerText+=v;
}

        return;
    }

    expression += v;
    update();

}

function clearAll(){

    if(activeInput){

document
.getElementById(activeInput)
.innerText="";

        return;
    }

    expression="";
    update();

}

function backspace(){

    if(activeInput){

        let box =
        document.getElementById(activeInput);

        box.innerText =
        box.innerText.slice(0,-1);

        return;
    }

    expression =
    expression.slice(0,-1);

    update();

}

function plusminus(){

if(expression==="") return;

if(expression.startsWith("-")){
expression=
expression.substring(1);
}else{
expression="-"+expression;
}

update();
}

function calculate(){

    if(
        document.getElementById("hbPage")
        .style.display==="flex"
    ){
        calculateHB();
        return;
    }

    try{

        let exp = expression;

        exp = exp.replace(
            /(\d+(\.\d+)?)%/g,
            "($1/100)"
        );

        let result = eval(exp);

        saveHistory(
            expression+" = "+result
        );

        expression = String(result);

        update();

    }catch{

        display.textContent="Error";
        expression="";

    }

}

function toggleHistory(){
document
.getElementById("history")
.classList
.toggle("show");
}

function toggleMode(){
document
.getElementById("modePanel")
.classList
.toggle("show");
}

function selectMode(mode){

    document
    .getElementById("modePanel")
    .classList.remove("show");

    if(mode==="HB"){

        document
        .getElementById("calculatorPad")
        .style.display="grid";

        document
        .getElementById("hbPage")
        .style.display="block";

        document
        .getElementById("hbPage")
        .style.height="130px";

        document
        .getElementById("hbPage")
        .className="hbPage";

        document
        .getElementById("hbPage")
.innerHTML=`

<div
class="hbInput"
id="hbF"
onclick="setInput('hbF')">
Force
</div>

<div
class="hbInput"
id="hbD"
onclick="setInput('hbD')">
Ball Diameter
</div>

<div
class="hbInput"
id="hbX"
onclick="setInput('hbX')">
Indentation
</div>

`;

        display.innerHTML=
'<span style="font-size:32px">HB</span>';

    }

}

function getHistory(){

return JSON.parse(
localStorage.getItem("calcHistory")
|| "[]"
);

}

function saveHistory(txt){

let data=getHistory();

data.unshift(txt);

localStorage.setItem(
"calcHistory",
JSON.stringify(data)
);

renderHistory();

}

function renderHistory(){

let data=getHistory();

let html="";

data.forEach((item,index)=>{

html+=`
<div class="historyItem">
<div>${item}</div>
<button
class="delBtn"
onclick="deleteHistory(${index})">
X
</button>
</div>
`;

});

document.getElementById(
"historyList"
).innerHTML=html;

}

function deleteHistory(index){

let data=getHistory();

data.splice(index,1);

localStorage.setItem(
"calcHistory",
JSON.stringify(data)
);


renderHistory();

}

function clearHistory(){

    localStorage.removeItem(
        "calcHistory"
    );

    renderHistory();

}

function showCalculator(){

    document
    .getElementById("hbPage")
    .style.display="none";

    document
    .getElementById("hbPage")
    .style.height="0";

    activeInput=null;

    update();

}

function calculateHB(){

let F = parseFloat(
    document.getElementById("hbF").innerText
) || 0;

let D = parseFloat(
    document.getElementById("hbD").innerText
) || 0;

let X = parseFloat(
    document.getElementById("hbX").innerText
) || 0;

    if(D<=0 || F<=0 || X<=0){
        display.innerText="Input Error";
        return;
    }

    let HB=
    (2*F)/
    (3.14159*D*
    (D-Math.sqrt(D*D-X*X)));

    display.innerText=
    HB.toFixed(1)+" HB";

}

renderHistory();

</script>

</body>
</html>
