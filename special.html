<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Special</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#f5f7fb;
touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
}

body{
display:flex;
flex-direction:column;
}

.toolGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:10px;
}

.toolBtn{
height:80px;
border:none;
border-radius:15px;
background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,.1);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

font-size:11px;
font-weight:bold;
}

.toolBtn .icon{
font-size:20px;
margin-bottom:4px;
}

.toolBtn.active{
background:#2196f3;
color:#fff;
}

.main{
flex:1;
padding:10px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.box{
height:50px;
background:#fff;
border-radius:12px;
border:1px solid #ddd;

display:flex;
align-items:center;
padding:0 12px;
font-size:16px;

overflow:hidden;
white-space:nowrap;
}

.box.active{
border:2px solid #2196f3;
background:#e3f2fd;
}

.placeholder{
color:#999;
font-weight:normal;
}
  
.row{
display:flex;
gap:10px;
}

.row .box{
flex:1;
}

.result{
margin-top:10px;
background:#fff;
border-radius:15px;
padding:12px;
text-align:center;
font-size:18px;
font-weight:bold;
color:red;
border:2px solid #ddd;
}

.keypad{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:auto;
padding-top:15px;
}

.keypad button{
height:55px;
border:none;
border-radius:12px;
background:white;
font-size:24px;
font-weight:bold;
box-shadow:0 2px 5px rgba(0,0,0,.1);
transition:.15s;
}

.keypad button:active{
transform:scale(.85);
background:#2196f3;
color:#fff;
box-shadow:inset 0 2px 8px rgba(0,0,0,.25);
}

.keypad button.flash{
background:#2196f3 !important;
color:#fff !important;
transform:scale(.85);
}

.saveBtn{
margin-top:8px;
height:50px;
border:none;
border-radius:12px;
background:#4caf50;
color:white;
font-size:16px;
font-weight:bold;
}

select{
width:100%;
height:100%;
border:none;
font-size:18px;
background:transparent;
outline:none;
}

</style>
</head>

<body>

<div class="toolGrid">

<button class="toolBtn active" onclick="selectTool(this,'Length')">
<div class="icon">📏</div>
<div>Length</div>
</button>

<button class="toolBtn" onclick="selectTool(this,'Diameter')">
<div class="icon">⭕</div>
<div>Diameter</div>
</button>

<button class="toolBtn" onclick="selectTool(this,'Angle')">
<div class="icon">📐</div>
<div>Angle</div>
</button>

<button class="toolBtn" onclick="selectTool(this,'Welding')">
<div class="icon">🔥</div>
<div>Welding</div>
</button>

</div>

<div class="main">

<div id="stdBox" class="box placeholder">STD.</div>

<div class="box">
<select id="tol" onchange="calculate()">

<option>±0.10</option>
<option>±0.20</option>
<option>±0.30</option>
<option>±0.40</option>
<option selected>±0.50</option>
<option>±0.70</option>
<option>±1.00</option>
<option>±1.50</option>
<option>±2.00</option>
<option>±2.50</option>
<option>±3.00</option>

</select>

</div>

<div id="actBox" class="box placeholder">ACT.</div>

<div id="result" class="result">
WAITING INPUT
</div>

<div class="keypad">

<button onclick="num('1')">1</button>
<button onclick="num('2')">2</button>
<button onclick="num('3')">3</button>

<button onclick="num('4')">4</button>
<button onclick="num('5')">5</button>
<button onclick="num('6')">6</button>

<button onclick="num('7')">7</button>
<button onclick="num('8')">8</button>
<button onclick="num('9')">9</button>

<button id="dotBtn"
onclick="angleMode?angleChar():num('.')">
.
</button>

<button onclick="num('0')">
0
</button>

<button onclick="backspace()">
⌫
</button>

</div>

<button class="saveBtn" onclick="saveResult()">
💾 SAVE TO DETAIL
</button>

</div>

<script>

let activeField='std';
let currentTool='Length';

let angleMode=false;
let angleStep=0;

function showPlaceholder(){

const stdBox=document.getElementById('stdBox');
const actBox=document.getElementById('actBox');

if(stdBox.innerText.trim()===''){
stdBox.innerText='STD.';
stdBox.classList.add('placeholder');
}

if(actBox.innerText.trim()===''){
actBox.innerText='ACT.';
actBox.classList.add('placeholder');
}

}

window.onload=()=>{

activeField='std';

document.getElementById('stdBox').classList.add('active');

document.getElementById('stdBox').innerText='STD.';
document.getElementById('actBox').innerText='ACT.';

document.getElementById('stdBox').classList.add('placeholder');
document.getElementById('actBox').classList.add('placeholder');

};

document.getElementById('stdBox').onclick=()=>{

if(
document.getElementById('actBox').innerText===''
){
document.getElementById('actBox').innerText='ACT.';
document.getElementById('actBox').classList.add('placeholder');
}

activeField='std';

if(angleMode){
    angleStep=0;
    document.getElementById('dotBtn').innerText='°';
}

if(document.getElementById('stdBox').innerText==='STD.'){
document.getElementById('stdBox').innerText='';
document.getElementById('stdBox').classList.remove('placeholder');
}

document.getElementById('stdBox').classList.add('active');
document.getElementById('actBox').classList.remove('active');

};

document.getElementById('actBox').onclick=()=>{

if(
document.getElementById('stdBox').innerText===''
){
document.getElementById('stdBox').innerText='STD.';
document.getElementById('stdBox').classList.add('placeholder');
}

activeField='act';

if(angleMode){
    angleStep=0;
    document.getElementById('dotBtn').innerText='°';
}

if(document.getElementById('actBox').innerText==='ACT.'){
document.getElementById('actBox').innerText='';
document.getElementById('actBox').classList.remove('placeholder');
}

document.getElementById('actBox').classList.add('active');
document.getElementById('stdBox').classList.remove('active');

};

function flashBtn(){

const btn = event.target;

btn.classList.add('flash');

setTimeout(()=>{
    btn.classList.remove('flash');
},120);

}
  
function num(n){

flashBtn();

let box=
activeField==='std'
?document.getElementById('stdBox')
:document.getElementById('actBox');

if(
box.innerText==='STD.' ||
box.innerText==='ACT.' ||
box.innerText==='0'
){
box.innerText=n;
box.classList.remove('placeholder');
}else{
box.innerText+=n;
}

calculate();
}

function backspace(){

flashBtn();

let box=
activeField==='std'
?document.getElementById('stdBox')
:document.getElementById('actBox');

if(
box.innerText!=='STD.' &&
box.innerText!=='ACT.'
){
box.innerText=
box.innerText.slice(0,-1);
}

calculate();
}

function calculate(){

    if(currentTool==='Angle'){

        calculateAngle();

    }else{

        calculateNormal();

    }

}

function calculateNormal(){

let std=parseFloat(
document.getElementById('stdBox').innerText
.replace('STD.','')
)||0;

let act=parseFloat(
document.getElementById('actBox').innerText
.replace('ACT.','')
)||0;

let tol=
parseFloat(
document.getElementById('tol')
.value
.replace('±','')
);

if(
document.getElementById('stdBox').innerText==='' ||
document.getElementById('actBox').innerText==='' ||
document.getElementById('stdBox').innerText==='STD.' ||
document.getElementById('actBox').innerText==='ACT.'
){
document.getElementById('result').style.color='#999';
document.getElementById('result').innerHTML='WAITING INPUT';
return;
}

let diff=act-std;

let status=
Math.abs(diff)<=tol
? 'OK'
: 'NG';

document.getElementById('result').style.color=
status==='OK'
? 'green'
: 'red';

document.getElementById('result').innerHTML=
status +
' ' +
(diff>0?'+':'') +
diff.toFixed(2) +
' mm';

}

function calculateAngle(){

const stdText=
document.getElementById('stdBox').innerText;

const actText=
document.getElementById('actBox').innerText;

if(
stdText==='' ||
actText==='' ||
stdText==='STD.' ||
actText==='ACT.'
){
document.getElementById('result').style.color='#999';
document.getElementById('result').innerHTML='WAITING INPUT';
return;
}

const stdSec=angleToSec(stdText);

const actSec=angleToSec(actText);

const tolSec=angleToSec(
document.getElementById('tol').value.replace('±','')
);

const diff=actSec-stdSec;

const status=
Math.abs(diff)<=tolSec
?'OK'
:'NG';

document.getElementById('result').style.color=
status==='OK'
?'green'
:'red';

document.getElementById('result').innerHTML=
status+
' Act. '+
secToAngle(diff);

}

function angleToSec(text){

let d=0;
let m=0;
let s=0;

const deg=text.match(/(\d+)°/);
const min=text.match(/(\d+)'/);
const sec=text.match(/(\d+)"/);

if(deg)d=parseInt(deg[1]);
if(min)m=parseInt(min[1]);
if(sec)s=parseInt(sec[1]);

return d*3600+m*60+s;

}

function secToAngle(sec){

const sign =
sec >= 0 ? '+' : '-';

sec = Math.abs(sec);

const d = Math.floor(sec/3600);

sec %= 3600;

const m = Math.floor(sec/60);

const s = sec % 60;

let txt = sign + d + '°';

if(m > 0 || s > 0){
    txt += String(m).padStart(2,'0') + "'";
}

if(s > 0){
    txt += String(s).padStart(2,'0') + '"';
}

return txt;

}

function setNormalTol(){

document.getElementById('tol').innerHTML=`
<option>±0.10</option>
<option>±0.20</option>
<option>±0.30</option>
<option>±0.40</option>
<option selected>±0.50</option>
<option>±0.70</option>
<option>±1.00</option>
<option>±1.50</option>
<option>±2.00</option>
<option>±2.50</option>
<option>±3.00</option>
`;

}

function setAngleTol(){

document.getElementById('tol').innerHTML=`
<option>±0°00'05"</option>
<option>±0°00'10"</option>
<option selected>±0°00'30"</option>
<option>±0°01'00"</option>
<option>±0°02'00"</option>
<option>±0°03'00"</option>
<option>±0°05'00"</option>
<option>±0°10'00"</option>
<option>±0°15'00"</option>
<option>±0°30'00"</option>
<option>±1°00'00"</option>
<option>±2°00'00"</option>
<option>±3°00'00"</option>
`;

}

function selectTool(btn,name){

    document
    .querySelectorAll('.toolBtn')
    .forEach(b=>b.classList.remove('active'));

    btn.classList.add('active');

currentTool=name;

document.getElementById('stdBox').innerText='STD.';
document.getElementById('actBox').innerText='ACT.';

document.getElementById('stdBox').classList.add('placeholder');
document.getElementById('actBox').classList.add('placeholder');

document.getElementById('result').innerHTML='WAITING INPUT';
document.getElementById('result').style.color='#999';

activeField='std';
document.getElementById('stdBox').classList.add('active');
document.getElementById('actBox').classList.remove('active');

if(name==='Angle'){

    angleMode=true;
    angleStep=0;

    document.getElementById('dotBtn').innerText='°';

    setAngleTol();

}else{

    angleMode=false;

    document.getElementById('dotBtn').innerText='.';

    setNormalTol();
      }
}

function angleChar(){

flashBtn();

if(angleStep===0){

        num('°');
        angleStep=1;
        document.getElementById('dotBtn').innerText="'";

    }else if(angleStep===1){

        num("'");
        angleStep=2;
        document.getElementById('dotBtn').innerText='"';

    }else if(angleStep===2){

        num('"');
        angleStep=3;
        document.getElementById('dotBtn').innerText=' ';

    }

}
  
function saveResult(){

let std=
document.getElementById('stdBox').innerText;

let tol=
document.getElementById('tol').value;

let result=
document.getElementById('result').innerText;

let text=
currentTool+' '+
std+
' '+
tol+
' '+
result+
'.';

window.parent.receiveSpecial(text);

}

calculate();

</script>

</body>
</html>
