<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>HOME</title>

<style>

body{
    margin:0;
    padding:0;
    background:#dfeaf3;
    font-family:Segoe UI,sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
    padding-bottom:90px;
}

.header{
    background:#fff;
    border:1px solid #999;
    padding:20px;
    text-align:center;
    margin-bottom:15px;
}

.system-title{
    font-size:28px;
    font-weight:bold;
}

.status{
    margin-top:10px;
    color:#008000;
    font-weight:bold;
}

.datetime{
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.language-box{
    margin-top:15px;
}

.language-box button{
    width:70px;
    height:36px;
    margin:2px;
    border:none;
    background:#2196f3;
    color:#fff;
    cursor:pointer;
}

.section-title{
    background:#95c11f;
    padding:10px;
    font-size:18px;
    font-weight:bold;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-top:10px;
}

.menu-card{
    height:100px;
    border:none;
    background:#fff;
    border:1px solid #999;
    cursor:pointer;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-size:36px;
    font-weight:bold;
}

.menu-card span{
    font-size:14px;
    margin-top:5px;
}

.summary-grid{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}

.summary-card{
    background:#fff;
    border:1px solid #999;
    padding:15px;
    text-align:center;
}

.summary-number{
    font-size:30px;
    font-weight:bold;
}

.activity{
    background:#fff;
    border:1px solid #999;
    padding:10px;
    margin-top:8px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
    z-index:9999;
}

.bottom-nav button{
    flex:1;
    margin:0;
    padding:0;
    border:none;
    background:#fff;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-size:18px;
}

.bottom-nav button span{
    font-size:10px;
    margin-top:2px;
}

@media(max-width:600px){

    .system-title{
        font-size:22px;
    }

    .menu-card{
        font-size:28px;
        height:90px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <div class="system-title" id="title">
            🏭 INSPECTION SYSTEM
        </div>

        <div class="status" id="status">
            ✅ READY TO WORK
        </div>

        <div class="datetime">
            <div>📅 <span id="todayDate"></span></div>
            <div>🕒 <span id="currentTime"></span></div>
        </div>

        <div class="language-box">

            <button onclick="setLanguage(0)">
                EN
            </button>

            <button onclick="setLanguage(1)">
                TH
            </button>

            <button onclick="setLanguage(2)">
                JP
            </button>

        </div>

    </div>

    <div class="section-title">
        🚀 QUICK MENU
    </div>

    <div class="menu-grid">

        <button class="menu-card"
        onclick="location.href='partproblem.html'">
            🚨
            <span id="m1">PART PROBLEM</span>
        </button>

        <button class="menu-card"
        onclick="location.href='newmodel.html'">
            🆕
            <span id="m2">NEW MODEL</span>
        </button>

        <button class="menu-card"
        onclick="location.href='borrowpl.html'">
            📦
            <span id="m3">BORROW FROM PL</span>
        </button>

        <button class="menu-card"
        onclick="location.href='document.html'">
            📑
            <span id="m4">DOCUMENT</span>
        </button>

        <button class="menu-card"
        onclick="location.href='dashboard.html'">
            📊
            <span id="m5">DASHBOARD</span>
        </button>

        <button class="menu-card"
        onclick="location.href='standard.html'">
            📏
            <span id="m6">STANDARD</span>
        </button>

        <button class="menu-card"
        onclick="location.href='settings.html'">
            ⚙️
            <span id="m7">SETTINGS</span>
        </button>

    </div>

    <br>

    <div class="section-title" id="summaryTitle">
        📊 TODAY SUMMARY
    </div>

    <div class="summary-grid">

        <div class="summary-card">
            <div class="summary-number">3</div>
            <div id="s1">Problem</div>
        </div>

        <div class="summary-card">
            <div class="summary-number">2</div>
            <div id="s2">New Model</div>
        </div>

        <div class="summary-card">
            <div class="summary-number">5</div>
            <div id="s3">Borrow PL</div>
        </div>

        <div class="summary-card">
            <div class="summary-number">1</div>
            <div id="s4">Defect</div>
        </div>

    </div>

    <br>

    <div class="section-title" id="activityTitle">
        📋 RECENT ACTIVITY
    </div>

    <div class="activity">
        08:10 🚨 PART PROBLEM
    </div>

    <div class="activity">
        09:20 📦 BORROW FROM PL
    </div>

    <div class="activity">
        10:35 🆕 NEW MODEL
    </div>

</div>

<div class="bottom-nav">

<button onclick="location.href='home.html'">
🏠
<span>Home</span>
</button>

<button onclick="location.href='dashboard.html'">
📊
<span>Dashboard</span>
</button>

<button onclick="location.href='document.html'">
📝
<span>Document</span>
</button>

<button onclick="location.href='standard.html'">
📏
<span>STD</span>
</button>

<button onclick="location.href='settings.html'">
⚙️
<span>Setting</span>
</button>

</div>

<script>

function updateDateTime(){

    const now = new Date();

    todayDate.innerText =
    now.toLocaleDateString("en-GB");

    currentTime.innerText =
    now.toLocaleTimeString("en-GB",{
        hour:"2-digit",
        minute:"2-digit"
    });

}

setInterval(updateDateTime,1000);
updateDateTime();

function setLanguage(lang){

    localStorage.setItem(
        "language",
        lang
    );

    changeLanguage();

}

function changeLanguage(){

    const lang =
    Number(localStorage.getItem("language")) || 0;

    const text={

        EN:{
            title:"🏭 INSPECTION SYSTEM",
            status:"✅ READY TO WORK",
            summary:"📊 TODAY SUMMARY",
            activity:"📋 RECENT ACTIVITY",
            m1:"PART PROBLEM",
            m2:"NEW MODEL",
            m3:"BORROW FROM PL",
            m4:"DOCUMENT",
            m5:"DASHBOARD",
            m6:"STANDARD",
            m7:"SETTINGS"
        },

        TH:{
            title:"🏭 ระบบตรวจสอบคุณภาพ",
            status:"✅ พร้อมทำงาน",
            summary:"📊 สรุปประจำวัน",
            activity:"📋 รายการล่าสุด",
            m1:"แจ้งปัญหา",
            m2:"NEW MODEL",
            m3:"ยืมชิ้นส่วน",
            m4:"เอกสาร",
            m5:"แดชบอร์ด",
            m6:"มาตรฐาน",
            m7:"ตั้งค่า"
        },

        JP:{
            title:"🏭 検査システム",
            status:"✅ 作業準備完了",
            summary:"📊 本日のサマリー",
            activity:"📋 最近の履歴",
            m1:"不具合連絡",
            m2:"新機種",
            m3:"部品借用",
            m4:"ドキュメント",
            m5:"ダッシュボード",
            m6:"標準",
            m7:"設定"
        }

    };

    const t =
    lang===1 ? text.TH :
    lang===2 ? text.JP :
    text.EN;

    title.innerText = t.title;
    status.innerText = t.status;

    summaryTitle.innerText = t.summary;
    activityTitle.innerText = t.activity;

    m1.innerText = t.m1;
    m2.innerText = t.m2;
    m3.innerText = t.m3;
    m4.innerText = t.m4;
    m5.innerText = t.m5;
    m6.innerText = t.m6;
    m7.innerText = t.m7;

}

changeLanguage();

</script>

</body>
</html>
