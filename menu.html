<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

<title>Inspection Part</title>

<link rel="stylesheet" href="bottom-nav.css">

<style>

html,body{
    touch-action:manipulation;
    overscroll-behavior:none;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    min-height:100vh;
    padding:15px;
    padding-bottom:90px;
}

/* MENU GRID */

.menu-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

/* CARD */

.menu-card{
    position:relative;
    overflow:hidden;

    min-height:155px;
    border-radius:24px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.menu-card:hover{
    transform:translateY(-4px);
}

.menu-card:active{
    transform:scale(.97);
}

/* LIGHT EFFECT */

.menu-card::before{
    content:"";
    position:absolute;

    width:140px;
    height:140px;

    right:-40px;
    top:-40px;

    border-radius:50%;
    background:rgba(255,255,255,.12);
}

.menu-card::after{
    content:"";
    position:absolute;

    width:220px;
    height:220px;

    right:-100px;
    bottom:-120px;

    border-radius:50%;
    background:rgba(255,255,255,.08);
}

/* ICON */

.icon{
    font-size:52px;
    margin-bottom:14px;
    z-index:2;
}

/* TEXT */

.menu-card span{
    z-index:2;
    color:#fff;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    padding:0 10px;
    line-height:1.25;
}

/* COLORS */

.report-card{
    background:linear-gradient(135deg,#1488ff,#00c6ff);
}

.newmodel-card{
    background:linear-gradient(135deg,#3ddc84,#00d4aa);
}

.pl-card{
    background:linear-gradient(135deg,#ffb347,#ff8c37);
}

.trial-card{
    background:linear-gradient(135deg,#6a5cff,#8577ff);
}

.wash-card{
    background:linear-gradient(135deg,#00c9d8,#28d8e3);
}

.dashboard-card{
    background:linear-gradient(135deg,#ff6b88,#ff7b54);
}

.document-card{
    background:linear-gradient(135deg,#7f66ff,#5d54ff);
}

.standard-card{
    background:linear-gradient(135deg,#ffd54f,#ffb300);
}

/* MOBILE */

@media(max-width:768px){

    .menu-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .menu-card{
        min-height:135px;
    }

    .icon{
        font-size:44px;
    }

    .menu-card span{
        font-size:13px;
    }
}

/* SMALL MOBILE */

@media(max-width:420px){

    .menu-card{
        min-height:120px;
    }

    .icon{
        font-size:38px;
    }

    .menu-card span{
        font-size:12px;
    }
}

/* Bottom Nav */

.bottom-nav button,
.bottom-nav button span{
    font-weight:400 !important;
}

</style>
</head>

<body>

<div class="menu-grid">

    <div class="menu-card report-card"
        onclick="location.href='part-problem-report.html'">

    </div>

    <div class="menu-card newmodel-card"

    <div class="menu-card document-card"

    <div class="menu-card standard-card"
