<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no">

<title>Inspection Part</title>

<style>

html, body{
    touch-action: manipulation;
    overscroll-behavior: none;
}

*{
    -webkit-tap-highlight-color: transparent;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    padding-bottom:80px;
}

/* HEADER */

.header{
    background:#009688;
    color:#fff;
    padding:12px 15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:999;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    object-fit:contain;
}

#appTitle{
    font-size:20px;
    font-weight:bold;
}

.lang-btn{
    border:none;
    background:#fff;
    color:#009688;
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* MENU */

.menu-grid{

    padding:15px;

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;
}

.menu-card{
    height:100px;
    min-height:100px;
    background:#fff;
    border:1px solid #999;
    border-radius:8px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:5px;
    cursor:pointer;

    box-shadow:none;
    transition:.2s;
}

.menu-card:hover{
    transform:translateY(-3px);
}

.icon{
    font-size:28px;
}

.menu-card span{
    text-align:center;
    font-size:14px;
    padding:0 8px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#fff;
    border-top:1px solid #ccc;
    display:flex;
    z-index:9999;
}

.bottom-nav button{
    flex:1;
    margin:0;
    padding:0;
    border:none;
    background:#fff;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-size:18px;
    font-weight:normal;
}

.bottom-nav button span{
    font-size:10px;
    margin-top:2px;
    line-height:1;
}

.bottom-nav button:active{
    background:#f1f1f1;
}

.nav-icon{
    font-size:14px;
}

/* MOBILE */

@media(max-width:768px){

    .menu-grid{
        grid-template-columns:repeat(4,1fr);
        gap:6px;
    }

    .menu-card{
        height:85px;
        min-height:85px;
    }

    .icon{
        font-size:24px;
    }

    .menu-card span{
        font-size:9px;
        line-height:1.1;
        padding:0 2px;
    }

    .logo{
        width:30px;
        height:30px;
    }

    #appTitle{
        font-size:12px;
    }

    .lang-btn{
        padding:6px 8px;
        font-size:12px;
    }

.summary-grid{
    grid-template-columns:repeat(2,1fr);
}

.summary-number{
    font-size:24px;
}

.section-title{
    font-size:16px;
}

.activity{
    padding:12px;
}

}

input,
select,
textarea{
    font-size:16px !important;
}

.section-title{
    background:#95c11f;
    color:#000;
    padding:12px;
    font-size:18px;
    font-weight:bold;
    margin:15px;
    margin-bottom:10px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:0 15px 15px;
}

.summary-card{
    background:#fff;
    border:1px solid #999;
    padding:15px;
    text-align:center;
}

.summary-number{
    font-size:32px;
    font-weight:bold;
    margin-bottom:5px;
}

.activity{
    background:#fff;
    border:1px solid #999;
    padding:15px;
    margin:0 15px 10px;
}
    
</style>
</head>

<body>

<div class="header">

    <div class="logo-area">

        <img src="icon-192.png" class="logo">

        <span id="appTitle">
            INSPECTION PART
        </span>

    </div>

    <button class="lang-btn"
        onclick="changeLanguage()">
        🌐 TH | EN
    </button>

</div>

<div class="menu-grid">

    <button class="menu-card"
        onclick="location.href='part-problem-report.html'">

        <div class="icon">📋</div>

        <span id="reportText">
            PART PROBLEM REPORT
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='part-problem-newmodel.html'">

        <div class="icon">📦</div>

        <span id="newModelText">
            PART PROBLEM NEW MODEL
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='part-borrowing-pl.html'">

        <div class="icon">📨</div>

        <span id="borrowText">
            PART BORROWING FROM PL
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='assembly-trial.html'">

        <div class="icon">🧪</div>

        <span id="trialText">
            ASSEMBLY TRIAL
        </span>

    </button>

    <button class="menu-card"
        onclick="location.href='washing-room.html'">

        <div class="icon">🧼</div>

        <span id="washText">
            WASHING ROOM
        </span>

    </button>

    <button class="menu-card"
onclick="location.href='dashboard.html'">

    <div class="icon">📊</div>

    <span id="dashboardText">
        DASHBOARD
    </span>

</button>

<button class="menu-card"
onclick="location.href='document.html'">

    <div class="icon">📄</div>

    <span id="documentText">
        DOCUMENT
    </span>

</button>

<button class="menu-card"
onclick="location.href='standard.html'">

    <div class="icon">📏</div>

    <span id="standardText">
        STANDARD
    </span>

</button>

<button class="menu-card"
onclick="location.href='settings.html'">

    <div class="icon">⚙️</div>

    <span id="settingText">
        SETTINGS
    </span>

</button>

</div>

<div class="section-title">
    📊 TODAY SUMMARY
</div>

<div class="summary-grid">

    <div class="summary-card">
        <div class="summary-number">3</div>
        <div>Problem</div>
    </div>

    <div class="summary-card">
        <div class="summary-number">2</div>
        <div>New Model</div>
    </div>

    <div class="summary-card">
        <div class="summary-number">5</div>
        <div>Borrow PL</div>
    </div>

    <div class="summary-card">
        <div class="summary-number">1</div>
        <div>Defect</div>
    </div>

</div>

<div class="section-title">
    📋 RECENT ACTIVITY
</div>

<div class="activity">
    08:10 🚨 PART PROBLEM
</div>

<div class="activity">
    09:20 📦 BORROW FROM PL
</div>

<div class="activity">
    10:35 🆕 NEW MODEL
</div>

<div class="bottom-nav">

    <button onclick="location.href='menu.html'">
        🏠
        <span>Home</span>
    </button>

    <button onclick="location.href='dashboard.html'">
        📊
        <span>Dashboard</span>
    </button>

    <button onclick="location.href='document.html'">
        📝
        <span>Document</span>
    </button>

    <button onclick="location.href='standard.html'">
        📏
        <span>STD</span>
    </button>

    <button onclick="location.href='settings.html'">
        ⚙️
        <span>Setting</span>
    </button>

</div>

<script>

let currentLang="en";

function changeLanguage(){

    currentLang=
    currentLang==="en"?"th":"en";

    if(currentLang==="th"){

        appTitle.innerText="ระบบ Inspection Part";

        reportText.innerText="แจ้งปัญหา";
        newModelText.innerText="ปัญหา New Model";
        borrowText.innerText="ยืมชิ้นส่วนจาก PL";
        trialText.innerText="ประกอบทดลอง";
        washText.innerText="ห้องล้าง";

    }else{

        appTitle.innerText="INSPECTION PART";

        reportText.innerText="PART PROBLEM REPORT";
        newModelText.innerText="PART PROBLEM NEW MODEL";
        borrowText.innerText="PART BORROWING FROM PL";
        trialText.innerText="ASSEMBLY TRIAL";
        washText.innerText="WASHING ROOM";

    }

}

</script>

<script>
document.addEventListener('gesturestart', function(e){
    e.preventDefault();
});

let lastTouchEnd = 0;

document.addEventListener('touchend', function(e){

    const now = Date.now();

    if(now - lastTouchEnd <= 300){
        e.preventDefault();
    }

    lastTouchEnd = now;

},{passive:false});
</script>

</body>
</html>
